; open-simh-extended/tests/dmc_boot/d1.ini  v1
; Known issue 116 (patch 25): the DMC11 line listens on 21397 and has a
; PEER where nobody listens (21398); BOOT DMC0 raises DTR and the bootstrap
; asks for a program.  deadconn.py 21397 makes connections and closes them,
; then a live one, which must get the Request Program within 3.5 s.
set cpu 11/34
set cpu 64k
set dmc enable
set dmc0 type=dmc
set dmc0 peer=127.0.0.1:21398
attach dmc0 21397
set debug d1.dbg
set dmc debug=CONNECT
set runlimit 25 seconds
boot dmc0
