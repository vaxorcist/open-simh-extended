; open-simh-extended/tests/debna/p1.ini  v1
; DEBNA phase P1: VMS V4.7 on the VAX 8200 boots from the KDB50 (a copy of
; Ulli's VMS047_1.R81, SYSTEM/MANAGER) with the DEBNA enabled (device ET,
; BI node 7), attached to a UDP port with no partner (frames go nowhere,
; as on an empty Ethernet).  Checks that VMS configures the DEBNA and
; starts its port:
;   - SYSGEN SHOW/ADAPTER: "7  BI - AIE Adapter with NI port only";
;   - SHOW DEVICE ETA0;
;   - DECnet on line/circuit BNT-0 (VMS V4.7 names the DEBNA line after
;     the DEBNT): NCP SHOW LINE BNT-0 CHARACTERISTICS (hardware address =
;     SHOW ET MAC), circuit up, after 40 s the line counters (multicast
;     hellos sent, no failures); no circuit fault.
; Debug: port instructions and messages in p1.dbg.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 p1.ini > p1.out < /dev/null
set cpu 16m
set kdb0 ra81
attach kdb0 VMS047_1.R81
set et enable
attach et udp:5111:localhost:5112
show et
set debug -t p1.dbg
set et debug=port;msg
set runlimit 900 seconds
expect "HH:MM)" send "16-NOV-2026 12:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"OPEN/WRITE F G.COM\rWRITE F \"$ RUN SYS$SYSTEM:SYSGEN\"\rWRITE F \"SHOW/ADAPTER\"\rWRITE F \"EXIT\"\rCLOSE F\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=200000,"@G\rSHOW DEVICE ETA0\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=200000,"MC NCP PURGE KNOWN CIRCUITS ALL\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=200000,"MC NCP PURGE KNOWN LINES ALL\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=200000,"MC NCP DEFINE LINE BNT-0 STATE ON\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=200000,"MC NCP DEFINE CIRCUIT BNT-0 STATE ON\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=200000,"MC NCP DEFINE EXECUTOR STATE ON\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" send after=200000,"@SYS$MANAGER:STARTNET\rWRITE SYS$OUTPUT \"=M8\",\"END=\"\r"; continue
expect "=M8END=" send after=200000,"WAIT 00:00:40\rWRITE SYS$OUTPUT \"=M9\",\"END=\"\r"; continue
expect "=M9END=" send after=200000,"MC NCP SHOW LINE BNT-0 CHARACTERISTICS\rWRITE SYS$OUTPUT \"=MA\",\"END=\"\r"; continue
expect "=MAEND=" send after=200000,"MC NCP SHOW KNOWN CIRCUITS\rWRITE SYS$OUTPUT \"=MB\",\"END=\"\r"; continue
expect "=MBEND=" send after=200000,"MC NCP SHOW LINE BNT-0 COUNTERS\rWRITE SYS$OUTPUT \"=MC\",\"END=\"\r"; continue
expect "=MCEND=" echof "\n*** done"; exit
boot kdb0
