; open-simh-extended/tests/debna/p3_8300.ini  v1
; DEBNA phase P3: the P2 test (p2_8200.ini) on a VAX 8300 (SET KA1 ENABLE)
; with both CPUs busy: VMS starts the attached processor (START/CPU),
; builds LOOP.EXE (a CPU-bound MACRO-32 loop, as tests/kdb50/p4.ini) and
; runs it in two subprocesses; then the DECnet test against the MicroVAX
; II (p2_mv2.ini): copy to MV2 and back with DIFFERENCES, remote DIRECTORY,
; NCP LOOP, SET HOST, counters; SHOW CPU and SHOW SYSTEM at the end.
; Run with p2.sh (5th argument p3_8300.ini).
set cpu 16m
set ka1 enable
set kdb0 ra81
attach kdb0 VMS047_1.R81
set et enable
attach et udp:5101:localhost:5102
set debug -t p3.dbg
set et debug=port;msg
set runlimit 2400 seconds
expect "HH:MM)" send "16-NOV-2026 11:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"DEFINE/SYSTEM/EXEC MP MP8SS\rCOPY SYS$SYSTEM:MP_8SS.EXE SYS$SYSTEM:MP8SS.EXE\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"START/CPU\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"OPEN/WRITE F LOOP.MAR\rWRITE F \"        .ENTRY  START,^M<>\"\rWRITE F \"        MOVL    #4000000,R0\"\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=500000,"WRITE F \"10$:    SOBGTR  R0,10$\"\rWRITE F \"        MOVL    #1,R0\"\rWRITE SYS$OUTPUT \"=M3A\",\"END=\"\r"; continue
expect "=M3AEND=" send after=500000,"WRITE F \"        RET\"\rWRITE F \"        .END    START\"\rCLOSE F\rWRITE SYS$OUTPUT \"=M3B\",\"END=\"\r"; continue
expect "=M3BEND=" send after=500000,"MACRO LOOP\rLINK LOOP\rWRITE SYS$OUTPUT \"=M3C\",\"END=\"\r"; continue
expect "=M3CEND=" send after=500000,"OPEN/WRITE F L.COM\rWRITE F \"$ L: RUN SYS$LOGIN:LOOP\"\rWRITE F \"$ GOTO L\"\rCLOSE F\rWRITE SYS$OUTPUT \"=M3D\",\"END=\"\r"; continue
expect "=M3DEND=" send after=500000,"SPAWN/NOWAIT/OUTPUT=NL: @L\rSPAWN/NOWAIT/OUTPUT=NL: @L\rWAIT 00:00:20\rSHOW CPU\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=500000,"MC NCP PURGE KNOWN CIRCUITS ALL\rWRITE SYS$OUTPUT \"=B1\",\"END=\"\r"; continue
expect "=B1END=" send after=200000,"MC NCP PURGE KNOWN LINES ALL\rWRITE SYS$OUTPUT \"=B2\",\"END=\"\r"; continue
expect "=B2END=" send after=200000,"MC NCP DEFINE LINE BNT-0 STATE ON\rWRITE SYS$OUTPUT \"=B3\",\"END=\"\r"; continue
expect "=B3END=" send after=200000,"MC NCP DEFINE CIRCUIT BNT-0 STATE ON\rWRITE SYS$OUTPUT \"=B4\",\"END=\"\r"; continue
expect "=B4END=" send after=200000,"MC NCP DEFINE EXECUTOR STATE ON\rWRITE SYS$OUTPUT \"=B5\",\"END=\"\r"; continue
expect "=B5END=" send after=200000,"@SYS$MANAGER:STARTNET\rWRITE SYS$OUTPUT \"=B6\",\"END=\"\r"; continue
expect "=B6END=" send after=200000,"OPEN/WRITE F R.COM\rWRITE F \"$ SET NOON\"\rWRITE F \"$ N=0\"\rWRITE F \"$L: N=N+1\"\rWRITE F \"$ DIRECTORY MV2\"\"SYSTEM MANAGER\"\"::SYS$SYSTEM:SYSGEN.EXE\"\rWRITE F \"$ IF $STATUS THEN EXIT\"\rWRITE F \"$ IF N .GT. 12 THEN EXIT\"\rWRITE F \"$ WAIT 00:00:10\"\rWRITE F \"$ GOTO L\"\rCLOSE F\rWRITE SYS$OUTPUT \"=B7\",\"END=\"\r"; continue
expect "=B7END=" send after=200000,"@R\rWRITE SYS$OUTPUT \"=B8\",\"END=\"\r"; continue
expect "=B8END=" send after=200000,"MC NCP SHOW KNOWN NODES\rMC NCP SHOW ADJACENT NODES\rWRITE SYS$OUTPUT \"=B9\",\"END=\"\r"; continue
expect "=B9END=" send after=200000,"COPY SYS$HELP:HELPLIB.HLB MV2\"SYSTEM MANAGER\"::HELP8200.TMP\rWRITE SYS$OUTPUT \"=C1\",\"END=\"\r"; continue
expect "=C1END=" send after=200000,"COPY MV2\"SYSTEM MANAGER\"::HELP8200.TMP SYS$LOGIN:HELPBACK.TMP\rWRITE SYS$OUTPUT \"=C2\",\"END=\"\r"; continue
expect "=C2END=" send after=200000,"DIFFERENCES SYS$HELP:HELPLIB.HLB SYS$LOGIN:HELPBACK.TMP\rWRITE SYS$OUTPUT \"=C3\",\"END=\"\r"; continue
expect "=C3END=" send after=200000,"DIRECTORY/SIZE/DATE MV2\"SYSTEM MANAGER\"::HELP8200.TMP\rWRITE SYS$OUTPUT \"=C4\",\"END=\"\r"; continue
expect "=C4END=" send after=200000,"MC NCP LOOP NODE MV2 COUNT 50 LENGTH 1000\rWRITE SYS$OUTPUT \"=C5\",\"END=\"\r"; continue
expect "=C5END=" send after=200000,"SET HOST MV2\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "on node MV2" send after=2000000,"SHOW LOGICAL SYS$NODE\rLOGOUT\r"; continue
expect "control returned" send after=2000000,"WRITE SYS$OUTPUT \"=C6\",\"END=\"\r"; continue
expect "=C6END=" send after=200000,"MC NCP SHOW LINE BNT-0 COUNTERS\rWRITE SYS$OUTPUT \"=C7\",\"END=\"\r"; continue
expect "=C7END=" send after=200000,"SHOW CPU\rSHOW SYSTEM\rCOPY SYS$LOGIN:R.COM MV2\"SYSTEM MANAGER\"::DONE.TMP\rWRITE SYS$OUTPUT \"=C8\",\"END=\"\r"; continue
expect "=C8END=" echof "\n*** 8200 done"; exit
boot kdb0
