; open-simh-extended/tests/dmv11_boot/r4.ini  v1
; R4 DMC11 remote load detect without a boot ROM: DMC0 TYPE=DMC, password
; 123 octal (switch pack no. 2), boot ROM offset 377 words as shipped (boot
; address 173776, nothing there).  The PDP-11/70 runs a loop with SP 1000
; (the takeover pushes PC and PSW).  The DMC11 loads the program itself:
; Request Program 8,12,1 (device type 12, no program type).  A wrong
; password is ignored first (mopctl.py 21123 --dmrpw --devtype 12 --shortreq).
set cpu 11/70
set cpu 256k
set dmc enable
set dmc0 type=dmc
set dmc0 password=123
set dmc0 peer=127.0.0.1:21023
attach dmc0 21123
set debug r4.dbg
set dmc debug=INFO;WARN
dep 2000 012706
dep 2002 001000
dep 2004 000777
go 2000
do common_check.ini dmc0
