; open-simh-extended/tests/dmv11_boot/r9.ini  v1
; R9 BOOT DMC0 on a DMR11 (TYPE=DMR) with SET DMC0 PROGRAM=TERTIARY and only
; 64 KB of memory (the bootstrap then lies at 140000-157777, below 160000):
; Request Program 8,40,1,1 (device type 40, tertiary loader); mopctl.py
; 21128 --listen --devtype 40 --progtype 1 loads the test program; DMR BOOT
; OK, HALT at 1030 (PC 001032); at the start R1 = the DMR11's CSR, SP 1000.
set cpu 11/34
set cpu 64k
set dmc enable
set dmc0 type=dmr
set dmc0 program=tertiary
set dmc0 peer=127.0.0.1:21028
attach dmc0 21128
set debug r9.dbg
set dmc debug=INFO;WARN
break 1000
boot dmc0
echo START-REGS
exa r1,sp,psw
nobreak 1000
continue
do common_check.ini dmc0
show dmc address
