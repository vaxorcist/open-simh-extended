; open-simh-extended/tests/dmv11_boot/r8.ini  v1
; R8 BOOT DMC0 on a DMC11 (TYPE=DMC): SIMH's built-in MOP bootstrap (patch
; 24) instead of a DECnet boot ROM.  It lies in the 8 KB below 160000,
; master-clears the board, puts it into maintenance mode and asks for the
; program: Request Program 8,12,1,0 (device type 12, secondary loader).
; mopctl.py 21127 --listen --ignorefirst --devtype 12 ignores the first
; request (the bootstrap asks again after about 5 s), then sends load 0
; (0-777, a pattern), load 1 (the test program at 1000) and load 2 with the
; transfer address 1000, checking each Request Memory Load.  At the start
; (breakpoint at 1000) R1 is the CSR and SP 1000; the program prints DMC
; BOOT OK and halts at 1030 (PC 001032).
set cpu 11/70
set cpu 256k
set dmc enable
set dmc0 type=dmc
set dmc0 peer=127.0.0.1:21027
attach dmc0 21127
set debug r8.dbg
set dmc debug=INFO;WARN
break 1000
boot dmc0
echo START-REGS
exa r1,sp,psw
nobreak 1000
continue
do common_check.ini dmc0
