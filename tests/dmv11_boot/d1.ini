; open-simh-extended/tests/dmv11_boot/d1.ini  v1
; D1 BOOT DUP0 on a DUP11 (patch 28): SIMH's MOP bootstrap for the DUP11
; lies in the 8 KB below 160000, sets the line up for DDCMP (DEC mode, CRC
; by the board) and asks for the program: Request Program 8,10,1,0 (device
; type 10, secondary loader, the default of SET DUPn PROGRAM).
; mopctl.py 21131 --listen --ignorefirst --devtype 10 ignores the first
; request (the bootstrap asks again after about 5 s), then sends load 0
; (0-777, a pattern), load 1 (the test program at 1000) and load 2 with the
; transfer address 1000, checking each Request Memory Load.  At the start
; (breakpoint at 1000) R1 is the CSR (160050) and SP 1000; the program
; prints DUP BOOT OK and halts at 1030 (PC 001032).
set cpu 11/70
set cpu 256k
set dup enable
attach dup0 21131,connect=127.0.0.1:21031
set debug d1.dbg
set dup debug=INT
break 1000
boot dup0
echo START-REGS
exa r1,sp,psw
nobreak 1000
continue
do common_check.ini dup0
