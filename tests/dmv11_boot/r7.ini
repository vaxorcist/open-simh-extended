; open-simh-extended/tests/dmv11_boot/r7.ini  v1
; R7 remote load detect into DEC's M9312 'XM' DECnet boot ROM, DMC11 (TYPE=DMC): boot ROM offset 002 (words),
; i.e. the ROM's entry 173004 (unit 0, no diagnostics), password 123.  The
; image m9312_xm.bin (sockets 1-3, 173000-173577) is built by
; tools/m9312_lst2bin.py from AK6DN's listings (see README.txt); it is not
; part of the repository.  The ROM resets the bus, finds the board at its
; floating CSR, puts it into maintenance mode and asks for the program
; (Request Program 8,12,1,0); mopctl.py 21126 --rom sends one Memory Load
; with Transfer Address, which the ROM stores at 0 and starts at 6: the
; program prints its text and halts at 34 (PC 000036).
set cpu 11/70
set cpu 256k
set dmc enable
set dmc0 type=dmc
set dmc0 password=123
set dmc0 bootoffset=2
set rom0 address=17773000
attach rom0 m9312_xm.bin
set dmc0 peer=127.0.0.1:21026
attach dmc0 21126
set debug r7.dbg
set dmc debug=INFO;WARN;CONNECT;MODEM
show dmc0 switches
show dmc address
dep 2000 012706
dep 2002 001000
dep 2004 000777
go 2000
