; open-simh-extended/tests/dmv11_boot/r3.ini  v2 (v2: the DMC11 has its switch packs (known issue 99): defaults instead of the refusal)
; R3 DMC11/DMR11 switch checks: the DMC11's line unit packs no. 2 and no. 3
; default to 377 (shipped all OFF); values must be octal 0-377; the DMR11's
; offset is in bytes, the DMC11's in words.
set cpu 11/70
set dmc enable
set dmc0 type=dmc
echo R3-A (DMC11 defaults)
show dmc0 password
show dmc0 bootoffset
show dmc0 switches
set dmc0 bootoffset=10
show dmc0 switches
set dmc0 type=dmr
echo R3-B (password 400)
set dmc0 password=400
echo R3-C (bootoffset 9)
set dmc0 bootoffset=9
set dmc0 bootoffset=356
show dmc0 bootoffset
show dmc0 password
echo R3-END
