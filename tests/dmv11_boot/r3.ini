; open-simh-extended/tests/dmv11_boot/r3.ini  v1
; R3 DMC11/DMR11 switch refusals: the DMC11's line unit switches are not
; simulated (TYPE=DMC); DMR11 values must be octal 0-377.
set cpu 11/70
set dmc enable
set dmc0 type=dmc
echo R3-A (DMC11 password)
set dmc0 password=5
set dmc0 type=dmr
echo R3-B (password 400)
set dmc0 password=400
echo R3-C (bootoffset 9)
set dmc0 bootoffset=9
set dmc0 bootoffset=356
show dmc0 bootoffset
show dmc0 password
echo R3-END
