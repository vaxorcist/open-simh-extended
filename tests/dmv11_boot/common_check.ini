; open-simh-extended/tests/dmv11_boot/common_check.ini  v3 (v3: 774-776 instead of 400-402: the DMV11's start trap now pushes there, SP 1000; v2: also 400, 402)
; After the loaded test program has halted: the words the program loaded at
; 24-26, 34-36, 40 and 774-776 must be its own (pattern 100012, 100013, 100016,
; 100017, 100020, 100376, 100377), and the CPU state after the start (PSW priority 7).
echo CHECK-BEGIN
exa 24
exa 26
exa 34
exa 36
exa 40
exa 774
exa 776
exa PSW
exa MMR0
show dmv0 switches
echo CHECK-END
