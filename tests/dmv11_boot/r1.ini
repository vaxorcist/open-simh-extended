; open-simh-extended/tests/dmv11_boot/r1.ini  v1
; R1 DMR11 remote load detect without a boot ROM: DMC0 TYPE=DMR, password
; 123 (octal), the PDP-11/70 runs a loop with SP 1000
; (the takeover pushes PC and PSW: SP 0 gives a red stack trap on an 11/70).  No ROM answers at 173000, so the
; DMR11 does the MOP load itself (Request Program, device type 40).  A wrong
; password is ignored first (mopctl.py 21121 --dmrpw --devtype 40).
set cpu 11/70
set cpu 256k
set dmc enable
set dmc0 type=dmr
set dmc0 password=123
set dmc0 peer=127.0.0.1:21021
attach dmc0 21121
set debug r1.dbg
set dmc debug=INFO;WARN
dep 2000 012706
dep 2002 001000
dep 2004 000777
go 2000
do common_check.ini dmc0
