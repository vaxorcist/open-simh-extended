; open-simh-extended/tests/dmv11_boot/r2.ini  v1
; R2 DMR11 remote load detect with a boot ROM: DMC0 TYPE=DMR, password 123,
; bootstrap offset 020; a ROM (r2rom.bin, written by run_tests.sh) at
; 173000 holds MOV #123456,R0 and HALT at 173020.  The Enter MOP Mode must
; put 173020 into 24 and 0 into 26 and restart the CPU there (power-up
; recovery); no MOP answer (mopctl.py 21122 --noload).
set cpu 11/70
set cpu 256k
set dmc enable
set dmc0 type=dmr
set dmc0 password=123
set dmc0 bootoffset=20
set rom0 address=17773000
attach rom0 r2rom.bin
set dmc0 peer=127.0.0.1:21022
attach dmc0 21122
set debug r2.dbg
set dmc debug=INFO;WARN
show dmc0 switches
dep 2000 012706
dep 2002 001000
dep 2004 000777
go 2000
echo CHECK-BEGIN
exa 24
exa 26
exa R0
show dmc0 switches
echo CHECK-END
