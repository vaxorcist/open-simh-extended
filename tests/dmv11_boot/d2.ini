; open-simh-extended/tests/dmv11_boot/d2.ini  v1
; D2 BOOT DUP0 with SET DUP0 PROGRAM=SYSTEM and 64 KB of memory (patch 28):
; SIMH's MOP bootstrap for the DUP11 lies in the 8 KB below 160000 and asks
; for the system image: Request Program 8,10,1,2.  mopctl.py 21132 --listen
; --devtype 10 --progtype 2 answers the first request at once: load 0
; (0-777, a pattern), load 1 (the test program at 1000) and load 2 with the
; transfer address 1000, checking each Request Memory Load.  At the start
; (breakpoint at 1000) R1 is the CSR (160050) and SP 1000; the program
; prints DUP BOOT OK and halts at 1030 (PC 001032).
set cpu 11/70
set cpu 64k
set dup enable
set dup0 program=system
attach dup0 21132,connect=127.0.0.1:21032
set debug d2.dbg
set dup debug=INT
break 1000
boot dup0
echo START-REGS
exa r1,sp,psw
nobreak 1000
continue
do common_check.ini dup0
