; open-simh-extended/tests/dmv11_boot/r5.ini  v1
; R5 DMC11 remote load detect with a boot ROM: DMC0 TYPE=DMC, password 123,
; boot ROM offset 010 words (switch pack no. 3) = 173020; a ROM (r2rom.bin,
; written by run_tests.sh) at 173000 holds MOV #123456,R0 and HALT at
; 173020.  The Enter MOP Mode must put 173020 into 24 and 0 into 26 and
; restart the CPU there (power-up recovery); no MOP answer (mopctl.py 21124
; --noload).
set cpu 11/70
set cpu 256k
set dmc enable
set dmc0 type=dmc
set dmc0 password=123
set dmc0 bootoffset=10
set rom0 address=17773000
attach rom0 r2rom.bin
set dmc0 peer=127.0.0.1:21024
attach dmc0 21124
set debug r5.dbg
set dmc debug=INFO;WARN
show dmc0 switches
dep 2000 012706
dep 2002 001000
dep 2004 000777
go 2000
echo CHECK-BEGIN
exa 24
exa 26
exa R0
show dmc0 switches
echo CHECK-END
