; open-simh-extended/tests/dmv11_boot/p1.ini  v1
; P1 DMP11 power-on boot, point-to-point (FDXPOINT), BOOT DMP0 on a Unibus
; PDP-11/70: the DMP11 asks for the program with MOP device type 18; the
; control station (mopctl.py 21111 --devtype 18) does not answer the first
; Request Program.
set cpu 11/70
set cpu 256k
set dmp enable
set dmp0 mode=fdxpoint
set dmp0 poweronboot
set dmp0 peer=127.0.0.1:21011
attach dmp0 21111
set debug p1.dbg
set dmp debug=INFO;WARN;CONNECT;MODEM;DATASUM
boot dmp0
do common_check.ini dmp0
