; open-simh-extended/tests/dmv11_boot/t5.ini  v2 (v2: echo lines name the case)
; T5 BOOT DMV0 refusals (attached unit): power-on boot switch off, mode set
; by software, control station, multipoint tributary without a switch
; address.  Each BOOT must print its message and not start the CPU.
set cpu 11/73
set dmv enable
attach dmv0 21105
echo T5-A (power-on boot switch off)
boot dmv0
set dmv0 poweronboot
echo T5-B (mode set by software)
boot dmv0
set dmv0 mode=fdxcontrol
echo T5-C
boot dmv0
set dmv0 mode=hdxtributary
echo T5-D
boot dmv0
echo T5-END
show dmv0 switches
