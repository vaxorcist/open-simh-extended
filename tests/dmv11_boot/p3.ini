; open-simh-extended/tests/dmv11_boot/p3.ini  v1
; P3 DMP11 invoke primary MOP, point-to-point (FDXPOINT): the program sets
; the boot and master clear bits (BSEL1 bits 5 and 6: MOV #60000 to SEL0,
; CSR 160300 with only the DMP enabled) and loops (SP 1000: the takeover pushes PC and PSW); the DMP11 boots the host
; as with the power-on boot (mopctl.py 21113 polls).
set cpu 11/70
set cpu 256k
set dmp enable
show dmp address
set dmp0 mode=fdxpoint
set dmp0 peer=127.0.0.1:21013
attach dmp0 21113
set debug p3.dbg
set dmp debug=INFO;WARN
dep 2000 012706
dep 2002 001000
dep 2004 012737
dep 2006 060000
dep 2010 160300
dep 2012 000777
go 2000
do common_check.ini dmp0
