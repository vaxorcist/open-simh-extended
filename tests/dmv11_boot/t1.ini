; open-simh-extended/tests/dmv11_boot/t1.ini  v2 (common_check.ini gets the unit)
; T1 power-on boot, point-to-point (FDXPOINT), BOOT DMV0; the control
; station (mopctl.py 21001) does not answer the first Request Program.
set cpu 11/73
set cpu 256k
set dmv enable
set dmv0 mode=fdxpoint
set dmv0 poweronboot
set dmv0 peer=127.0.0.1:21001
attach dmv0 21101
set debug t1.dbg
set dmv debug=INFO;WARN;CONNECT;MODEM;DATASUM
boot dmv0
do common_check.ini dmv0
