; open-simh-extended/tests/dmv11_boot/r10.ini  v1
; R10 BOOT DMCn refusals and help (patch 24): a line that is not attached
; ("Unit not attached"), a line beyond the configured ones; HELP DMC
; BOOTING shows the BOOT command topic, HELP BOOT lists the DMC device.
set cpu 11/70
set dmc enable
boot dmc0
boot dmc7
help dmc booting
help dmc booting boot_command
help boot
echo R10 END
