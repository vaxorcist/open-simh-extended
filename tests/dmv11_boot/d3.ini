; open-simh-extended/tests/dmv11_boot/d3.ini  v1
; D3 BOOT DUPn refusals and settings (patch 28): a line that is not
; attached ("Unit not attached"), a line beyond the configured ones
; ("Invalid argument"), SET DUP0 PROGRAM with a wrong value ("Invalid
; argument"), SHOW DUP0 PROGRAM after SET (program=TERTIARY), HELP DUP
; BOOTING; SET DUP DEBUG=TRC with a message ended by clearing SEND (known
; issue 125: no crash) is checked by D1's trace.
set cpu 11/70
set dup enable
boot dup0
boot dup5
set dup0 program=bogus
set dup0 program=tertiary
show dup0 program
help dup booting
echo D3 END
