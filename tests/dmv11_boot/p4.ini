; open-simh-extended/tests/dmv11_boot/p4.ini  v1
; P4 BOOT DMP0 refusals and DMP11 switch checks (attached unit): power-on
; boot switch off (E121 SW10 OFF, the default), mode set by software,
; control station, unit number out of range.  Each BOOT must print its
; message and not start the CPU.
set cpu 11/70
set dmp enable
attach dmp0 21114
echo P4-A (power-on boot switch off)
boot dmp0
set dmp0 poweronboot
echo P4-B (mode set by software)
boot dmp0
set dmp0 mode=fdxcontrol
echo P4-C (control station)
boot dmp0
echo P4-D (unit number 16)
set dmp0 bootunit=16
set dmp0 bootunit=15
echo P4-END
show dmp0 switches
