; open-simh-extended/tests/dmv11_boot/t2.ini  v2 (common_check.ini gets the unit)
; T2 power-on boot, multipoint tributary 5 (FDXTRIBUTARY, TRIBUTARY=5):
; a poll for address 6 is ignored; duplicate and out-of-sequence loads.
set cpu 11/73
set cpu 256k
set dmv enable
set dmv0 mode=fdxtributary
set dmv0 tributary=5
set dmv0 poweronboot
set dmv0 peer=127.0.0.1:21002
attach dmv0 21102
set debug t2.dbg
set dmv debug=INFO;WARN
boot dmv0
do common_check.ini dmv0
