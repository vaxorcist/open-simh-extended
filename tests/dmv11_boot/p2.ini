; open-simh-extended/tests/dmv11_boot/p2.ini  v1
; P2 DMP11 remote load detect, multipoint tributary 5 (FDXTRIBUTARY,
; TRIBUTARY=5, REMOTELOAD) on a PDP-11/70 that runs a loop (MOV #1000,SP; BR . at 2000):
; a wrong password is ignored, then Enter MOP Mode with password 5 makes
; the DMP11 take the CPU over and load the program (mopctl.py 21112).
set cpu 11/70
set cpu 256k
set dmp enable
set dmp0 mode=fdxtributary
set dmp0 tributary=5
set dmp0 remoteload
set dmp0 peer=127.0.0.1:21012
attach dmp0 21112
set debug p2.dbg
set dmp debug=INFO;WARN
dep 2000 012706
dep 2002 001000
dep 2004 000777
go 2000
do common_check.ini dmp0
