; open-simh-extended/tests/dmv11/mc.ini  v1
; DMV11 master clear without an operating system (MicroVAX I, II, 3900):
; a small VAX program (memory management off) sets BSEL1 bit 6 (master
; clear) at 17760361 (0x200000F1, the DMV11's auto-configured address
; when it is the only floating device), waits, reads SEL4 -> R0,
; SEL6 -> R1, SEL0 -> R3 and halts.  Expected (self-test signature):
; R0 0000001B, R1 000000C5, R3 00000000.  Run: BIN/microvax1 mc.ini
set dmv enable
set cpu 4m
; MOVB #^X40, @#^X200000F1
dep -b 200 90
dep -b 201 8F
dep -b 202 40
dep -b 203 9F
dep -b 204 F1
dep -b 205 00
dep -b 206 00
dep -b 207 20
; MOVL #^X200000, R2  /  1$: SOBGTR R2, 1$
dep -b 208 D0
dep -b 209 8F
dep -b 20A 00
dep -b 20B 00
dep -b 20C 20
dep -b 20D 00
dep -b 20E 52
dep -b 20F F5
dep -b 210 52
dep -b 211 FD
; MOVZWL @#^X200000F4, R0
dep -b 212 3C
dep -b 213 9F
dep -b 214 F4
dep -b 215 00
dep -b 216 00
dep -b 217 20
dep -b 218 50
; MOVZWL @#^X200000F6, R1
dep -b 219 3C
dep -b 21A 9F
dep -b 21B F6
dep -b 21C 00
dep -b 21D 00
dep -b 21E 20
dep -b 21F 51
; MOVZWL @#^X200000F0, R3
dep -b 220 3C
dep -b 221 9F
dep -b 222 F0
dep -b 223 00
dep -b 224 00
dep -b 225 20
dep -b 226 53
; HALT
dep -b 227 00
run 200
ex r0
ex r1
ex r3
exit
