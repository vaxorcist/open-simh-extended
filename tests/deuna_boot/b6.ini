; open-simh-extended/tests/deuna_boot/b6.ini  v1
; B6 the full path through DEC's M9312 ROMs: the 23-248F1 console's XE0
; starts the 'XE' ROMs (23-E32A9/E33A9; images from ../m9312_roms, DEC
; firmware, not in the repository), which print the Ethernet address,
; give BOOT and wait at 2; mophost.py serves the test tertiary loader:
; DEUNA BOOT OK, HALT at PC 002034, R1 = 174510.
set cpu 11/34
set cpu 64k
set xu enable
set xu type=deuna
set xu mac=08:00:2b:12:34:56
attach xu udp:22281:127.0.0.1:22282
set debug b6.dbg
set xu debug=BOOT
set rom0 address=17765000
attach rom0 m9312_248F1.bin
set rom1 address=17773000
attach rom1 m9312_xe.bin
expect "@" send "XE0\r"; continue
go 165020
ex r1,pc,2/10
