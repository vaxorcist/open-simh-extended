; open-simh-extended/tests/deuna_boot/b10.ini  v1
; B10 SIMH's BOOT XU command (patch 23 v2): the built-in bootstrap at
; 002000 does what DEC's 'XE' ROM does (BR . at 2, CSR 174510 at 4, BOOT
; port command, JMP @#2); mophost.py 22322 22321 serves a dummy secondary
; and its test tertiary loader at 002000 (over the bootstrap); SIMH's boot
; engine loads it and starts it with R1 = 174510: DEUNA BOOT OK, HALT at
; 002032 (PC 002034).  No ROM image needed.
set cpu 11/34
set cpu 64k
set xu enable
set xu type=deuna
set xu mac=08:00:2b:12:34:56
attach xu udp:22321:127.0.0.1:22322
set debug b10.dbg
set xu debug=BOOT
boot xu
ex r1,pc,2/10
