; open-simh-extended/tests/deuna_boot/b3.ini  v1
; B3 as B2, the load host ignores the first Request Program: the board
; repeats it after 5 s (mophost.py --dropfirst).
set cpu 11/34
set cpu 64k
set xu enable
set xu type=deuna
set xu mac=08:00:2b:12:34:56
attach xu udp:22251:127.0.0.1:22252
set debug b3.dbg
set xu debug=BOOT
; 1000: MOV #777,@#2 (BR .); MOV #174510,@#4 (the CSR); MOV #5,@#174510
;       (BOOT port command); JMP @#2 -- what DEC's 'XE' ROM does
dep 1000 012737
dep 1002 000777
dep 1004 000002
dep 1006 012737
dep 1010 174510
dep 1012 000004
dep 1014 012737
dep 1016 000005
dep 1020 174510
dep 1022 000137
dep 1024 000002
go 1000
ex r1,pc,2/10
