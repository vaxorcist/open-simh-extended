; open-simh-extended/tests/deuna_boot/b2.ini  v1
; B2 BOOT port command given by a program (no ROM image): the program
; sets up location 2 (BR .) and 4 (CSR 174510) as DEC's 'XE' ROM does,
; gives BOOT and waits at 2; mophost.py 22242 22241 serves a dummy
; secondary and its test tertiary loader at 002000 in Memory Loads; SIMH's
; boot engine (the UNA secondary loader's work) loads it and starts it
; with R1 = 174510: DEUNA BOOT OK, HALT at 002032 (PC 002034).
set cpu 11/34
set cpu 64k
set xu enable
set xu type=deuna
set xu mac=08:00:2b:12:34:56
attach xu udp:22241:127.0.0.1:22242
set debug b2.dbg
set xu debug=BOOT
; 1000: MOV #777,@#2 (BR .); MOV #174510,@#4 (the CSR); MOV #5,@#174510
;       (BOOT port command); JMP @#2 -- what DEC's 'XE' ROM does
dep 1000 012737
dep 1002 000777
dep 1004 000002
dep 1006 012737
dep 1010 174510
dep 1012 000004
dep 1014 012737
dep 1016 000005
dep 1020 174510
dep 1022 000137
dep 1024 000002
go 1000
ex r1,pc,2/10
