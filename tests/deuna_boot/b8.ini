; open-simh-extended/tests/deuna_boot/b8.ini  v1
; B8 BOOT on a port that is not attached: refused with a message and
; the port command error bit (PCSR0 bit 14); the program halts at 1026
; (it does not wait at 2 here).
set cpu 11/34
set cpu 64k
set xu enable
set xu type=deuna
dep 1000 012737
dep 1002 000005
dep 1004 174510
dep 1006 000240
dep 1010 000240
dep 1012 000240
dep 1014 013700
dep 1016 174510
dep 1020 000000
; 1000: MOV #5,@#174510 (BOOT); NOP x3; MOV @#174510,R0; HALT
go 1000
ex r0
