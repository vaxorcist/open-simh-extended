; open-simh-extended/tests/deuna_boot/b11.ini  v1
; B11 BOOT XU without an attached network: refused by SIMH's BOOT command
; ("Unit not attached"; patch 23 v2); BOOT XU1 (the timer unit): refused
; ("Unit disabled").
set cpu 11/34
set cpu 64k
set xu enable
set xu type=deuna
boot xu
set xu mac=08:00:2b:12:34:56
attach xu udp:22331:127.0.0.1:22332
boot xu1
echo B11 END
