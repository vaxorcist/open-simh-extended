; open-simh-extended/tests/deuna_boot/b5.ini  v1
; B5 as B2 with a DELUA (TYPE=DELUA): the first Request Program has
; device type 11 (DELUA User's Guide table 5-2), the tertiary request 01.
set cpu 11/34
set cpu 64k
set xu enable
set xu type=delua
set xu mac=08:00:2b:12:34:56
attach xu udp:22271:127.0.0.1:22272
set debug b5.dbg
set xu debug=BOOT
; 1000: MOV #777,@#2 (BR .); MOV #174510,@#4 (the CSR); MOV #5,@#174510
;       (BOOT port command); JMP @#2 -- what DEC's 'XE' ROM does
dep 1000 012737
dep 1002 000777
dep 1004 000002
dep 1006 012737
dep 1010 174510
dep 1012 000004
dep 1014 012737
dep 1016 000005
dep 1020 174510
dep 1022 000137
dep 1024 000002
go 1000
ex r1,pc,2/10
