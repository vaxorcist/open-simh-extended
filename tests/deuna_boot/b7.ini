; open-simh-extended/tests/deuna_boot/b7.ini  v1
; B7 DEC's own UNA loaders (DECnet-11M V4.2 [136,54]SECUNA.SYS and
; TERUNA.SYS, DEC software: Ulli's copies, not in the repository) through
; the 'XE' ROMs: mophost.py sends SECUNA as the secondary loader (SIMH does
; its work) and TERUNA as the tertiary; TERUNA runs on the PDP-11, drives
; the DEUNA through its normal port (STOP, GET PCBB, read load server
; address, ring format, mode, START, counters), asks the load host for the
; operating system (program type 2, software ID -1) and loads mophost's
; test system (SYSTEM BOOT OK, HALT at PC 002034).  Also checks the known
; issues 111-113 (STOP when ready, counter list length, load server).
set cpu 11/34
set cpu 64k
set xu enable
set xu type=deuna
set xu mac=08:00:2b:12:34:56
attach xu udp:22291:127.0.0.1:22292
set debug b7.dbg
set xu debug=BOOT
set rom0 address=17765000
attach rom0 m9312_248F1.bin
set rom1 address=17773000
attach rom1 m9312_xe.bin
expect "@" send "XE0\r"; continue
go 165020
ex r1,pc
