; open-simh-extended/tests/rb730/realism.ini  v3  VAX-11/730, VMS 3.5 on the RB80 (standard layout, 31 sectors), realism mode (SET SOUND ENABLED):
;   RB80 ready at ATTACH, RB02 waits for ONLINE; ONLINE, INIT, OFFLINE; MOUNT while stopped (operator
;   request), SET -N ONLINE, MOUNT completes; COPY, OFFLINE while mounted (mount verification),
;   ONLINE, DISMOUNT; seek sounds in r1.dbg
set sound enabled
set cpu 4m
dep rb spinup 3000
dep rb spindown 3000
attach rb0 r1.rb80
attach rb1 r1.rb02
echo === after ATTACH (realism mode): RB0, RB1
show rb0 spindle
show rb1 spindle
set debug r1.dbg
set rb debug=CMD
set runlimit 1800 seconds
expect "HH:MM)" send "4-NOV-1989 10:00\r"; continue
expect "job terminated" send after=3000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ "
boot rb0
echo === logged in; simulated time:
show time
send after=1000000,"SHOW DEVICE DQ\rWRITE SYS$OUTPUT \"=A\",\"END=\"\r"
expect "=AEND="
continue
echo === SET RB1 ONLINE (3 s spin-up)
set rb1 online
send after=1000000,"INITIALIZE DQA1: RB02T\rWRITE SYS$OUTPUT \"=C\",\"END=\"\r"
expect "=CEND="
continue
echo === SET RB1 OFFLINE (3 s spin-down)
set rb1 offline
send after=1000000,"MOUNT DQA1: RB02T\rWRITE SYS$OUTPUT \"=D\",\"END=\"\r"
expect "Please mount"
continue
echo === operator request seen; SET -N RB1 ONLINE (spins up while VMS runs)
set -n rb1 online
show rb1 spindle
expect "=DEND="
continue
send after=1000000,"COPY SYS$SYSTEM:SYSGEN.EXE DQA1:[000000]X.TMP\rWRITE SYS$OUTPUT \"=E\",\"END=\"\r"
expect "=EEND="
continue
echo === SET RB1 OFFLINE while DQA1 is mounted (3 s spin-down)
set rb1 offline
send after=1000000,"COPY DQA1:[000000]X.TMP SYS$LOGIN:Y.TMP\rWRITE SYS$OUTPUT \"=F\",\"END=\"\r"
expect "MOUNTVER"
continue
echo === VMS noticed; SET RB1 ONLINE
set rb1 online
expect "=FEND="
continue
send after=1000000,"DIRECTORY/SIZE SYS$LOGIN:Y.TMP\rWRITE SYS$OUTPUT \"=G\",\"END=\"\r"
expect "=GEND="
continue
send after=1000000,"DISMOUNT DQA1:\rWRITE SYS$OUTPUT \"=H\",\"END=\"\r"
expect "=HEND="
continue
echo === end; simulated time:
show time
exit
