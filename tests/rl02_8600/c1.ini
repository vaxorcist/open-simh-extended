; open-simh-extended/tests/rl02_8600/c1.ini  v1
; VAX 8600 console RL02 (CS) at the sim> prompt, sound realism mode and
; normal mode: the LOAD button (SET CS ONLINE/OFFLINE), SHOW CS SPINDLE,
; SET SOUND ENABLED/DISABLED refused while CS is attached, refused ONLINE
; without a cartridge.  Short SPINUP/SPINDOWN to keep the test quick.
; Run:  BIN/vax8600 tests/rl02_8600/c1.ini   (SDL_AUDIODRIVER=dummy is fine)
set sound enabled
show cs spindle
set cs online
dep cs spinup 2000
dep cs spindown 1500
! rm -f c1.rl02
attach -n cs c1.rl02
show cs spindle
set sound disabled
set cs online
show cs spindle
set -n cs offline
show cs spindle
set cs offline
show cs spindle
set -n cs load
show cs spindle
detach cs
show cs spindle
set sound disabled
attach cs c1.rl02
show cs spindle
set cs offline
show cs spindle
set cs online
show cs spindle
detach cs
exit
