; open-simh-extended/tests/rl02_8600/vms3.ini  v2
; VMS V4.7 on the VAX 8600, sound realism mode, the LOAD button of the
; console RL02 (CSA1):
;  1. the cartridge is loaded but the LOAD button not pressed: MOUNT/FOREIGN
;     asks the operator ("Please mount device _CSA1:"); the script presses
;     the button from the expect action (SET -N CS ONLINE, 40 s spin-up) and
;     the MOUNT completes by itself;
;  2. EXCHANGE INITIALIZE, COPY, DIRECTORY;
;  3. the button is released under the mounted volume (SET -N CS OFFLINE,
;     30 s spin-down): EXCHANGE DIRECTORY must fail, not hang;
;  4. pressed again (SET -N CS ONLINE), after 45 s EXCHANGE DIRECTORY works,
;     DISMOUNT.
; Needs a copy of VMS047.R81 (SYSTEM/MANAGER) in the current directory.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8600 tests/rl02_8600/vms3.ini > vms3.out < /dev/null
set cpu 16m
set sound enabled
set rq0 ra81
attach rq0 VMS047.R81
set rq0 online
! rm -f csrl3.rl02
attach -n cs csrl3.rl02
set debug -t vms3.dbg
set cs debug=ops
set runlimit 1500 seconds
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "RUN SYS$SYSTEM:SYSGEN\r"; continue
expect "SYSGEN>" send "CONNECT CONSOLE\r"; continue
expect "CONNECT CONSOLE\r\n" send after=500000,"EXIT\r"; continue
expect "EXIT\r\n" send after=500000,"MOUNT/FOREIGN CSA1:\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "Please mount device _CSA1:" set -n cs online; continue
expect "=M1END=" send after=200000,"EXCHANGE INITIALIZE CSA1:/VOLUME_FORMAT=RT11 CSRL02\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=200000,"EXCHANGE COPY SYS$SYSTEM:LOGINOUT.EXE CSA1:LOGINO.EXE\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=200000,"EXCHANGE DIRECTORY CSA1:\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" set -n cs offline; send after=200000,"WAIT 00:00:05\rEXCHANGE DIRECTORY CSA1:\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" set -n cs online; send after=200000,"WAIT 00:00:45\rEXCHANGE DIRECTORY CSA1:\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=200000,"DISMOUNT CSA1:\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" exit
boot rq0
