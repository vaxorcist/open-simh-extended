; open-simh-extended/tests/rl02_8600/vms2.ini  v1
; VMS V4.7 on the VAX 8600 with its console RL02 (CS = CSA1),
; sound realism mode (SDL_AUDIODRIVER=dummy is fine).
; Needs a copy of VMS047.R81 (SYSTEM/MANAGER) in the current directory;
; the console RL02 cartridge csrl.rl02 is created new (blank).
; Workload: SYSGEN CONNECT CONSOLE; MOUNT/FOREIGN CSA1; EXCHANGE
; INITIALIZE as an RT-11 volume; EXCHANGE COPY SYSGEN.EXE to CSA1 and
; back to SYS$LOGIN; DIFFERENCES (no differences); EXCHANGE DIRECTORY;
; DISMOUNT.  Commands are sent one at a time.
; Run:  BIN/vax8600 tests/rl02_8600/vms2.ini > vms2.out < /dev/null
set cpu 16m
set sound enabled
set rq0 ra81
attach rq0 VMS047.R81
! rm -f csrl.rl02
attach -n cs csrl.rl02
set rq0 online
set cs online
set debug -t vms2.dbg
set cs debug=ops
set runlimit 1800 seconds
expect "HH:MM)" send "12-NOV-2026 10:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "RUN SYS$SYSTEM:SYSGEN\r"; continue
expect "SYSGEN>" send "CONNECT CONSOLE\r"; continue
expect "CONNECT CONSOLE\r\n" send after=500000,"EXIT\r"; continue
expect "EXIT\r\n" send after=500000,"SHOW DEVICE CS\rWRITE SYS$OUTPUT \"=M0\",\"END=\"\r"; continue
expect "=M0END=" send after=200000,"MOUNT/FOREIGN CSA1:\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=200000,"EXCHANGE INITIALIZE CSA1:/VOLUME_FORMAT=RT11 CSRL02\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=200000,"EXCHANGE COPY SYS$SYSTEM:SYSGEN.EXE CSA1:SYSGEN.EXE\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=200000,"EXCHANGE COPY SYS$SYSTEM:LOGINOUT.EXE CSA1:LOGINO.EXE\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=200000,"EXCHANGE COPY CSA1:SYSGEN.EXE SYS$LOGIN:SYSGEN.CS\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=200000,"DIFFERENCES SYS$SYSTEM:SYSGEN.EXE SYS$LOGIN:SYSGEN.CS\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=200000,"EXCHANGE DIRECTORY CSA1:\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" send after=200000,"DELETE SYS$LOGIN:SYSGEN.CS;*\rWRITE SYS$OUTPUT \"=M8\",\"END=\"\r"; continue
expect "=M8END=" send after=200000,"DISMOUNT CSA1:\rWRITE SYS$OUTPUT \"=M9\",\"END=\"\r"; continue
expect "=M9END=" exit
boot rq0
