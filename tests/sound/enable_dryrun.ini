; open-simh-extended/tests/sound/enable_dryrun.ini  v1 (2026-11-17)
; Known issues case 76: SET REALISM ENABLED runs the devices' checks first
; as a dry run and applies them only if none refuses.  Before the fix, a
; refusal by a later check (here the KLESI-B TU81 rule) left the units
; already disabled by an earlier check (the RQ SDI rule) disabled, although
; the command failed.
; Run:  BIN/vax8200 tests/sound/enable_dryrun.ini
; Expected:
;   - step 1: one %SIM-ERROR (TB ... not a TK70), no "RQn disabled"
;     message, SHOW RQ0 and SHOW RQ3 list the units (RD54, RX50)
;   - step 2: "SET REALISM ENABLED: RQ0 disabled ..." for RQ0-RQ3, then
;     SHOW RQ0 / RQ3 give "Unit disabled"
set tb enable
set tb tk70
echo === 1 refused by the TB rule: RQ0-RQ3 must stay enabled
set realism enabled
show rq0
show rq3
echo === 2 TB a TU81: accepted, the RQ units are disabled with one message each
set tb tu81
set realism enabled
show rq0
show rq3
exit
