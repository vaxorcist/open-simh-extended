; open-simh-extended/tests/sound/realism_cmd.ini  v1 (2026-11-17)
; Console test of SET REALISM ENABLED/DISABLED and SHOW REALISM (the realism
; mode under its own name), with SET SOUND ENABLED/DISABLED as the older
; synonym, abbreviations, the error messages and the help topic.  Any VAX
; simulator; the VAX 8200 shows the RQ SDI rule messages at SET REALISM
; ENABLED (default UDA50A with RD54/RX50 units).
; Run:  BIN/vax8200 tests/sound/realism_cmd.ini
; Expected:
;   - SHOW REALISM: "Realism: disabled", "CPU: realistic speed THROTTLE 400K",
;     "Sound: off"; after SET REALISM ENABLED (or SET SOUND ENABLED, SET
;     REALISM ENA): "Realism: enabled", THROTTLE ... (set), "Sound: on"
;   - the messages of the devices start with "SET REALISM ENABLED:"
;   - SET REALISM without argument, with FOO, with an extra word: one
;     %SIM-ERROR each ("Missing ...", "... ENABLED or DISABLED expected",
;     "Unexpected SET REALISM argument: extra")
;   - HELP SET REALISM shows the "Realism" topic
echo === show realism (default)
show realism
echo === set realism enabled
set realism enabled
show realism
echo === set realism disabled
set realism disabled
show realism
echo === synonym: set sound enabled / disabled
set sound enabled
show realism
set sound disabled
show realism
echo === abbreviations and errors
set realism ena
show realism
set realism dis
set realism
set realism foo
set realism enabled extra
echo === help
help set realism
exit
