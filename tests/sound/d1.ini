; open-simh-extended/tests/sound/d1.ini  v1
; Default sounds (sound patch v14): VAX-11/750 system sounds from
; default_cpu (opt-in), RK07 / RL02 / RP06 / RA60 seek sounds from
; default_disk; SHOW SOUND lists them.  No "file not found" messages.
set sound enabled
show sound
set rq0 ra60
attach -n hk0 d1.rk07
attach -n rl0 d1.rl02
attach -n rp0 d1.rp06
attach -n rq0 d1.ra60
show sound
exit
