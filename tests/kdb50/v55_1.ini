; open-simh-extended/tests/kdb50/v55_1.ini  v1
; VMS V5.5 on the VAX 8200 from the KDB50 (known issues 71/72 fixes).
; KDB0: v55.r82, a COPY of Ulli's VMS055.R82 (confidential: workspace only, never
; delivered); KDB1: a new, empty RA82 (VMS DUx1, x = the system disk's
; controller letter, found with F$GETDVI).  Login SYSTEM (no password on
; this image).  One DCL command per step, each followed by a marker
; "=Sn","END=" that the next rule waits for.
; Steps: SHOW DEVICE D, INITIALIZE, MOUNT, CREATE/DIRECTORY, COPY of
; SYS$SYSTEM:S*.EXE, DIRECTORY/TOTAL, DIFFERENCES, ANALYZE/DISK_STRUCTURE,
; BACKUP/VERIFY, DISMOUNT, SHOW DEVICE (error counts).
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 v55_1.ini > v55_1.out < /dev/null
set cpu 16m
set kdb0 ra82
attach kdb0 v55.r82
set kdb1 ra82
attach -n kdb1 kdb1.dsk
set runlimit 1500 seconds
expect "HH:MM)" send "16-NOV-2026 23:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "$ " send after=500000,"SHOW DEVICE D\rWRITE SYS$OUTPUT \"=S1\",\"END=\"\r"; continue
expect "=S1END=" send after=500000,"DD = F$EXTRACT(0,F$LENGTH(F$GETDVI(\"SYS$SYSDEVICE\",\"DEVNAM\"))-2,F$GETDVI(\"SYS$SYSDEVICE\",\"DEVNAM\")) + \"1:\"\rWRITE SYS$OUTPUT \"DATA DISK \",DD,\" =S2\",\"END=\"\r"; continue
expect "=S2END=" send after=500000,"INITIALIZE 'DD' DATA55\rWRITE SYS$OUTPUT \"=S3\",\"END=\"\r"; continue
expect "=S3END=" send after=500000,"MOUNT 'DD' DATA55\rWRITE SYS$OUTPUT \"=S4\",\"END=\"\r"; continue
expect "=S4END=" send after=500000,"CREATE/DIRECTORY 'DD'[T]\rWRITE SYS$OUTPUT \"=S5\",\"END=\"\r"; continue
expect "=S5END=" send after=500000,"COPY SYS$SYSTEM:S*.EXE 'DD'[T]\rWRITE SYS$OUTPUT \"=S6\",\"END=\"\r"; continue
expect "=S6END=" send after=500000,"DIRECTORY/SIZE/TOTAL 'DD'[T]\rWRITE SYS$OUTPUT \"=S7\",\"END=\"\r"; continue
expect "=S7END=" send after=500000,"DIFFERENCES SYS$SYSTEM:SYSGEN.EXE 'DD'[T]SYSGEN.EXE\rWRITE SYS$OUTPUT \"=S8\",\"END=\"\r"; continue
expect "=S8END=" send after=500000,"ANALYZE/DISK_STRUCTURE 'DD'\rWRITE SYS$OUTPUT \"=S9\",\"END=\"\r"; continue
expect "=S9END=" send after=500000,"BACKUP/VERIFY 'DD'[T]*.EXE 'DD'[000000]T.BCK/SAVE_SET\rWRITE SYS$OUTPUT \"=SA\",\"END=\"\r"; continue
expect "=SAEND=" send after=500000,"DISMOUNT 'DD'\rWRITE SYS$OUTPUT \"=SB\",\"END=\"\r"; continue
expect "=SBEND=" send after=500000,"SHOW DEVICE D\rWRITE SYS$OUTPUT \"=SC\",\"END=\"\r"; continue
expect "=SCEND=" echof "\n*** v55_1.ini done"; exit
boot kdb0
