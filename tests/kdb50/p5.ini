; open-simh-extended/tests/kdb50/p5.ini  v4
; v3: the realism rules do not keep non-SDI drives off an SDI controller (the
;     same for the UDA50/KDA50, known issues case 68): the RD54 checks now
;     expect acceptance; SDI drive types are checked instead
; v2: SET REALISM ENABLED before ATTACH (realism rule); run in a test directory
;     with a link "sound" to the repository's sound directory
; KDB50 phase P5: realism mode with RA drives on the KDB50.  The
; KDB50 is an SDI controller: SET REALISM ENABLED accepts RA drives on it
; (an RD54 is accepted as well, as on the UDA50/KDA50: known issues case
; 68); at most 4 drives; the RA81 on KDB0 has its RUN/STOP button
; (SET KDB0 ONLINE spins it up).  Then VMS V4.7 boots from KDB0 in the
; realism mode: login, DIRECTORY, SHOW DEVICE.
; Run (SDL_AUDIODRIVER=dummy is fine) in a directory with a copy of
; VMS047_1.R81 and a link to the sound files (ln -s <repo>/sound sound):
;   SDL_AUDIODRIVER=dummy <repo>/BIN/vax8200 p5.ini > p5.out < /dev/null
set cpu 16m
set kdb0 ra81
set kdb1 ra82
set kdb2 ra60
echo ==== RA drives on the KDB50: SET REALISM ENABLED accepted
set realism enabled
show sound
echo ==== the KDB50 is fixed: SET KDB UDA50 refused
set kdb uda50
attach kdb0 VMS047_1.R81
echo ==== KDB0 not yet running: spin it up
show kdb0 spindle
set kdb0 online
show kdb0 spindle
set runlimit 900 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"DIRECTORY/TOTAL SYS$SYSTEM:*.EXE\rSHOW DEVICE DUB0\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" echof "\n*** done"; show kdb0 spindle; exit
boot kdb0
