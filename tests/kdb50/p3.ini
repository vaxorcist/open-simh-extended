; open-simh-extended/tests/kdb50/p3.ini  v1
; KDB50 phase P3: boot test.  VMS V4.7 on the VAX 8200 boots from the
; KDB50 (system disk VMS047_1.R81 on KDB0, RA81); the RQ (UDA50 on the
; DWBUA) has no disks.  BOOT KDB0 loads VMB with R0 = 33 (BI disk
; adapter) and R1 = the KDB50's node.  Checks: login, SHOW DEVICE D,
; the system disk, a COPY and DIFFERENCES on it.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 p3.ini > p3.out < /dev/null
set cpu 16m
set kdb0 ra81
attach kdb0 VMS047_1.R81
set debug -t p3.dbg
set kdb debug=init
set runlimit 900 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"SHOW DEVICE D\rSHOW LOGICAL SYS$SYSDEVICE\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"COPY SYS$SYSTEM:SYSGEN.EXE SYS$LOGIN:SYSGEN.TMP\rDIFFERENCES SYS$SYSTEM:SYSGEN.EXE SYS$LOGIN:SYSGEN.TMP\rDELETE SYS$LOGIN:SYSGEN.TMP;*\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" echof "\n*** done"; exit
boot kdb0
