; open-simh-extended/tests/kdb50/p4.ini  v2
; v2: LOOP.EXE is built here (MACRO/LINK); v1 assumed it on the disk, where it
;     was not, so the loop never ran; two loop processes for both CPUs
; KDB50 phase P4: the KDB50 on the VAX 8300 (SET KA1 ENABLE).  VMS V4.7
; boots from KDB0 (a copy of Ulli's VMS047_1.R81); an empty RA81 on KDB1.
; The console starts the attached processor, builds LOOP.EXE (a CPU-bound
; MACRO-32 loop) and runs it in two subprocesses (SHOW CPU, SHOW SYSTEM), then INITIALIZE,
; MOUNT, COPY of all SYS$SYSTEM .EXE files to DUB1, DIFFERENCES of two
; copies, SHOW CPU, DISMOUNT.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 p4.ini > p4.out < /dev/null
set cpu 16m
set ka1 enable
set kdb0 ra81
attach kdb0 VMS047_1.R81
set kdb1 ra81
attach -n kdb1 kdb1.dsk
set runlimit 1500 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"DEFINE/SYSTEM/EXEC MP MP8SS\rCOPY SYS$SYSTEM:MP_8SS.EXE SYS$SYSTEM:MP8SS.EXE\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"START/CPU\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"OPEN/WRITE F LOOP.MAR\rWRITE F \"        .ENTRY  START,^M<>\"\rWRITE F \"        MOVL    #4000000,R0\"\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=500000,"WRITE F \"10$:    SOBGTR  R0,10$\"\rWRITE F \"        MOVL    #1,R0\"\rWRITE SYS$OUTPUT \"=M3A\",\"END=\"\r"; continue
expect "=M3AEND=" send after=500000,"WRITE F \"        RET\"\rWRITE F \"        .END    START\"\rCLOSE F\rWRITE SYS$OUTPUT \"=M3B\",\"END=\"\r"; continue
expect "=M3BEND=" send after=500000,"MACRO LOOP\rLINK LOOP\rWRITE SYS$OUTPUT \"=M3C\",\"END=\"\r"; continue
expect "=M3CEND=" send after=500000,"OPEN/WRITE F L.COM\rWRITE F \"$ L: RUN SYS$LOGIN:LOOP\"\rWRITE F \"$ GOTO L\"\rCLOSE F\rWRITE SYS$OUTPUT \"=M3D\",\"END=\"\r"; continue
expect "=M3DEND=" send after=500000,"SPAWN/NOWAIT/OUTPUT=NL: @L\rSPAWN/NOWAIT/OUTPUT=NL: @L\rWAIT 00:00:20\rSHOW CPU\rSHOW SYSTEM\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=500000,"INITIALIZE DUB1: KDB1TEST\rMOUNT/SYSTEM DUB1: KDB1TEST\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=500000,"COPY SYS$SYSTEM:*.EXE DUB1:[000000]\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=500000,"DIFFERENCES SYS$SYSTEM:SYSGEN.EXE DUB1:[000000]SYSGEN.EXE\rDIFFERENCES SYS$SYSTEM:DCL.EXE DUB1:[000000]DCL.EXE\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" send after=500000,"SHOW CPU\rDIRECTORY/TOTAL DUB1:[000000]*.EXE\rDISMOUNT DUB1:\rWRITE SYS$OUTPUT \"=M8\",\"END=\"\r"; continue
expect "=M8END=" echof "\n*** done"; exit
boot kdb0
