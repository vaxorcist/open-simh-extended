; open-simh-extended/tests/kdb50/p4.ini  v3
; v3: one DCL command per step (written by a script); v2 typed up to 110
;     characters ahead in one step and overran VMS's type-ahead buffer
;     (78 characters, %SYSTEM-W-DATAOVERUN) while both CPUs were busy
; v2: LOOP.EXE is built here (MACRO/LINK); v1 assumed it on the disk, where it
;     was not, so the loop never ran; two loop processes for both CPUs
; KDB50 phase P4: the KDB50 on the VAX 8300 (SET KA1 ENABLE).  VMS V4.7
; boots from KDB0 (a copy of Ulli's VMS047_1.R81); an empty RA81 on KDB1.
; The console starts the attached processor, builds LOOP.EXE (a CPU-bound
; MACRO-32 loop) and runs it in two subprocesses (SHOW CPU, SHOW SYSTEM), then INITIALIZE,
; MOUNT, COPY of all SYS$SYSTEM .EXE files to DUB1, DIFFERENCES of two
; copies, SHOW CPU, DISMOUNT.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 p4.ini > p4.out < /dev/null
set cpu 16m
set ka1 enable
set kdb0 ra81
attach kdb0 VMS047_1.R81
set kdb1 ra81
attach -n kdb1 kdb1.dsk
set runlimit 1500 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"DEFINE/SYSTEM/EXEC MP MP8SS\rWRITE SYS$OUTPUT \"=P01\",\"END=\"\r"; continue
expect "=P01END=" send after=500000,"COPY SYS$SYSTEM:MP_8SS.EXE SYS$SYSTEM:MP8SS.EXE\rWRITE SYS$OUTPUT \"=P02\",\"END=\"\r"; continue
expect "=P02END=" send after=500000,"START/CPU\rWRITE SYS$OUTPUT \"=P03\",\"END=\"\r"; continue
expect "=P03END=" send after=500000,"OPEN/WRITE F LOOP.MAR\rWRITE SYS$OUTPUT \"=P04\",\"END=\"\r"; continue
expect "=P04END=" send after=500000,"WRITE F \"        .ENTRY  START,^M<>\"\rWRITE SYS$OUTPUT \"=P05\",\"END=\"\r"; continue
expect "=P05END=" send after=500000,"WRITE F \"        MOVL    #4000000,R0\"\rWRITE SYS$OUTPUT \"=P06\",\"END=\"\r"; continue
expect "=P06END=" send after=500000,"WRITE F \"10$:    SOBGTR  R0,10$\"\rWRITE SYS$OUTPUT \"=P07\",\"END=\"\r"; continue
expect "=P07END=" send after=500000,"WRITE F \"        MOVL    #1,R0\"\rWRITE SYS$OUTPUT \"=P08\",\"END=\"\r"; continue
expect "=P08END=" send after=500000,"WRITE F \"        RET\"\rWRITE SYS$OUTPUT \"=P09\",\"END=\"\r"; continue
expect "=P09END=" send after=500000,"WRITE F \"        .END    START\"\rWRITE SYS$OUTPUT \"=P10\",\"END=\"\r"; continue
expect "=P10END=" send after=500000,"CLOSE F\rWRITE SYS$OUTPUT \"=P11\",\"END=\"\r"; continue
expect "=P11END=" send after=500000,"MACRO LOOP\rWRITE SYS$OUTPUT \"=P12\",\"END=\"\r"; continue
expect "=P12END=" send after=500000,"LINK LOOP\rWRITE SYS$OUTPUT \"=P13\",\"END=\"\r"; continue
expect "=P13END=" send after=500000,"OPEN/WRITE F L.COM\rWRITE SYS$OUTPUT \"=P14\",\"END=\"\r"; continue
expect "=P14END=" send after=500000,"WRITE F \"$ L: RUN SYS$LOGIN:LOOP\"\rWRITE SYS$OUTPUT \"=P15\",\"END=\"\r"; continue
expect "=P15END=" send after=500000,"WRITE F \"$ GOTO L\"\rWRITE SYS$OUTPUT \"=P16\",\"END=\"\r"; continue
expect "=P16END=" send after=500000,"CLOSE F\rWRITE SYS$OUTPUT \"=P17\",\"END=\"\r"; continue
expect "=P17END=" send after=500000,"SPAWN/NOWAIT/OUTPUT=NL: @L\rWRITE SYS$OUTPUT \"=P18\",\"END=\"\r"; continue
expect "=P18END=" send after=500000,"SPAWN/NOWAIT/OUTPUT=NL: @L\rWRITE SYS$OUTPUT \"=P19\",\"END=\"\r"; continue
expect "=P19END=" send after=500000,"WAIT 00:00:20\rWRITE SYS$OUTPUT \"=P20\",\"END=\"\r"; continue
expect "=P20END=" send after=500000,"SHOW CPU\rWRITE SYS$OUTPUT \"=P21\",\"END=\"\r"; continue
expect "=P21END=" send after=500000,"SHOW SYSTEM\rWRITE SYS$OUTPUT \"=P22\",\"END=\"\r"; continue
expect "=P22END=" send after=500000,"INITIALIZE DUB1: KDB1TEST\rWRITE SYS$OUTPUT \"=P23\",\"END=\"\r"; continue
expect "=P23END=" send after=500000,"MOUNT/SYSTEM DUB1: KDB1TEST\rWRITE SYS$OUTPUT \"=P24\",\"END=\"\r"; continue
expect "=P24END=" send after=500000,"COPY SYS$SYSTEM:*.EXE DUB1:[000000]\rWRITE SYS$OUTPUT \"=P25\",\"END=\"\r"; continue
expect "=P25END=" send after=500000,"DIFFERENCES SYS$SYSTEM:SYSGEN.EXE DUB1:[000000]SYSGEN.EXE\rWRITE SYS$OUTPUT \"=P26\",\"END=\"\r"; continue
expect "=P26END=" send after=500000,"DIFFERENCES SYS$SYSTEM:DCL.EXE DUB1:[000000]DCL.EXE\rWRITE SYS$OUTPUT \"=P27\",\"END=\"\r"; continue
expect "=P27END=" send after=500000,"SHOW CPU\rWRITE SYS$OUTPUT \"=P28\",\"END=\"\r"; continue
expect "=P28END=" send after=500000,"DIRECTORY/TOTAL DUB1:[000000]*.EXE\rWRITE SYS$OUTPUT \"=P29\",\"END=\"\r"; continue
expect "=P29END=" send after=500000,"DISMOUNT DUB1:\rWRITE SYS$OUTPUT \"=P30\",\"END=\"\r"; continue
expect "=P30END=" echof "\n*** done"; exit
boot kdb0
