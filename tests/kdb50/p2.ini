; open-simh-extended/tests/kdb50/p2.ini  v1
; KDB50 phase P2: a data disk on the KDB50.  VMS V4.7 on the VAX 8200 boots
; from the RQ (UDA50 on the DWBUA); an empty RA81 on KDB1 (VMS DUB1).
; VMS waits about 20 s after its node reset of the KDB50 (PUDRIVER timeout
; for the self-test), hence the WAIT before the tests.
; INITIALIZE, MOUNT, COPY of all SYS$SYSTEM .EXE files, DIRECTORY/TOTAL,
; DIFFERENCES of a copy, ANALYZE/DISK_STRUCTURE, BACKUP/VERIFY, DISMOUNT.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 p2.ini > p2.out < /dev/null
set cpu 16m
set rq0 ra81
attach rq0 VMS047_1.R81
set rq0 online
set kdb1 ra81
attach -n kdb1 kdb1.dsk
set debug -t p2.dbg
set kdb debug=req
set runlimit 1500 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"WAIT 00:00:30\rSHOW DEVICE DUB\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"INITIALIZE DUB1: KDB1TEST\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"MOUNT/SYSTEM DUB1: KDB1TEST\rCREATE/DIRECTORY DUB1:[TEST]\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=500000,"COPY SYS$SYSTEM:*.EXE DUB1:[TEST]\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=500000,"DIRECTORY/SIZE/TOTAL DUB1:[TEST]\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=500000,"DIFFERENCES SYS$SYSTEM:SYSGEN.EXE DUB1:[TEST]SYSGEN.EXE\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=500000,"ANALYZE/DISK_STRUCTURE DUB1:\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" send after=500000,"BACKUP/VERIFY SYS$SYSTEM:*.COM DUB1:[BK]*.*\rWRITE SYS$OUTPUT \"=M8\",\"END=\"\r"; continue
expect "=M8END=" send after=500000,"DIRECTORY/TOTAL DUB1:[BK]\rDISMOUNT DUB1:\rSHOW DEVICE DUB1\rWRITE SYS$OUTPUT \"=M9\",\"END=\"\r"; continue
expect "=M9END=" echof "\n*** done"; exit
boot rq0
