; open-simh-extended/tests/kdb50/p1.ini  v1
; KDB50 phase P1/P2: VMS V4.7 on the VAX 8200 boots from the RQ (UDA50
; on the DWBUA) as before; the KDB50 (device KDB, BI node 6) has an empty
; RA81 on KDB1.  Checks that VMS configures the KDB50 and its disk:
; SHOW DEVICE D, SYSGEN SHOW/ADAPTER, SHOW DEVICE/FULL of the KDB50 disk.
; Debug: KDB registers, initialization and requests in p1.dbg.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 p1.ini > p1.out < /dev/null
set cpu 16m
set rq0 ra81
attach rq0 VMS047_1.R81
set rq0 online
set kdb1 ra81
attach -n kdb1 kdb1.dsk
set debug -t p1.dbg
set kdb debug=init;reg;req
set runlimit 900 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"SHOW DEVICE D\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"OPEN/WRITE F G.COM\rWRITE F \"$ RUN SYS$SYSTEM:SYSGEN\"\rWRITE F \"SHOW/ADAPTER\"\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"WRITE F \"EXIT\"\rCLOSE F\r@G\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" echof "\n*** done"; exit
boot rq0
