; open-simh-extended/tests/kdb50/v55_3.ini  v1
; VMS V5.5 on the VAX 8300 (SET KA1 ENABLE) from the KDB50: both CPUs
; under load.  Writes LOOP.COM (a CPU-bound DCL loop, 400000 rounds),
; runs it in two subprocesses (SPAWN/NOWAIT), SHOW CPU/FULL (current
; process on each CPU), STOP/CPU 1, SHOW CPU, START/CPU 1, SHOW CPU,
; then WAIT 1 min, SHOW CPU/FULL, SHOW SYSTEM.
; KDB0: v55.r82, a COPY of Ulli's VMS055.R82 (workspace only).  Login SYSTEM,
; no password.  One DCL command per step, each with a marker.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 v55_3.ini > v55_3.out < /dev/null
set cpu 16m
set ka1 enable
set kdb0 ra82
attach kdb0 v55.r82
set runlimit 1500 seconds
expect "HH:MM)" send "16-NOV-2026 23:30\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "$ " send after=500000,"OPEN/WRITE F LOOP.COM\rWRITE SYS$OUTPUT \"=S1\",\"END=\"\r"; continue
expect "=S1END=" send after=500000,"WRITE F \"$ I = 0\"\rWRITE SYS$OUTPUT \"=S2\",\"END=\"\r"; continue
expect "=S2END=" send after=500000,"WRITE F \"$ L: I = I + 1\"\rWRITE SYS$OUTPUT \"=S3\",\"END=\"\r"; continue
expect "=S3END=" send after=500000,"WRITE F \"$ IF I .LT. 400000 THEN GOTO L\"\rWRITE SYS$OUTPUT \"=S4\",\"END=\"\r"; continue
expect "=S4END=" send after=500000,"CLOSE F\rWRITE SYS$OUTPUT \"=S5\",\"END=\"\r"; continue
expect "=S5END=" send after=500000,"SPAWN/NOWAIT/PROCESS=LOOP1/OUTPUT=NL: @LOOP\rWRITE SYS$OUTPUT \"=S6\",\"END=\"\r"; continue
expect "=S6END=" send after=500000,"SPAWN/NOWAIT/PROCESS=LOOP2/OUTPUT=NL: @LOOP\rWRITE SYS$OUTPUT \"=S7\",\"END=\"\r"; continue
expect "=S7END=" send after=5000000,"SHOW CPU/FULL\rWRITE SYS$OUTPUT \"=S8\",\"END=\"\r"; continue
expect "=S8END=" send after=500000,"STOP/CPU 1\rWRITE SYS$OUTPUT \"=S9\",\"END=\"\r"; continue
expect "=S9END=" send after=2000000,"SHOW CPU\rWRITE SYS$OUTPUT \"=SA\",\"END=\"\r"; continue
expect "=SAEND=" send after=500000,"START/CPU 1\rWRITE SYS$OUTPUT \"=SB\",\"END=\"\r"; continue
expect "=SBEND=" send after=5000000,"SHOW CPU/FULL\rWRITE SYS$OUTPUT \"=SC\",\"END=\"\r"; continue
expect "=SCEND=" send after=500000,"SHOW SYSTEM\rWRITE SYS$OUTPUT \"=SD\",\"END=\"\r"; continue
expect "=SDEND=" send after=500000,"WAIT 00:01:00\rWRITE SYS$OUTPUT \"=SE\",\"END=\"\r"; continue
expect "=SEEND=" send after=500000,"SHOW CPU/FULL\rWRITE SYS$OUTPUT \"=SF\",\"END=\"\r"; continue
expect "=SFEND=" send after=500000,"SHOW SYSTEM\rWRITE SYS$OUTPUT \"=SG\",\"END=\"\r"; continue
expect "=SGEND=" echof "\n*** v55_3.ini done"; exit
boot kdb0
