; open-simh-extended/tests/ra/ra5.ini  v2
; Configuration rules of the realism mode on the MicroVAX II (Ulli,
; 2026-11-10): SDI drives (RA, ...) only on a UDA50, UDA50A or KDA50;
; at most 4 drives on those.  Each refused command leaves the settings as
; they were.
; v2 (2026-11-16): SET RQ KDA50 disables the unattached RD54 units (an
; SDI controller only connects SDI drives, known issues 68); the script
; enables a unit again with SET RQn ENABLED before it becomes an RA drive
; (one unit at a time: the rules check all enabled units).  Step 7: SET
; SOUND ENABLED now disables the unattached RD54 units 4-7 instead of
; refusing the 8 enabled units.
echo ==== 1: RA81 on the default RQDX3 before SET SOUND ENABLED, then enable: refused
set rq0 ra81
set sound enabled
show sound
echo ==== 2: back to RD54, enable, RA81 on the RQDX3: refused
set rq0 rd54
set sound enabled
set rq0 ra81
show rq0
echo ==== 3: KDA50, RA81 and RA92: accepted
set rq kda50
set rq0 enabled
set rq0 ra81
set rq1 enabled
set rq1 ra92
show rq
echo ==== 4: DRIVES=8 on the KDA50: refused
set rq drives=8
echo ==== 5: back to RQDX3: the RA units get their initial types (RD54), RQ2 stays disabled
set rq rqdx3
show rq
echo ==== 6: KDA50 with an attached RA81, then RQDX3: refused, nothing changes
set rq kda50
set rq0 enabled
set rq0 ra81
attach -n rq0 ra5_ra81.dsk
set rq rqdx3
show rq
show rq0
detach rq0
echo ==== 7: sound disabled, DRIVES=8 on the KDA50, enable: RD54 units 4-7 disabled
set sound disabled
set rq drives=8
set sound enabled
set rq drives=4
set sound enabled
show rq
echo ==== 8: RC25 rules still: RC25 on the KDA50 refused
set rq0 rc25
exit
