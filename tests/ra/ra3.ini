; open-simh-extended/tests/ra/ra3.ini  v1
; Normal mode (sound disabled), MicroVAX II (KDA50): the RA81 is ready at
; ATTACH, ONLINE/OFFLINE take effect at once, BOOT works with QTIME/XTIME.
set rq kda50
set rq0 ra81
set rq0 format=raw
attach rq0 ra81.img
show rq0 spindle
set rq0 offline
show rq0 spindle
set rq0 online
show rq0 spindle
expect ">>>" send "B DUA0\r"; continue
expect "HLT" exit
boot cpu
exit
