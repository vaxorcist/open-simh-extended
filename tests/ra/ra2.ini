; open-simh-extended/tests/ra/ra2.ini  v1
; Realism mode, MicroVAX II (KDA50): BOOT DUA0 with the RA81 stopped
; (ATTACH without SET RQ0 ONLINE) must fail like a stopped drive.
set sound enabled
set rq kda50
set rq0 ra81
set rq0 format=raw
attach rq0 ra81.img
show rq0 spindle
expect ">>>" send "B DUA0\r"; continue
expect ">>>" exit
boot cpu
exit
