; open-simh-extended/tests/ra/ra1.ini  v1
; Fixed RA drives in the sound realism mode on the MicroVAX II (KDA50):
; ATTACH leaves the drive stopped, SET RQn ONLINE (RUN/STOP button) spins
; it up, OFFLINE spins it down, SET -N returns at once; the RD54 has no
; button; then a VMB transfer of 50 blocks at LBN 800000 of the RA81
; (cylinder 1120: long seek from cylinder 0).
set sound enabled
set rq kda50
set rq0 ra81
set rq1 ra92
set rq2 ra70
set rq3 rd54
deposit rq SPINUPRA81 2000
deposit rq SPINDOWNRA81 1500
deposit rq SPINUPRA92 3000
set rq0 format=raw
attach rq0 ra81.img
attach -n rq1 ra92.img
attach -n rq2 ra70.img
show rq0 spindle
show rq1 spindle
show rq2 spindle
show rq3 spindle
set rq3 online
set rq0 online
show rq0 spindle
set rq0 offline
show rq0 spindle
set -n rq1 online
show rq1 spindle
set rq0 online
show rq1 spindle
examine rq SPINUPRA81,SPINDOWNRA81,SEEKRA81S,SEEKRA81M,SPINUPRA70,SPINUPRA92,SEEKRA92M
set debug stdout
set rq debug=trace
expect ">>>" send "B DUA0\r"; continue
expect "HLT" exit
boot cpu
exit
