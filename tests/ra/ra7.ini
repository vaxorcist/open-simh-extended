; open-simh-extended/tests/ra/ra7.ini  v1
; Bus rule of the realism mode (Ulli, 2026-11-10): UDA50/UDA50A only on
; the Unibus, KDA50 only on the Qbus.  vax750 (Unibus): BIN/vax750 ra7.ini
; Expected: KDA50 accepted without sound, SET SOUND ENABLED then refused;
; UDA50A accepted, SET SOUND ENABLED accepted; with sound enabled KDA50
; refused, the controller stays UDA50A.
echo ==== sound disabled: SET RQ KDA50 accepted, SET SOUND ENABLED refused
set rq KDA50
set sound enabled
echo ==== SET RQ UDA50A, SET SOUND ENABLED: accepted
set rq UDA50A
set sound enabled
show rq
echo ==== sound enabled: SET RQ KDA50 refused
set rq KDA50
show rq
exit
