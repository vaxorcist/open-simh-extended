; open-simh-extended/tests/ra/ra7.ini  v2
; Bus rule of the realism mode (Ulli, 2026-11-10): UDA50/UDA50A only on
; the Unibus, KDA50 only on the Qbus.  vax750 (Unibus): BIN/vax750 ra7.ini
; Expected: KDA50 accepted without sound, SET REALISM ENABLED then refused;
; UDA50A accepted, SET REALISM ENABLED accepted; with realism enabled KDA50
; refused, the controller stays UDA50A.
echo ==== realism disabled: SET RQ KDA50 accepted, SET REALISM ENABLED refused
set rq KDA50
set realism enabled
echo ==== SET RQ UDA50A, SET REALISM ENABLED: accepted
set rq UDA50A
set realism enabled
show rq
echo ==== realism enabled: SET RQ KDA50 refused
set rq KDA50
show rq
exit
