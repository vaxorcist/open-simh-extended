; open-simh-extended/tests/ra/ra4.ini  v1
; Unibus, VAX-11/750 (UDA50A): realism mode with an RA80 and an RA82;
; ONLINE waits, SHOW SOUND lists the seek defaults, SHOW RQ.
set sound enabled
set rq0 ra80
set rq1 ra82
deposit rq SPINUPRA80 1000
deposit rq SPINUPRA82 1000
deposit rq SPINDOWNRA82 500
attach -n rq0 ra80.img
attach -n rq1 ra82.img
set rq0 online
set rq1 online
set rq1 offline
show rq0 spindle
show rq1 spindle
show rq
show sound
exit
