; open-simh-extended/tests/ra/ra6.ini  v1
; Bus rule of the realism mode (Ulli, 2026-11-10): UDA50/UDA50A only on
; the Unibus, KDA50 only on the Qbus.  microvax2 (Qbus): BIN/microvax2 ra6.ini
; Expected: UDA50A accepted without sound, SET SOUND ENABLED then refused;
; KDA50 accepted, SET SOUND ENABLED accepted; with sound enabled UDA50A and UDA50
; refused, the controller stays KDA50.
echo ==== sound disabled: SET RQ UDA50A accepted, SET SOUND ENABLED refused
set rq UDA50A
set sound enabled
echo ==== SET RQ KDA50, SET SOUND ENABLED: accepted
set rq KDA50
set sound enabled
show rq
echo ==== sound enabled: SET RQ UDA50A and UDA50 refused
set rq UDA50A
set rq UDA50
show rq
exit
