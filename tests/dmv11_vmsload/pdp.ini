; open-simh-extended/tests/dmv11_vmsload/pdp.ini  v1 (2026-11-21)
; PDP-11/73 with a DMV11 as the remote station that VMS V4.7 (mv.ini) loads
; over a point-to-point DDCMP line.  Mode from the switches (FDXPOINT),
; remote load detect on (E101 SW5 OFF), password 123 = hex 7B (E113).
; Until the load, the CPU waits in a WAIT loop at 1000 (no operating system).
set cpu 11/73
set cpu 256k
set dmv enable
set dmv0 mode=fdxpoint
set dmv0 tributary=123
set dmv0 remoteload
; No PEER here: the PDP-11 only listens and the MicroVAX connects to it.
; With PEER on both sides the line kept reconnecting (known issue 93).
attach dmv0 21202
set debug pdp.dbg
set dmv debug=INFO;WARN;CONNECT;MODEM
; ends by itself, so that the debug file is complete
set runlimit 600 seconds
dep 1000 000001
dep 1002 000776
dep PSW 0
dep SP 1000
go 1000
; after the loaded program halts: switch settings and the first words
show dmv0 switches
exa 0/20
