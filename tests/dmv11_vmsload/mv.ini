; open-simh-extended/tests/dmv11_vmsload/mv.ini  v1 (2026-11-21)
; MicroVAX II with VMS V4.7 (a writable copy of Ulli's VMS047.R81 named
; vms047.vhd) as the DECnet load host for the PDP-11 of pdp.ini.
; The TSV05 (MSA0) carries hello.tsk (as hello.tap) into VMS (setup.cmd).
set cpu 16m
set rq0 ra81
attach rq0 vms047.vhd
set ts enable
attach ts hello.tap
set dmv enable
set dmv0 peer=127.0.0.1:21202
attach dmv0 21201
set debug mv.dbg
set dmv debug=INFO;WARN;CONNECT;MODEM;REG;CMD
expect ">>>" send "B DUA0\r"; continue
boot cpu
