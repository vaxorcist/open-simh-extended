; open-simh-extended/tests/dmb32/p1.ini  v2
; DMB32 phase P1: VMS V4.7 on the VAX 8200 (copy of Ulli's VMS047_1.R81)
; with the DMB32 enabled at BI node 5.  Checks that VMS autoconfigures the
; node and its units (TXA0-7, SIA0, LIA0): SHOW DEVICE, then SYSGEN
; SHOW/CONFIGURATION and SHOW/ADAPTER from a command procedure (SYSGEN
; reads its commands from the procedure's data lines), then SHOW
; DEVICE/FULL of one unit of each function.
; v2: SYSGEN through G.COM ("MCR SYSGEN command" went interactive in V4.7)
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 p1.ini > p1.out < /dev/null
set cpu 16m
set dmb enable
set rq0 ra81
attach rq0 VMS047_1.R81
set rq0 online
set debug -t p1.dbg
set dmb debug=init;int
set runlimit 900 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"SHOW DEVICE\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"OPEN/WRITE F G.COM\rWRITE F \"$ RUN SYS$SYSTEM:SYSGEN\"\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"WRITE F \"SHOW/CONFIGURATION\"\rWRITE F \"SHOW/ADAPTER\"\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=500000,"WRITE F \"EXIT\"\rCLOSE F\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=500000,"@G\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=500000,"SHOW DEVICE/FULL TXA1\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=500000,"SHOW DEVICE/FULL LIA0\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" echof "\n*** done"; exit
boot rq0
