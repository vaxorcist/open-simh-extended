; open-simh-extended/tests/dmb32/p4a_lp.ini  v1
; P4a regression of the DMF32 printer after the switch to the shared
; formatter (vax_combo_lib.c): VMS V4.7 on the VAX-11/780 prints the same
; jobs to LCA0: (DMF32 printer, file lca.txt) with several printer
; settings: lower case, upper case, narrow width with wrap, narrow width
; with truncation, tabs, form feeds.  Run it with the old and the new
; vax780 and compare the two lca.txt files byte for byte (cmp).
; Run:  BIN/vax780 p4a_lp.ini > p4a_lp.out < /dev/null
set cpu 8m
set dmf enable
attach dmf-print lca.txt
set rq0 ra81
attach rq0 VMS047.R81
set runlimit 900 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"SET PRINTER/LOWERCASE LCA0:\rCOPY SYS$SYSTEM:STARTUP.COM LCA0:\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"DIRECTORY/FULL/OUTPUT=LCA0: SYS$SYSTEM:*.COM\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"SET PRINTER/UPPERCASE LCA0:\rCOPY SYS$MANAGER:VMSIMAGES.DAT LCA0:\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=500000,"SET PRINTER/LOWERCASE/WIDTH=40/WRAP LCA0:\rCOPY SYS$SYSTEM:STARTUP.COM LCA0:\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=500000,"SET PRINTER/NOWRAP/TRUNCATE LCA0:\rCOPY SYS$SYSTEM:STARTUP.COM LCA0:\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=500000,"SET PRINTER/WIDTH=132/NOTRUNCATE/TAB/PAGE=20 LCA0:\rDIRECTORY/FULL/OUTPUT=LCA0: SYS$SYSTEM:S*.EXE\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=3000000,"SHOW DEVICE/FULL LCA0:\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" echof "\n*** done"; exit
boot rq0
