; open-simh-extended/tests/dmb32/p5.ini  v2
; v2: LOOP.EXE is built here (MACRO/LINK); v1 assumed it on the disk, where it
;     was not, so the loop never ran; two loop processes for both CPUs
; DMB32 phase P5: the DMB32 on the VAX 8300 (SET KA1 ENABLE).  The console
; starts the attached processor (START/CPU), builds LOOP.EXE (a CPU-bound
; MACRO-32 loop), runs it in two subprocesses and writes =READY; then p2.py runs its async line checks on TXA0 while both
; processors are busy.  The DMB32 interrupts go to the primary (INTRDES).
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 p5.ini > p5.out < /dev/null &
;       python3 p2.py 2323 p5.out
set cpu 16m
set ka1 enable
set dmb enable
attach dmb-async 2323
set rq0 ra81
attach rq0 VMS047_1.R81
set rq0 online
set debug -t p5.dbg
set dmb debug=init
set runlimit 1800 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"DEFINE/SYSTEM/EXEC MP MP8SS\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"COPY SYS$SYSTEM:MP_8SS.EXE SYS$SYSTEM:MP8SS.EXE\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"START/CPU\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=500000,"OPEN/WRITE F LOOP.MAR\rWRITE F \"        .ENTRY  START,^M<>\"\rWRITE F \"        MOVL    #4000000,R0\"\rWRITE SYS$OUTPUT \"=M3X\",\"END=\"\r"; continue
expect "=M3XEND=" send after=500000,"WRITE F \"10$:    SOBGTR  R0,10$\"\rWRITE F \"        MOVL    #1,R0\"\rWRITE SYS$OUTPUT \"=M3A\",\"END=\"\r"; continue
expect "=M3AEND=" send after=500000,"WRITE F \"        RET\"\rWRITE F \"        .END    START\"\rCLOSE F\rWRITE SYS$OUTPUT \"=M3B\",\"END=\"\r"; continue
expect "=M3BEND=" send after=500000,"MACRO LOOP\rLINK LOOP\rWRITE SYS$OUTPUT \"=M3C\",\"END=\"\r"; continue
expect "=M3CEND=" send after=500000,"OPEN/WRITE F L.COM\rWRITE F \"$ L: RUN SYS$LOGIN:LOOP\"\rWRITE F \"$ GOTO L\"\rCLOSE F\rWRITE SYS$OUTPUT \"=M3D\",\"END=\"\r"; continue
expect "=M3DEND=" send after=500000,"SPAWN/NOWAIT/OUTPUT=NL: @L\rSPAWN/NOWAIT/OUTPUT=NL: @L\rWAIT 00:00:20\rSHOW CPU\rSHOW SYSTEM\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=500000,"WRITE SYS$OUTPUT \"=READY\"\rWAIT 00:25:00\r"; continue
boot rq0
