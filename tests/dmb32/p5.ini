; open-simh-extended/tests/dmb32/p5.ini  v1
; DMB32 phase P5: the DMB32 on the VAX 8300 (SET KA1 ENABLE).  The console
; starts the attached processor (START/CPU), starts a CPU-bound loop in a
; subprocess (LOOP.EXE from tests/vax8300/mp2.ini, kept on the disk) and
; writes =READY; then p2.py runs its async line checks on TXA0 while both
; processors are busy.  The DMB32 interrupts go to the primary (INTRDES).
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 p5.ini > p5.out < /dev/null &
;       python3 p2.py 2323 p5.out
set cpu 16m
set ka1 enable
set dmb enable
attach dmb-async 2323
set rq0 ra81
attach rq0 VMS047_1.R81
set rq0 online
set debug -t p5.dbg
set dmb debug=init
set runlimit 1800 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"DEFINE/SYSTEM/EXEC MP MP8SS\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"COPY SYS$SYSTEM:MP_8SS.EXE SYS$SYSTEM:MP8SS.EXE\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"START/CPU\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=3000000,"SHOW CPU\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=500000,"OPEN/WRITE F L.COM\rWRITE F \"$ L: RUN LOOP\"\rWRITE F \"$ GOTO L\"\rCLOSE F\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=500000,"SPAWN/NOWAIT/OUTPUT=NL: @L\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=2000000,"SHOW CPU\rWRITE SYS$OUTPUT \"=READY\"\rWAIT 00:25:00\r"; continue
boot rq0
