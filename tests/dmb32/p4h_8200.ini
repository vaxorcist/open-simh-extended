; open-simh-extended/tests/dmb32/p4h_8200.ini  v1 (2026-11-19)
; VMS V5.5 on the VAX 8200 (VMS055.R82), POINT to the MicroVAX II DMV11 (p4_mv2.ini):
; p4_8200.ini plus the circuit and line OFF/ON steps of p4g_8200.ini, as the V5.5
; reference for the backported SIDRIVER on V4.7.
; Run: p4.sh <BIN> VMS055.R82 VMS047.R81 <dir> mv2 p4h_8200.ini
set cpu 16m
set kdb0 ra82
attach kdb0 VMS055.R82
set dmb enable
set dmb-sync peer=localhost:4101
attach dmb-sync 4100
set debug -t p4.dbg
set dmb debug=sync;mdm;con
set runlimit 2400 seconds
expect "HH:MM)" send "17-NOV-2026 12:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "$ " send after=500000,"MC NCP PURGE KNOWN CIRCUITS ALL\rWRITE SYS$OUTPUT \"=B1\",\"END=\"\r"; continue
expect "=B1END=" send after=200000,"MC NCP PURGE KNOWN LINES ALL\rWRITE SYS$OUTPUT \"=B2\",\"END=\"\r"; continue
expect "=B2END=" send after=200000,"MC NCP DEFINE LINE DMB-0 STATE ON\rWRITE SYS$OUTPUT \"=B3\",\"END=\"\r"; continue
expect "=B3END=" send after=200000,"MC NCP DEFINE CIRCUIT DMB-0 STATE ON\rWRITE SYS$OUTPUT \"=B4\",\"END=\"\r"; continue
expect "=B4END=" send after=200000,"MC NCP DEFINE EXECUTOR STATE ON\rWRITE SYS$OUTPUT \"=B5\",\"END=\"\r"; continue
expect "=B5END=" send after=200000,"@SYS$MANAGER:STARTNET\rWRITE SYS$OUTPUT \"=B6\",\"END=\"\r"; continue
expect "=B6END=" send after=200000,"OPEN/WRITE F R.COM\rWRITE F \"$ SET NOON\"\rWRITE F \"$ N=0\"\rWRITE F \"$L: N=N+1\"\rWRITE F \"$ DIRECTORY 1026\"\"SYSTEM MANAGER\"\"::SYS$SYSTEM:SYSGEN.EXE\"\rWRITE F \"$ IF $STATUS THEN EXIT\"\rWRITE F \"$ IF N .GT. 12 THEN EXIT\"\rWRITE F \"$ WAIT 00:00:10\"\rWRITE F \"$ GOTO L\"\rCLOSE F\rWRITE SYS$OUTPUT \"=B7\",\"END=\"\r"; continue
expect "=B7END=" send after=200000,"@R\rWRITE SYS$OUTPUT \"=B8\",\"END=\"\r"; continue
expect "=B8END=" send after=200000,"MC NCP SHOW KNOWN NODES\rMC NCP SHOW ADJACENT NODES\rWRITE SYS$OUTPUT \"=B9\",\"END=\"\r"; continue
expect "=B9END=" send after=200000,"COPY SYS$HELP:HELPLIB.HLB 1026\"SYSTEM MANAGER\"::HELP8200.TMP\rWRITE SYS$OUTPUT \"=C1\",\"END=\"\r"; continue
expect "=C1END=" send after=200000,"COPY 1026\"SYSTEM MANAGER\"::HELP8200.TMP SYS$LOGIN:HELPBACK.TMP\rWRITE SYS$OUTPUT \"=C2\",\"END=\"\r"; continue
expect "=C2END=" send after=200000,"DIFFERENCES SYS$HELP:HELPLIB.HLB SYS$LOGIN:HELPBACK.TMP\rWRITE SYS$OUTPUT \"=C3\",\"END=\"\r"; continue
expect "=C3END=" send after=200000,"DIRECTORY/SIZE/DATE 1026\"SYSTEM MANAGER\"::HELP8200.TMP\rWRITE SYS$OUTPUT \"=C4\",\"END=\"\r"; continue
expect "=C4END=" send after=200000,"MC NCP LOOP NODE 1.2 COUNT 50 LENGTH 1000\rWRITE SYS$OUTPUT \"=C5\",\"END=\"\r"; continue
expect "=C5END=" send after=200000,"MC NCP SET CIRCUIT DMB-0 STATE OFF\rWRITE SYS$OUTPUT \"=D1\",\"END=\"\r"; continue
expect "=D1END=" send after=200000,"MC NCP SET LINE DMB-0 STATE OFF\rWRITE SYS$OUTPUT \"=D2\",\"END=\"\r"; continue
expect "=D2END=" send after=200000,"MC NCP SHOW LINE DMB-0\rWRITE SYS$OUTPUT \"=D3\",\"END=\"\r"; continue
expect "=D3END=" send after=200000,"MC NCP SET LINE DMB-0 STATE ON\rWRITE SYS$OUTPUT \"=D4\",\"END=\"\r"; continue
expect "=D4END=" send after=200000,"MC NCP SET CIRCUIT DMB-0 STATE ON\rWRITE SYS$OUTPUT \"=D5\",\"END=\"\r"; continue
expect "=D5END=" send after=200000,"@R\rWRITE SYS$OUTPUT \"=D6\",\"END=\"\r"; continue
expect "=D6END=" send after=200000,"MC NCP SHOW LINE DMB-0 CHARACTERISTICS\rWRITE SYS$OUTPUT \"=D7\",\"END=\"\r"; continue
expect "=D7END=" send after=200000,"MC NCP SHOW CIRCUIT DMB-0 CHARACTERISTICS\rWRITE SYS$OUTPUT \"=D8\",\"END=\"\r"; continue
expect "=D8END=" send after=200000,"MC NCP ZERO LINE DMB-0 COUNTERS\rWRITE SYS$OUTPUT \"=D9\",\"END=\"\r"; continue
expect "=D9END=" send after=200000,"MC NCP LOOP NODE 1.2 COUNT 20 LENGTH 500\rWRITE SYS$OUTPUT \"=DA\",\"END=\"\r"; continue
expect "=DAEND=" send after=200000,"SET HOST 1026\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "on node MV2" send after=2000000,"SHOW LOGICAL SYS$NODE\rLOGOUT\r"; continue
expect "control returned" send after=2000000,"WRITE SYS$OUTPUT \"=C6\",\"END=\"\r"; continue
expect "=C6END=" send after=200000,"MC NCP SHOW CIRCUIT DMB-0 COUNTERS\rWRITE SYS$OUTPUT \"=C7\",\"END=\"\r"; continue
expect "=C7END=" send after=200000,"COPY SYS$LOGIN:R.COM 1026\"SYSTEM MANAGER\"::DONE.TMP\rWRITE SYS$OUTPUT \"=C8\",\"END=\"\r"; continue
expect "=C8END=" echof "\n*** 8200 done"; exit
boot kdb0
