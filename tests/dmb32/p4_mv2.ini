; open-simh-extended/tests/dmb32/p4_mv2.ini  v1 (VMS V4.7 calls the DMV11 line DMP-0: XDDRIVER, as the DMP11)
; DMB32 phase P4, partner side: MicroVAX II with VMS V4.7 (VMS047.R81) and
; its DMV11 (DMV0, port 4101) connected to the VAX 8200's DMB32 sync line
; (p4_8200.ini, port 4100; run both with p4.sh).  Sets the SYSTEM password
; to MANAGER (the disk has none) and network access, makes the node
; MV2 = 1.2 on the point-to-point line and circuit DMP-0 (the DMV11), starts DECnet and waits until the
; 8200 copies DONE.TMP here; then shows its circuit counters.
set cpu 16m
set rq kda50
set rq0 ra81
set rq1 disabled
set rq2 disabled
set rq3 disabled
attach rq0 VMS047.R81
set dmv enable
set dmv0 peer=localhost:4100
attach dmv0 4101
set runlimit 2400 seconds
expect ">>>" send "B DUA0\r"; continue
expect "HH:MM)" send "17-NOV-2026 12:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"MC NCP PURGE KNOWN CIRCUITS ALL\rWRITE SYS$OUTPUT \"=A1\",\"END=\"\r"; continue
expect "=A1END=" send after=200000,"MC NCP PURGE KNOWN LINES ALL\rWRITE SYS$OUTPUT \"=A2\",\"END=\"\r"; continue
expect "=A2END=" send after=200000,"SET DEFAULT SYS$SYSTEM\rMC AUTHORIZE MODIFY SYSTEM/NETWORK/PASSWORD=MANAGER/NOPWDEXPIRED\rSET DEFAULT SYS$LOGIN\rMC NCP DEFINE EXECUTOR ADDRESS 1.2 STATE ON\rWRITE SYS$OUTPUT \"=A3\",\"END=\"\r"; continue
expect "=A3END=" send after=200000,"MC NCP DEFINE LINE DMP-0 STATE ON PROTOCOL DDCMP POINT\rWRITE SYS$OUTPUT \"=A4\",\"END=\"\r"; continue
expect "=A4END=" send after=200000,"MC NCP DEFINE CIRCUIT DMP-0 STATE ON\rWRITE SYS$OUTPUT \"=A5\",\"END=\"\r"; continue
expect "=A5END=" send after=200000,"@SYS$MANAGER:STARTNET\rWRITE SYS$OUTPUT \"=A6\",\"END=\"\r"; continue
expect "=A6END=" send after=200000,"MC NCP SHOW EXECUTOR\rWRITE SYS$OUTPUT \"=A7\",\"END=\"\r"; continue
expect "=A7END=" send after=200000,"OPEN/WRITE F W.COM\rWRITE F \"$ SET NOON\"\rWRITE F \"$L: IF F$SEARCH(\"\"SYS$LOGIN:DONE.TMP\"\") .NES. \"\"\"\" THEN EXIT\"\rWRITE F \"$ WAIT 00:00:05\"\rWRITE F \"$ GOTO L\"\rCLOSE F\rWRITE SYS$OUTPUT \"=A8\",\"END=\"\r"; continue
expect "=A8END=" send after=200000,"@W\rWRITE SYS$OUTPUT \"=A9\",\"END=\"\r"; continue
expect "=A9END=" send after=200000,"MC NCP SHOW CIRCUIT DMP-0 COUNTERS\rWRITE SYS$OUTPUT \"=AX\",\"END=\"\r"; continue
expect "=AXEND=" echof "\n*** MV2 done"; exit
boot cpu
