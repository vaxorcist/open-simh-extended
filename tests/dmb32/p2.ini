; open-simh-extended/tests/dmb32/p2.ini  v1
; DMB32 phase P2: async lines.  VMS V4.7 on the VAX 8200 with the DMB32 at
; BI node 5, its lines on Telnet port 2323.  The console logs in and
; writes =READY; then p2.py logs in on a DMB32 line (TXA0) and runs the
; checks.  The console waits meanwhile.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 p2.ini > p2.out < /dev/null &
;       python3 p2.py 2323 p2.out
set cpu 16m
set dmb enable
attach dmb-async 2323
set rq0 ra81
attach rq0 VMS047_1.R81
set rq0 online
set debug -t p2.dbg
set dmb debug=init;int;dma
set runlimit 1800 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"WRITE SYS$OUTPUT \"=READY\"\rWAIT 00:25:00\r"; continue
boot rq0
