; open-simh-extended/tests/dmb32/p3.ini  v1
; DMB32 phase P3: printer port.  VMS V4.7 on the VAX 8200; the same files
; are copied to LIA0: (DMB32 printer port, file lia.txt) and LPA0: (LP11,
; file lpa.txt) with the same printer settings (lower case, 132 columns,
; 66 lines).  Afterwards compare the two files on the host:
;   diff <(tr -d '\r' < lia.txt) <(tr -d '\r' < lpa.txt)
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 p3.ini > p3.out < /dev/null
set cpu 16m
set dmb enable
attach dmb-print lia.txt
attach lpt lpa.txt
set rq0 ra81
attach rq0 VMS047_1.R81
set rq0 online
set debug -t p3.dbg
set dmb debug=int;lpt
set runlimit 900 seconds
expect "HH:MM)" send "15-NOV-2026 17:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"SET PRINTER/LOWERCASE LIA0:\rSET PRINTER/LOWERCASE LPA0:\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"SHOW PRINTER LIA0:\rSHOW PRINTER LPA0:\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"COPY SYS$SYSTEM:STARTUP.COM LIA0:\rCOPY SYS$SYSTEM:STARTUP.COM LPA0:\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=500000,"DIRECTORY/FULL/OUTPUT=LIA0: SYS$SYSTEM:*.COM\rDIRECTORY/FULL/OUTPUT=LPA0: SYS$SYSTEM:*.COM\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=500000,"COPY SYS$MANAGER:VMSIMAGES.DAT LIA0:\rCOPY SYS$MANAGER:VMSIMAGES.DAT LPA0:\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=3000000,"SHOW DEVICE/FULL LIA0:\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" echof "\n*** done"; exit
boot rq0
