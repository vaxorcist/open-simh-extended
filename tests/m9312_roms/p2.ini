; open-simh-extended/tests/m9312_roms/p2.ini  v1
; P2 the PR/TT ROM without a console: its PR entry 173006 (unit 0, with
; diagnostics) calls the 23-248F1 diagnostics at 165564 (memory test), they
; return, and the loader reads pr.tap as in P1.
set cpu 11/34
set cpu 64k
set rom0 address=17765000
attach rom0 m9312_248F1.bin
set rom1 address=17773000
attach rom1 m9312_pr_tt.bin
attach ptr pr.tap
go 173006
ex 157776
