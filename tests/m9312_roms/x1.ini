; open-simh-extended/tests/m9312_roms/x1.ini  v2 (v2: patch 23 implements BOOT; the full boot is ../deuna_boot B6)
; X1 DEC M9312 boot ROMs 'XE' (23-E32A9 socket 1, 23-E33A9 socket 2,
; DEUNA/DELUA network boot) from the 23-248F1 console: XE0 starts the port,
; reads the default physical address (port function 2, PCBB at 700), prints
; ETHERNET PHYSICAL ADDRESS = 08-00-2B-12-34-56, gives the port command BOOT
; and waits at 2 (BR .) for the board to load the system.
; Since patch 23 (known issue 109) the board starts its boot: it asks for a
; secondary loader (SET XU DEBUG=BOOT shows it); no load host answers here,
; so the CPU waits at 2 until the test stops it after 5 s (PC 000002).  The
; complete boot with a load host: ../deuna_boot/ B6.
set cpu 11/34
set cpu 64k
set xu enable
set xu type=deuna
set xu mac=08:00:2b:12:34:56
attach xu udp:22101:127.0.0.1:22102
set debug x1.dbg
set xu debug=BOOT
set rom0 address=17765000
attach rom0 m9312_248F1.bin
set rom1 address=17773000
attach rom1 m9312_xe.bin
expect "@" send "XE0\r"; continue
go 165020
