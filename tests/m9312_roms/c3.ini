; open-simh-extended/tests/m9312_roms/c3.ini  v1
; C3 23-248F1 console boot by device code: the console's command XM0 finds
; the 'XM' boot ROM (DECnet over a DMC11/DMR11, 23-862A9/863A9/864A9, sockets
; 1-3) by its header at 173000 and starts its unit 0 entry.  The ROM puts the
; DMR11 into maintenance mode and asks for the program; mopctl.py 21141 --rom
; (no trigger) sends it; it prints XM ROM BOOT OK and halts at 34 (PC 000036).
set cpu 11/34
set cpu 64k
set rom0 address=17765000
attach rom0 m9312_248F1.bin
set rom1 address=17773000
attach rom1 m9312_xm.bin
set dmc enable
set dmc0 type=dmr
set dmc0 peer=127.0.0.1:21041
attach dmc0 21141
expect "@" send "XM0\r"; continue
go 165020
