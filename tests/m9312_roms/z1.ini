; open-simh-extended/tests/m9312_roms/z1.ini  v1
; Z1 DEC's 'ZZ' pseudo boot ROM (23-ZZZA9) with the 23-248F1: the console's
; ZZ0 starts it; it runs the CPU tests and the 248F1's diagnostics (165564)
; forever and prints 'End Pass n' with the 248F1's own print routines.  It
; works in SIMH because the 248F1 is at its real address.  Stops at pass 3.
set cpu 11/34
set cpu 64k
set rom0 address=17765000
attach rom0 m9312_248F1.bin
set rom1 address=17773000
attach rom1 m9312_zz.bin
expect "@" send "ZZ0\r"; continue
expect "End Pass 000003"
go 165020
