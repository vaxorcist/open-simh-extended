; open-simh-extended/tests/m9312_roms/p3.ini  v1
; P3 the PR/TT ROM's TT entry: the console DL11 (177560) as the reader.
; The 23-248F1 console gets TT0 and then the same byte stream as pr.tap, typed
; with SEND (tt.tap.send, made by mkbstape.py --sim-send; SET TTI 8B, because
; the stream has 8-bit bytes; note: SET TTO 7B would set the input to 7 bits
; too).  The SEND is not an EXPECT action: SIMH decodes an action's escapes
; once, and the NUL bytes would end it.
set cpu 11/34
set cpu 64k
set rom0 address=17765000
attach rom0 m9312_248F1.bin
set rom1 address=17773000
attach rom1 m9312_pr_tt.bin
set tti 8b
expect "@"
go 165020
do tt_send.ini
continue
ex 157776
