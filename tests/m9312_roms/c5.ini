; open-simh-extended/tests/m9312_roms/c5.ini  v2 (v2: no cache test halt since known issue 106 is fixed)
; C5 DEC M9312 diagnostic ROM 23-616F1 (11/60, 11/70) on an 11/60: switch
; register boot.  The ROM's routine at 165744 takes the boot ROM offset from
; SR<8:0> and the unit from SR<15:9>; SR = 000006 starts the XM ROM's entry
; 173006 (unit 0, with diagnostics), which runs the diagnostics through
; 165564 (they save R0, R1, R4 at 700-704 and return to 2(R4)) and then boots
; over the DMR11 (mopctl.py 21143 --rom).
; Known issue 106 (fixed in patch 22): SIMH's hit/miss register (177752)
; read 0, so the cache test halted at 165554; now it reports hits unless
; both cache halves are forced to miss, and the ROM runs through.
set cpu 11/60
set cpu 128k
set rom0 address=17765000
attach rom0 m9312_616F1.bin
set rom1 address=17773000
attach rom1 m9312_xm.bin
set dmc enable
set dmc0 type=dmr
set dmc0 peer=127.0.0.1:21043
attach dmc0 21143
dep sr 6
go 165744
ex 700/6
