; open-simh-extended/tests/m9312_roms/l1.ini  v1
; L1 known issues 107 and 108 (fixed in patch 22) without a ROM image:
; (107) a program sets the console DL11's maintenance bit (XCSR 177564
; bit 2), sends 'A' (101) and reads it back from the receiver (177562)
; into 3000; nothing may appear on the terminal.  Then it clears the bit,
; prints 'Z' and executes RESET at once; (108) the 'Z' must still appear.
; The program halts at 1044 (PC 001046).
set cpu 11/34
; 1000: MOV #4,@#177564        maintenance on
;       MOVB #101,@#177566     send 'A'
;  1$:  TSTB @#177560           receiver done?
;       BPL 1$
;       MOVB @#177562,@#3000   the looped character
;       CLR @#177564           maintenance off
;       MOVB #132,@#177566     'Z'
;       RESET                   at once: the 'Z' is still being sent
;       HALT
dep 1000 012737
dep 1002 000004
dep 1004 177564
dep 1006 112737
dep 1010 000101
dep 1012 177566
dep 1014 105737
dep 1016 177560
dep 1020 100375
dep 1022 113737
dep 1024 177562
dep 1026 003000
dep 1030 005037
dep 1032 177564
dep 1034 112737
dep 1036 000132
dep 1040 177566
dep 1042 000005
dep 1044 000000
echo L1-START
go 1000
ex 3000
