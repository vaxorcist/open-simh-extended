; open-simh-extended/tests/m9312_roms/d1.ini  v1
; D1 known issue 110 (fixed in patch 22): with SET TTI DEBUG=DAT a received
; NUL byte made sim_debug abort the simulator ("has an imbedded \0
; character").  A small program reads four bytes (E9, 41, NUL, 42) typed by
; SEND into 2000-2003 and halts at 1024 (PC 001026); the debug log shows
; the NUL as '.'.  No ROM image needed.
set cpu 11/34
set tti 8b
set debug d1.dbg
set tti debug=DAT
; 1000: MOV #2000,R1; MOV #4,R2; 1$: TSTB @#177560; BPL 1$;
;       MOVB @#177562,(R1)+; SOB R2,1$; HALT
dep 1000 012701
dep 1002 002000
dep 1004 012702
dep 1006 000004
dep 1010 105737
dep 1012 177560
dep 1014 100375
dep 1016 113721
dep 1020 177562
dep 1022 077206
dep 1024 000000
send after=1000,"\xE9\x41\x00\x42"
go 1000
ex 2000/4
