; open-simh-extended/tests/m9312_roms/c7.ini  v1
; C7 DEC diagnostic ROM 23-774F1 on an 11/24 through the XM ROM's entry
; 173006: CPU, EIS, MMU and memory tests, then a console loopback test, then
; the memory size in 8 octal digits (01000000 for 256 KB), then the return
; to 2(R4) and the boot over the DMR11 (mopctl.py 21145 --rom).
; Known issue 107: SIMH's console DL11 has no maintenance loopback (XCSR
; bit 2), so the loopback test (165626-165702) would wait forever; the test
; skips it (breakpoint at 165626, continue at 165704).
; Known issue 108: the boot ROM's RESET right after the last digit drops
; that digit (SIMH cancels the character being sent), so 0100000 shows.
set cpu 11/24
set cpu 256k
set rom0 address=17765000
attach rom0 m9312_774F1.bin
set rom1 address=17773000
attach rom1 m9312_xm.bin
set dmc enable
set dmc0 type=dmr
set dmc0 peer=127.0.0.1:21045
attach dmc0 21145
break 165626
go 173006
dep pc 165704
nobreak 165626
go
