; open-simh-extended/tests/m9312_roms/c7.ini  v2 (v2: loopback test and last digit work: known issues 107, 108 fixed)
; C7 DEC diagnostic ROM 23-774F1 on an 11/24 through the XM ROM's entry
; 173006: CPU, EIS, MMU and memory tests, then a console loopback test, then
; the memory size in 8 octal digits (01000000 for 256 KB), then the return
; to 2(R4) and the boot over the DMR11 (mopctl.py 21145 --rom).
; Known issues 107 and 108 (fixed in patch 22): the console DL11 had no
; maintenance loopback (the test waited for ever at 165652) and a RESET
; dropped the character being sent (the last digit was lost); now the ROM
; runs through and all 8 digits show.
set cpu 11/24
set cpu 256k
set rom0 address=17765000
attach rom0 m9312_774F1.bin
set rom1 address=17773000
attach rom1 m9312_xm.bin
set dmc enable
set dmc0 type=dmr
set dmc0 peer=127.0.0.1:21045
attach dmc0 21145
go 173006
