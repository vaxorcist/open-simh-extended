; open-simh-extended/tests/m9312_roms/c6.ini  v1
; C6 DEC M9312 diagnostic ROM 23-446F1 on an 11/44 (whose console is in the
; CPU): the XM ROM's entry 173006 (unit 0, with diagnostics) calls the
; diagnostics at 165564; they return to 2(R4) and the ROM boots over the
; DMR11 (mopctl.py 21144 --rom).  700-704 hold R0, R1, R4 saved by the ROM.
set cpu 11/44
set cpu 256k
set rom0 address=17765000
attach rom0 m9312_446F1.bin
set rom1 address=17773000
attach rom1 m9312_xm.bin
set dmc enable
set dmc0 type=dmr
set dmc0 peer=127.0.0.1:21044
attach dmc0 21144
go 173006
ex 700/6
