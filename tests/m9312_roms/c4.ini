; open-simh-extended/tests/m9312_roms/c4.ini  v1
; C4 DEC M9312 diagnostic ROM 23-616F1 (11/60, 11/70) on an 11/70: switch
; register boot.  The ROM's routine at 165744 takes the boot ROM offset from
; SR<8:0> and the unit from SR<15:9>; SR = 000006 starts the XM ROM's entry
; 173006 (unit 0, with diagnostics), which runs the diagnostics through
; 165564 (they save R0, R1, R4 at 700-704 and return to 2(R4)) and then boots
; over the DMR11 (mopctl.py 21142 --rom).
; Known issue 106: SIMH's hit/miss register (177752) always reads 0, so the
; cache test halts at 165554; CONTINUE takes the ROM's own way on (cache
; off), as on a real machine with a failed cache.  The test expects that
; halt; with issue 106 fixed it would not come.
set cpu 11/70
set cpu 256k
set rom0 address=17765000
attach rom0 m9312_616F1.bin
set rom1 address=17773000
attach rom1 m9312_xm.bin
set dmc enable
set dmc0 type=dmr
set dmc0 peer=127.0.0.1:21042
attach dmc0 21142
dep sr 6
go 165744
go
ex 700/6
