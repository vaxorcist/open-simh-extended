; open-simh-extended/tests/m9312_roms/p1.ini  v1
; P1 DEC M9312 boot ROM 'PR/TT' (23-760A9), PC11 reader, from the 23-248F1
; console: PR0 builds DEC's bootstrap loader at 157744 (top of 28K words) and
; starts it; pr.tap (made by mkbstape.py) loads a program that prints
; PR BOOT OK and halts at 157634 (PC 157636).
set cpu 11/34
set cpu 64k
set rom0 address=17765000
attach rom0 m9312_248F1.bin
set rom1 address=17773000
attach rom1 m9312_pr_tt.bin
attach ptr pr.tap
expect "@" send "PR0\r"; continue
go 165020
ex 157776
