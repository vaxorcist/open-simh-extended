; open-simh-extended/tests/m9312_roms/c2.ini  v1
; C2 the same console test as C1 on an 11/04 (no EIS, 28K words): 23-248F1
; is the console ROM of the 11/04 and 11/34.
set cpu 11/04
set cpu 56k
set rom0 address=17765000
attach rom0 m9312_248F1.bin
set rom1 address=17773000
attach rom1 m9312_xm.bin
expect "@" send "L 1000\r"; continue
expect "@" send "D 12345\r"; continue
expect "@" send "D 54321\r"; continue
expect "@" send "L 1000\r"; continue
expect "@" send "E "; continue
expect "@" send "E "; continue
expect "@" send "L 2000\r"; continue
expect "@" send "D 000000\r"; continue
expect "@" send "L 2000\r"; continue
expect "@" send "S\r"; continue
go 165020
ex 1000/4
