; open-simh-extended/tests/m9312_roms/c1.ini  v1
; C1 DEC M9312 console/diagnostic ROM 23-248F1 on an 11/34: the diagnostics
; run from 165020 (DIAG), then the console prints R0 R4 SP R5 and its prompt
; @.  L 1000, D 12345, D 54321 (the second D stores at 1002: auto-increment),
; L 1000, E, E (examine 1000 and 1002), L 2000, D 0 (a HALT), L 2000, S: the
; console resets and starts at 2000; the HALT stops at PC 002002.
; Checked by run_tests.sh: 'E 001000 012345', 'E 001002 054321', PC 002002.
set cpu 11/34
set cpu 64k
set rom0 address=17765000
attach rom0 m9312_248F1.bin
set rom1 address=17773000
attach rom1 m9312_xm.bin
expect "@" send "L 1000\r"; continue
expect "@" send "D 12345\r"; continue
expect "@" send "D 54321\r"; continue
expect "@" send "L 1000\r"; continue
expect "@" send "E "; continue
expect "@" send "E "; continue
expect "@" send "L 2000\r"; continue
expect "@" send "D 000000\r"; continue
expect "@" send "L 2000\r"; continue
expect "@" send "S\r"; continue
go 165020
ex 1000/4
