; open-simh-extended/tests/ts11/p2.ini v1: panel details (pdp11, TS11 on the Unibus 11/70; normal mode, then realism)
set cpu 11/70
set ts enable
attach -n ts p2.tap
show ts transport
set ts offline
show ts transport
set ts unload
show ts transport
set ts online
show ts transport
detach ts
set sound enabled
deposit ts loadtime 1500
deposit ts unloadtime 1000
attach ts p2.tap
set -n ts online
set ts load
show ts transport
set ts offline
set -n ts unload
set ts unload
show ts transport
set cpu 11/73
show ts transport
exit
