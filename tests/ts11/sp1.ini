; open-simh-extended/tests/ts11/sp1.ini v1: spindle regression after the SND_TIMER refactoring (vax750)
set sound enabled
set hk0 rk07
attach -n hk0 rk.dsk
deposit hk spinup 2000
deposit hk spindown 1500
show hk0 spindle
set hk0 online
show hk0 spindle
set -n hk0 offline
show hk0 spindle
sleep 1
show hk0 spindle
set hk0 online
show hk0 spindle
set rq1 ra60
attach -n rq1 ra.dsk
deposit rq spinup 1000
set rq1 online
show rq1 spindle
show int-spindle
show int-reel
exit
