; open-simh-extended/tests/tu58/vms5.ini  v1
; VMS V4.7 on the VAX-11/750, sound realism mode (SDL_AUDIODRIVER=dummy is
; fine): reads Ulli's VAX-11/750 console cartridge (console TU58 = CSA1,
; mounted /NOWRITE): EXCHANGE DIRECTORY; COPY/TRANSFER_MODE=BLOCK VMB.EXE
; (55 blocks) and PCS750.BIN (22 blocks) to SYS$LOGIN twice (the second pass
; from wherever the tape is) and DIFFERENCES of the two reads (block mode:
; EXCHANGE takes .BIN files for RT-11 formatted binary otherwise).  Needs
; VMS047.R81 and TU58_VAX_11750_CONSOLE.T58 in the current directory (the
; test works on a copy of the cartridge).
; Run:  SDL_AUDIODRIVER=dummy BIN/vax750 vms5.ini > vms5.out < /dev/null
set cpu 8m
set sound enabled
set rq0 ra81
attach rq0 VMS047.R81
set rq0 online
! cp TU58_VAX_11750_CONSOLE.T58 vms5.t58
attach td vms5.t58
set debug -t vms5.dbg
set td debug=ops;motion
set runlimit 1800 seconds
expect "HH:MM)" send "12-NOV-2026 14:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "RUN SYS$SYSTEM:SYSGEN\r"; continue
expect "SYSGEN>" send "CONNECT CONSOLE\r"; continue
expect "SYSGEN>" send after=200000,"EXIT\r"; continue
expect "EXIT\r\n" send after=500000,"SHOW DEVICE CS\rWRITE SYS$OUTPUT \"=M0\",\"END=\"\r"; continue
expect "=M0END=" send after=200000,"MOUNT/FOREIGN/NOWRITE CSA1:\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=200000,"EXCHANGE DIRECTORY CSA1:\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=200000,"EXCHANGE COPY CSA1:VMB.EXE/TRANSFER_MODE=BLOCK SYS$LOGIN:VMB1.EXE\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=200000,"EXCHANGE COPY CSA1:PCS750.BIN/TRANSFER_MODE=BLOCK SYS$LOGIN:PCS1.BIN\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=200000,"EXCHANGE COPY CSA1:VMB.EXE/TRANSFER_MODE=BLOCK SYS$LOGIN:VMB2.EXE\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=200000,"EXCHANGE COPY CSA1:PCS750.BIN/TRANSFER_MODE=BLOCK SYS$LOGIN:PCS2.BIN\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=200000,"DIFFERENCES SYS$LOGIN:VMB1.EXE SYS$LOGIN:VMB2.EXE\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" send after=200000,"DIFFERENCES SYS$LOGIN:PCS1.BIN SYS$LOGIN:PCS2.BIN\rWRITE SYS$OUTPUT \"=M8\",\"END=\"\r"; continue
expect "=M8END=" send after=200000,"DIRECTORY/SIZE SYS$LOGIN:VMB*.EXE,PCS*.BIN\rWRITE SYS$OUTPUT \"=M9\",\"END=\"\r"; continue
expect "=M9END=" send after=200000,"DELETE SYS$LOGIN:VMB*.EXE;*,PCS*.BIN;*\rWRITE SYS$OUTPUT \"=M10\",\"END=\"\r"; continue
expect "=M10END=" send after=200000,"DISMOUNT CSA1:\rWRITE SYS$OUTPUT \"=M11\",\"END=\"\r"; continue
expect "=M11END=" exit
boot rq0
