; open-simh-extended/tests/tu58/vms6.ini  v1
; VMS V4.7 on the VAX-11/730, sound realism mode (SDL_AUDIODRIVER=dummy is
; fine): reads Ulli's 11/725-730 diagnostic supervisor cartridge (console
; TU58 = CSA1, mounted /NOWRITE): EXCHANGE DIRECTORY, COPY ENSAA.EXE (229
; blocks) to SYS$LOGIN twice (the second pass from wherever the tape is),
; DIFFERENCES of the two copies.  Needs VMS047.R81 and
; BE-T175I-DE_TU5835_11725-730_DIAG_SUPER.T58 in the current directory.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax730 vms6.ini > vms6.out < /dev/null
set cpu 5m
set sound enabled
set rq0 ra81
attach rq0 VMS047.R81
set rq0 online
! cp BE-T175I-DE_TU5835_11725-730_DIAG_SUPER.T58 vms6.t58
attach td vms6.t58
set debug -t vms6.dbg
set td debug=ops;motion
set runlimit 1800 seconds
expect "HH:MM)" send "12-NOV-2026 14:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "RUN SYS$SYSTEM:SYSGEN\r"; continue
expect "SYSGEN>" send "CONNECT CONSOLE\r"; continue
expect "SYSGEN>" send after=200000,"EXIT\r"; continue
expect "EXIT\r\n" send after=500000,"SHOW DEVICE CS\rWRITE SYS$OUTPUT \"=M0\",\"END=\"\r"; continue
expect "=M0END=" send after=200000,"MOUNT/FOREIGN/NOWRITE CSA1:\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=200000,"EXCHANGE DIRECTORY CSA1:\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=200000,"EXCHANGE COPY CSA1:ENSAA.EXE SYS$LOGIN:ENSAA1.EXE\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=200000,"EXCHANGE COPY CSA1:ENSAA.EXE SYS$LOGIN:ENSAA2.EXE\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=200000,"DIFFERENCES SYS$LOGIN:ENSAA1.EXE SYS$LOGIN:ENSAA2.EXE\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=200000,"DELETE SYS$LOGIN:ENSAA*.EXE;*\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=200000,"DISMOUNT CSA1:\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" exit
boot rq0
