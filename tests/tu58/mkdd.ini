; open-simh-extended/tests/tu58/mkdd.ini  v1
; Builds a bootable RT-11 V5.3 SJ TU58 cartridge rt11v53_dd.dsk (DD0 on the
; TDC) from the RT-11 V5.3 kit and boots it: INITIALIZE DD0:, COPY/SYSTEM the
; SJ monitor, DD.SYS, TT.SYS, SWAP.SYS, COPY PIP, DUP, DIR and STARTS.COM,
; COPY/BOOT, BOOT DD0:, DIR.  Normal mode.  First prepare the kit copy:
;   python3 -I mkdd_prep.py rtv53_rl.dsk work_rl.dsk
; Run:  BIN/pdp11 mkdd.ini < /dev/null
; Then pad the image to a full cartridge (SIMH writes up to the last block
; used): python3 -c "d=open('rt11v53_dd.dsk','rb').read(); open('rt11v53_dd.dsk','wb').write(d+bytes(262144-len(d)))"
set cpu 11/70
set rx disabled
set rl0 rl02
attach rl0 work_rl.dsk
! rm -f rt11v53_dd.dsk
set tdc enabled
attach -n tdc0 rt11v53_dd.dsk
set runlimit 300 seconds
expect "\r\n." send after=300000,"SHOW DEVICES\r"; continue
expect "Vector" send after=1500000,"INITIALIZE/NOQUERY DD0:\r"; continue
expect "INITIALIZE/NOQUERY DD0:\r\n" send after=3000000,"COPY/SYSTEM RT11SJ.SYS,DD.SYS,TT.SYS,SWAP.SYS DD0:\r"; continue
expect "SWAP.SYS DD0:\r\n" send after=5000000,"COPY PIP.SAV,DUP.SAV,DIR.SAV,STARTS.COM DD0:\r"; continue
expect "STARTS.COM DD0:\r\n" send after=5000000,"COPY/BOOT DD0:RT11SJ.SYS DD0:\r"; continue
expect "COPY/BOOT DD0:RT11SJ.SYS DD0:\r\n" send after=3000000,"DIR DD0:\r"; continue
expect "Free blocks" send after=500000,"BOOT DD0:\r"; continue
expect "RT-11SJ" send after=3000000,"DIR\r"; continue
expect [1] "Free blocks" exit
boot rl0
