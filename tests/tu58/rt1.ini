; open-simh-extended/tests/tu58/rt1.ini  v1
; RT-11 V5.3 SJ booted from a TU58 on the PDP-11 TDC (DL-type serial
; interface at 176500, DD handler), normal mode (sound disabled).
; Needs rt11v53_dd.dsk in the current directory (the bootable RT-11 TU58
; built from the RT-11 V5.3 kit, see README.txt); the test works on a copy.
; Workload: BOOT TDC0 (SIMH's TDC boot ROM: bootstrap request, block 0),
; DIR, COPY DUP.SAV (47 blocks) to TEST.SAV, DIR, UNPROTECT and DELETE TEST.SAV, DIR.
; SET TDC DEBUG=OPS;MOTION logs every command and motion with a time stamp.
; Run:  BIN/pdp11 rt1.ini > rt1.out < /dev/null
set cpu 11/70
set rx disabled

set tdc enabled
! cp rt11v53_dd.dsk rt1.dsk
attach tdc0 rt1.dsk
set debug -t rt1.dbg
set tdc debug=ops;motion
set runlimit 900 seconds
expect "RT-11SJ" send after=2000000,"DIR\r"; continue
expect "Free blocks" send after=300000,"COPY DUP.SAV TEST.SAV\r"; continue
expect "TEST.SAV\r\n" send after=300000,"DIR\r"; continue
expect "TEST  .SAV" send after=3000000,"UNPROTECT TEST.SAV\r"; continue
expect "UNPROTECT TEST.SAV\r\n" send after=3000000,"DELETE/NOQUERY TEST.SAV\r"; continue
expect "DELETE/NOQUERY TEST.SAV\r\n" send after=3000000,"DIR\r"; continue
expect [2] "Free blocks" exit
boot tdc0
