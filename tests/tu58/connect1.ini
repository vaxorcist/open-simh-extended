; open-simh-extended/tests/tu58/connect1.ini  v1
; Known issues 63: Ulli's VAX-11/750 configuration of 2026-11-13, scripted.
; Sound realism mode, time at the sim> prompt before the boot (sleep 20 and
; 30, as Ulli's SET ENV -P prompts), VMS V4.7, SYSGEN CONNECT CONSOLE with
; the STABACKIT cartridge staba047-1.T58 in TD.  Before the fix of case 63
; CONNECT CONSOLE could hang for minutes (VMS TIMEWAIT calibrated at the
; host speed); fixed, it returns at once ("*** CONNECT CONSOLE returned").
; Needs in the current directory: VMS047.R81 (copy), staba047-1.T58,
; vax750dis.ini (Ulli's file that disables the unused devices).
; Run:  SDL_AUDIODRIVER=dummy BIN/vax750 connect1.ini > connect1.out < /dev/null
do vax750dis.ini
set rq enable
set rq0 enable
set sound enabled
set cpu 4m
sleep 20
set sound power=on
set rq0 ra81
att rq0 VMS047.R81
set rqb ena
set rqb rux50
set rqb0 ena
set rqb1 ena
set rqb0 rx50
set rqb1 rx50
att -n rqb0 TEST0.RX50
att -n rqb1 TEST1.RX50
set rqb2 dis
set rqb3 dis
set rq0 online
set ry ena
att -n ry0 TEST.RX02
set tu dis
set tq dis
set ts dis
att td staba047-1.T58
set runlimit 300 seconds
expect "HH:MM)" send "13-NOV-2026 14:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "MC SYSGEN\r"; continue
expect "SYSGEN>" send "CONNECT CONSOLE\r"; continue
expect [1] "SYSGEN>" echof "\n*** CONNECT CONSOLE returned"; exit
sleep 30
boot rq0
