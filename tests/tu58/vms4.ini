; open-simh-extended/tests/tu58/vms4.ini  v1
; VMS V4.7 on the VAX-11/730 with its console TU58 (TD = CSA1),
; sound realism mode (SDL_AUDIODRIVER=dummy is fine).
; Needs a copy of VMS047.R81 (SYSTEM/MANAGER) in the current directory;
; the cartridge tu58_4.dd is created new (blank).
; Workload: SYSGEN CONNECT CONSOLE; MOUNT/FOREIGN CSA1; EXCHANGE
; INITIALIZE as an RT-11 volume; EXCHANGE COPY LOGINOUT.EXE to CSA1 and
; back to SYS$LOGIN; DIFFERENCES (no differences); EXCHANGE DIRECTORY;
; DISMOUNT.  Commands are sent one at a time.
; Run:  BIN/vax730 vms4.ini > vms4.out < /dev/null
set cpu 5m
set sound enabled
set rq0 ra81
attach rq0 VMS047.R81
set rq0 online
! rm -f tu58_4.dd
attach -n td tu58_4.dd
set debug -t vms4.dbg
set td debug=ops;motion
set runlimit 1800 seconds
expect "HH:MM)" send "12-NOV-2026 14:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "RUN SYS$SYSTEM:SYSGEN\r"; continue
expect "SYSGEN>" send "CONNECT CONSOLE\r"; continue
expect "SYSGEN>" send after=200000,"EXIT\r"; continue
expect "EXIT\r\n" send after=500000,"SHOW DEVICE CS\rWRITE SYS$OUTPUT \"=M0\",\"END=\"\r"; continue
expect "=M0END=" send after=200000,"MOUNT/FOREIGN CSA1:\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=200000,"EXCHANGE INITIALIZE CSA1:/VOLUME_FORMAT=RT11 TU58T\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=200000,"EXCHANGE COPY SYS$SYSTEM:LOGINOUT.EXE CSA1:LOGINO.EXE\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=200000,"EXCHANGE COPY CSA1:LOGINO.EXE SYS$LOGIN:LOGINO.CS\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=200000,"DIFFERENCES SYS$SYSTEM:LOGINOUT.EXE SYS$LOGIN:LOGINO.CS\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=200000,"EXCHANGE DIRECTORY CSA1:\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=200000,"DELETE SYS$LOGIN:LOGINO.CS;*\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" send after=200000,"DISMOUNT CSA1:\rWRITE SYS$OUTPUT \"=M8\",\"END=\"\r"; continue
expect "=M8END=" exit
boot rq0
