; open-simh-extended/tests/rc25/c1.ini  v2
; RC25 realism mode at the sim> prompt and on the MicroVAX 3900 console:
; SET RQ KLESI makes two RC25 drives (units 0/1, 2/3), Run button on
; either unit, no start without a cartridge, spin-up/spin-down waits,
; DETACH of the cartridge.  (v2: the realism rules of 2026-11-07; a lone
; RCF25 and an RA60 on the same controller are no longer possible here.)
set sound enabled
set cpu 16m
set rq klesi
deposit rq SPINUPRC25 2000
deposit rq SPINDOWNRC25 1500
echo ---- before any attach
show rq1 spindle
attach -n rq1 rc25f.dsk
echo ---- RCF25 attached, no cartridge
show rq1 spindle
set rq1 online
attach -n rq0 rc25r.dsk
echo ---- cartridge loaded
show rq0 spindle
show rq1 spindle
echo ---- ONLINE on the fixed unit
set rq1 online
show rq0 spindle
show rq1 spindle
echo ---- second drive (RQ2/RQ3) without a cartridge
show rq3 spindle
echo ---- console
expect ">>>" send "SHOW DEVICE\r"; continue
expect ">>>" send "BOOT DUA1\r"; continue
expect ">>>" goto afterboot
boot cpu
:afterboot
echo ---- OFFLINE on the removable unit (realism)
set rq0 offline
show rq1 spindle
echo ---- -N ONLINE, then detach of the cartridge while spinning up
set -n rq0 online
show rq1 spindle
detach rq0
show rq1 spindle
show rq0 spindle
exit
