; open-simh-extended/tests/rc25/c1.ini  v1
; RC25 realism mode at the sim> prompt and on the MicroVAX 3900 console:
; pairing RC25/RCF25, Run button on either unit, no start without a
; cartridge, spin-up/spin-down waits, DETACH of the cartridge.
set sound enabled
set cpu 16m
set rq rqdx3
set rq0 rc25
set rq1 rcf25
set rq2 rcf25
set rq3 ra60
deposit rq SPINUPRC25 2000
deposit rq SPINDOWNRC25 1500
echo ---- before any attach
show rq1 spindle
show rq2 spindle
attach -n rq1 rc25f.dsk
attach -n rq2 lone.dsk
echo ---- RCF25 attached, no cartridge
show rq1 spindle
set rq1 online
attach -n rq0 rc25r.dsk
echo ---- cartridge loaded
show rq0 spindle
show rq1 spindle
echo ---- ONLINE on the fixed unit
set rq1 online
show rq0 spindle
show rq1 spindle
echo ---- lone RCF25
show rq2 spindle
set rq2 online
echo ---- RA60
set rq3 online
echo ---- console
expect ">>>" send "SHOW DEVICE\r"; continue
expect ">>>" send "BOOT DUA1\r"; continue
expect ">>>" goto afterboot
boot cpu
:afterboot
echo ---- OFFLINE on the removable unit (realism)
set rq0 offline
show rq1 spindle
echo ---- -N ONLINE, then detach of the cartridge while spinning up
set -n rq0 online
show rq1 spindle
detach rq0
show rq1 spindle
show rq0 spindle
echo ---- help
help rq
exit
