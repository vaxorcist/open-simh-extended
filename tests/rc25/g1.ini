; open-simh-extended/tests/rc25/g1.ini  v2
; RC25 geometry as VMS V3.5 sees it (F$GETDVI), normal mode, VAX-11/730.
; Needs g1.rcf25 = a copy of the RCF25 system disk (e.g. VMS035.RC25).
; Expected: GEOM 31/2/821/50902 (upstream Open SIMH: 50/8/128/50902).
set cpu 4m
set rq0 rc25
set rq1 rcf25
attach rq1 g1.rcf25
set runlimit 300 seconds
expect "job terminated" send after=3000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "Welcome" goto in
boot rq1
:in
send after=1000000,"D:=\"DUA1:\"\rWRITE SYS$OUTPUT \"=A\",\"END=\"\r"
expect "=AEND="
continue
send after=1000000,"S=F$GETDVI(D,\"SECTORS\")\rWRITE SYS$OUTPUT \"=B\",\"END=\"\r"
expect "=BEND="
continue
send after=1000000,"T=F$GETDVI(D,\"TRACKS\")\rWRITE SYS$OUTPUT \"=C\",\"END=\"\r"
expect "=CEND="
continue
send after=1000000,"C=F$GETDVI(D,\"CYLINDERS\")\rWRITE SYS$OUTPUT \"=D\",\"END=\"\r"
expect "=DEND="
continue
send after=1000000,"M=F$GETDVI(D,\"MAXBLOCK\")\rWRITE SYS$OUTPUT \"=E\",\"END=\"\r"
expect "=EEND="
continue
send after=1000000,"WRITE SYS$OUTPUT \"GEOM \",S,\"/\",T,\"/\",C,\"/\",M\rWRITE SYS$OUTPUT \"=F\",\"END=\"\r"
expect "=FEND="
continue
exit
