; open-simh-extended/tests/rc25/c5.ini  v2
; RA60 regression in the realism mode after the RC25 rework: spin-up,
; VMB transfer of 50 blocks at LBN 300000 (cylinder 1190).
set sound enabled
set cpu 16m
set rq kda50
set rq0 ra60
deposit rq SPINUP 1000
set rq0 format=raw
attach rq0 ra60.img
show rq0 spindle
set rq0 online
show rq0 spindle
set debug stdout
expect ">>>" set rq debug=trace; send "BOOT DUA0\r"; continue
boot cpu
exit
