; open-simh-extended/tests/rc25/c9.ini  v1
; ?53 2 05 check with the RA60 (code of sound patch v11), normal mode:
; OFFLINE, failed BOOT (DEVOFFLINE), ONLINE, BOOT CPU again.
set cpu 16m
set rq0 ra60
set rq0 format=raw
attach rq0 ra60.img
set rq0 offline
expect ">>>" send "BOOT DUA0\r"; continue
boot cpu
set rq0 online
expect ">>>" send "BOOT DUA0\r"; continue
boot cpu
exit
