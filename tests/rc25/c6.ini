; open-simh-extended/tests/rc25/c6.ini  v1
; RC25 normal mode (sound disabled): an RCF25 works without a cartridge,
; ATTACH spins up at once, the Run button (OFFLINE/ONLINE) acts on both
; units at once, DETACH of the cartridge leaves the fixed platter usable.
set cpu 16m
set rq0 rc25
set rq1 rcf25
set rq1 format=raw
attach rq1 rcf.img
echo ---- RCF25 alone
show rq1 spindle
expect ">>>" send "BOOT DUA1\r"; continue
boot cpu
echo ---- cartridge attached
attach -n rq0 c6r.dsk
show rq0 spindle
show rq1 spindle
echo ---- OFFLINE via RQ1 (at once)
set rq1 offline
show rq0 spindle
expect ">>>" send "BOOT DUA1\r"; continue
boot cpu
echo ---- ONLINE, then DETACH of the cartridge
set rq0 online
detach rq0
show rq1 spindle
expect ">>>" send "BOOT DUA1\r"; continue
boot cpu
exit
