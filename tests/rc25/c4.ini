; open-simh-extended/tests/rc25/c4.ini  v4
; RC25 realism mode, transfers through the MicroVAX VMB: rcf.img (fixed,
; DUA1) loads 100 blocks at LBN 40000 (cylinder 645), rcr.img (cartridge,
; DUA0) loads 10 blocks at LBN 3000 (cylinder 48).  The two units share
; the actuator, so the boot of DUA0 after DUA1 seeks back from cylinder
; 646.  The loaded blocks are zero (HALT).  Disks made by
; tools/make_vmb_seek_disk.py (v2).  Debug output only after the
; console self-test (it disturbs the self-test timing).
set sound enabled
set cpu 16m
set rq0 rc25
set rq1 rcf25
deposit rq SPINUPRC25 1000
set rq0 format=raw
set rq1 format=raw
attach rq0 rcr.img
attach rq1 rcf.img
set rq0 online
set debug stdout
expect ">>>" set rq debug=trace; send "BOOT DUA1\r"; continue
boot cpu
echo ---- halted in the loaded image; restart the console, BOOT DUA0
set rq nodebug
expect ">>>" set rq debug=trace; send "BOOT DUA0\r"; continue
boot cpu
set rq nodebug
exit
