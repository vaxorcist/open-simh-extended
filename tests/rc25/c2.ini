; open-simh-extended/tests/rc25/c2.ini  v3
; RC25 realism mode: BOOT from the fixed unit while the drive is stopped
; (cartridge attached, no SET RQn ONLINE): VMB must report ?4D DEVOFFLINE.
set sound enabled
set cpu 16m
set rq0 rc25
set rq1 rcf25
attach -n rq0 rc25r.dsk
attach -n rq1 rc25f.dsk
expect ">>>" send "BOOT DUA1\r"; continue
boot cpu
exit
