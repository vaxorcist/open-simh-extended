; open-simh-extended/tests/rc25/c10.ini  v2
; Realism configuration rules for the RQ (RC25 pairs, unit numbers, KLESI),
; commands only (no CPU run).  Expected results in the echo lines.
echo ---- sound enabled with the default configuration: accepted
set sound enabled
echo ---- RC25 on a UDA50: refused
set rq0 rc25
show rq0
echo ---- SET RQ KLESI: units 0/1 and 2/3 become RC25/RCF25, units 4+ disabled
set rq klesi
show rq
echo ---- SET RQ0 UNIT=8: refused (unit number 8 is held by the disabled unit RQ8, see known issues 26)
set rq0 unit=8
echo ---- SET RQ0 UNIT=300: RQ1 becomes 301
set rq0 unit=300
show rq0
show rq1
echo ---- odd unit number on the RC25, even on the RCF25: refused
set rq0 unit=305
set rq1 unit=306
echo ---- SET RQ1 UNIT=303: RQ0 becomes 302
set rq1 unit=303
show rq0
show rq1
set rq0 unit=0
show rq1
echo ---- other drive type on the KLESI: refused, unchanged
set rq1 rd54
show rq1
echo ---- DRIVES=6 on the KLESI: refused
set rq drives=6
echo ---- a unit enabled behind the rules' back, then ATTACH: refused
set rq4 enabled
attach -n rq0 c10a.rc25
set rq4 disabled
attach -n rq0 c10a.rc25
show rq0 spindle
detach rq0
echo ---- back to a UDA50: units get their initial types
set rq uda50
show rq
echo ---- sound disabled: a lone RC25 is accepted (normal mode) ...
set sound disabled
set rq0 rc25
show rq0
echo ---- ... but SET SOUND ENABLED refuses it
set sound enabled
show sound
echo ---- KLESI set in normal mode with the default units: SET SOUND ENABLED refuses
set rq0 rd54
set rq klesi
set sound enabled
echo ---- normal mode: SET RQ0 RC25 does not set RQ1
set rq uda50
set rq0 rc25
show rq1
exit
