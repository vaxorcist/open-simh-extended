; open-simh-extended/tests/rx01/vms4.ini  v1
; VMS V4.7 on the VAX-11/780 with the console floppy CSA1 (the RX01 of the
; console subsystem, CS device), normal mode (sound disabled).
; Automated: needs a copy of VMS047.R81 (SYSTEM/MANAGER) in the current
; directory; the console diskette cs.rx1 is created new (blank).
; SYSGEN CONNECT CONSOLE, then EXCHANGE: INITIALIZE an RT-11 volume on
; CSA1, COPY a file to it and back, DIRECTORY, DIFFERENCES (no
; differences expected).  Commands are sent one at a time.
; Run:  BIN/vax780 tests/rx01/vms4.ini > vms4.out
set cpu 8m
set rq0 ra81
attach rq0 VMS047.R81
! rm -f cs.rx1
attach -n cs cs.rx1
set debug -t vms4.dbg
set cs debug=ops
set runlimit 900 seconds
expect "HH:MM)" send "11-NOV-2026 12:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "RUN SYS$SYSTEM:SYSGEN\r"; continue
expect "SYSGEN>" send "CONNECT CONSOLE\r"; continue
expect "CONNECT CONSOLE\r\n" send after=500000,"EXIT\r"; continue
expect "EXIT\r\n" send after=500000,"SHOW DEVICE CS\rWRITE SYS$OUTPUT \"=M0\",\"END=\"\r"; continue
expect "=M0END=" send after=200000,"MOUNT/FOREIGN CSA1:\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=200000,"EXCHANGE INITIALIZE CSA1:/VOLUME_FORMAT=RT11 CSTEST\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=200000,"EXCHANGE COPY SYS$SYSTEM:SYSGEN.EXE CSA1:SYSGEN.EXE\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=200000,"EXCHANGE DIRECTORY CSA1:\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=200000,"EXCHANGE COPY CSA1:SYSGEN.EXE SYS$LOGIN:SYSGEN.CS\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=200000,"DIFFERENCES SYS$SYSTEM:SYSGEN.EXE SYS$LOGIN:SYSGEN.CS\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=200000,"DELETE SYS$LOGIN:SYSGEN.CS;*\rDISMOUNT CSA1:\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" exit
boot rq0
