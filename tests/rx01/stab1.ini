; open-simh-extended/tests/rx01/stab1.ini  v1
; Known issues 64: VAX-11/780, BOOT CS of Ulli's VMS V4.7 STABACKIT diskettes
; (STABA047-1..4.RX1, here copies s1..s4.rx1), normal mode.
; Prompts and diskette changes as in Ulli's log of 2026-11-14.  Before the
; fix: garbage after the VMS banner, VMS loops (PC 80008B1F).  Fixed: the
; standalone BACKUP $ prompt.
; Needs in the current directory: vax750dis.ini, s1.rx1 .. s4.rx1 (copies).
; Run:  SDL_AUDIODRIVER=dummy BIN/vax780 stab1.ini < /dev/null
do vax750dis.ini
set cpu idle=vms
set cpu 4m

att cs s1.rx1
set runlimit 1500 seconds
expect "Insert the next standalone system volume" att cs s2.rx1; send after=200000,"YES\r"; continue
expect "Insert the next standalone system volume" att cs s3.rx1; send after=200000,"YES\r"; continue
expect "Insert the first standalone system volume" send after=200000,"YES\r"; continue
expect "Insert the standalone application volume" att cs s4.rx1; send after=200000,"YES\r"; continue
expect "(DD-MMM-YYYY  HH:MM)" send after=200000,"14-NOV-2026 14:00\r"; continue
expect "$ " echof "\n*** standalone BACKUP prompt reached"; exit
b cs
