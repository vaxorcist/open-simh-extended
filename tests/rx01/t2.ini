; open-simh-extended/tests/rx01/t2.ini  v1
; RX01 error paths and Read Status, PDP-11/70, THROTTLE 1M.
; (a) realism mode: DETACH during a Read Sector (drive 0, track 48; the head
;     is stepping): the
;     command ends with error 0110, the simulator keeps running;
; (b) realism mode: Read Status on drive 0: one to two revolutions;
; (c) realism mode: Read Sector on the empty drive 1: error 0110 after the
;     steps, head load and two revolutions, no stop;
; (d) normal mode: the same Read Sector stops the simulator (STOP_IOE), as
;     in plain Open SIMH.
; Program A (Read Sector, sector 5, track 060): wait DONE, MOV #f,(R1), wait
; TR, sector, wait TR, track, wait DONE (1042), HALT (1050).  Program B
; (Read Status): wait DONE, MOV #13,(R1), wait DONE, MOV 2(R1),R0 (RXES),
; HALT.  Needs t.rx1 (python3 -I mkrx01.py t.rx1).
set cpu 11/70
set ry disabled
set rx enabled
set sound enabled
set throttle 1M
set debug stdout
set rx debug=ops;cmd
attach rx0 t.rx1
