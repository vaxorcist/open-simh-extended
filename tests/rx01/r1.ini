; open-simh-extended/tests/rx01/r1.ini  v1
; RX01 (RX device) on a PDP-11/70, sound realism mode: BOOT RX0
; (the boot sector of the test image: MOV #123,R0; HALT), then the test
; program reads track 1 in the 2:1 interleave and the data are checked.
; Needs t.rx1 (python3 -I mkrx01.py t.rx1) in the current directory.
set cpu 11/70
set ry disabled
set rx enabled
set sound enabled
set debug -t r1.dbg
set rx debug=ops;cmd
attach rx0 t.rx1
set throttle 1M
boot rx0
examine r0
do prog.ini
go 1000
; the sectors arrive in the order 1, 3, 5, ..., 26: word 0 = track 1 + sector * 256
; (2000 holds the boot sector: 012700; 2200 001401, 2400 002401, 10200 015001)
examine 2000
examine 2200
examine 2400
examine 10200
examine pc
examine rx rxcs
show rx0 drive
sleep 1
show rx0 drive
quit
