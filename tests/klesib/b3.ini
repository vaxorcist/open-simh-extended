; open-simh-extended/tests/klesib/b3.ini  v1 (generated by mkini.py v1)
; VAX 8300, VAXBI-only: the KLESI-B's TU81 is MUA0 (SYSGEN: both CPUs)
set ka1 enable
set uba disable
set cpu 16m
set kdb0 ra81
attach kdb0 VMS047_1.R81
set tb enable
attach tb0 tb0_b3.tap
set runlimit 1500 seconds
expect "HH:MM)" send "16-NOV-2026 18:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"WRITE SYS$OUTPUT \"=S0\",\"END=\"\r"; continue
expect "=S0END=" send after=300000,"WAIT 00:01:30\rWRITE SYS$OUTPUT \"=S1\",\"END=\"\r"; continue
expect "=S1END=" send after=300000,"RUN SYS$SYSTEM:SYSGEN\rSHOW/ADAPTER\rSHOW/CONFIGURATION\rEXIT\rWRITE SYS$OUTPUT \"=S2\",\"END=\"\r"; continue
expect "=S2END=" send after=300000,"SHOW DEVICE/BRIEF\rWRITE SYS$OUTPUT \"=S3\",\"END=\"\r"; continue
expect "=S3END=" send after=300000,"MOUNT/FOREIGN MUA0:\rWRITE SYS$OUTPUT \"=S4\",\"END=\"\r"; continue
expect "=S4END=" send after=300000,"BACKUP/LIST=SYS$LOGIN:L2.LIS MUA0:T.BCK/SAVE_SET/REWIND\rWRITE SYS$OUTPUT \"=S5\",\"END=\"\r"; continue
expect "=S5END=" send after=300000,"SEARCH SYS$LOGIN:L2.LIS \"Total of\"\rWRITE SYS$OUTPUT \"=S6\",\"END=\"\r"; continue
expect "=S6END=" send after=300000,"BACKUP/NOLOG SYS$SYSTEM:SYSGEN.EXE MUA0:S.BCK/SAVE_SET\rWRITE SYS$OUTPUT \"=S7\",\"END=\"\r"; continue
expect "=S7END=" send after=300000,"BACKUP/LIST MUA0:S.BCK/SAVE_SET/REWIND\rWRITE SYS$OUTPUT \"=S8\",\"END=\"\r"; continue
expect "=S8END=" send after=300000,"DISMOUNT MUA0:\rWRITE SYS$OUTPUT \"=S9\",\"END=\"\r"; continue
expect "=S9END=" echof "\n*** b3.ini done"; exit
boot kdb0
