; open-simh-extended/tests/klesib/b4.ini  v1 (generated by mkini.py v1)
; Regression: TU81 on the TQ (TUK50, DWBUA), TB disabled: MUA0
set cpu 16m
set kdb0 ra81
attach kdb0 VMS047_1.R81
attach tq0 tb0_b4.tap
set runlimit 1500 seconds
expect "HH:MM)" send "16-NOV-2026 18:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"WRITE SYS$OUTPUT \"=S0\",\"END=\"\r"; continue
expect "=S0END=" send after=300000,"WAIT 00:01:30\rWRITE SYS$OUTPUT \"=S1\",\"END=\"\r"; continue
expect "=S1END=" send after=300000,"RUN SYS$SYSTEM:SYSGEN\rSHOW/ADAPTER\rSHOW/CONFIGURATION\rEXIT\rWRITE SYS$OUTPUT \"=S2\",\"END=\"\r"; continue
expect "=S2END=" send after=300000,"SHOW DEVICE/BRIEF P\rWRITE SYS$OUTPUT \"=S3\",\"END=\"\r"; continue
expect "=S3END=" send after=300000,"SHOW DEVICE MU\rWRITE SYS$OUTPUT \"=S4\",\"END=\"\r"; continue
expect "=S4END=" send after=300000,"MOUNT/FOREIGN MUA0:\rWRITE SYS$OUTPUT \"=S5\",\"END=\"\r"; continue
expect "=S5END=" send after=300000,"BACKUP/LIST=SYS$LOGIN:L4.LIS MUA0:T.BCK/SAVE_SET/REWIND\rWRITE SYS$OUTPUT \"=S6\",\"END=\"\r"; continue
expect "=S6END=" send after=300000,"SEARCH SYS$LOGIN:L4.LIS \"Total of\"\rWRITE SYS$OUTPUT \"=S7\",\"END=\"\r"; continue
expect "=S7END=" send after=300000,"DISMOUNT MUA0:\rWRITE SYS$OUTPUT \"=S8\",\"END=\"\r"; continue
expect "=S8END=" echof "\n*** b4.ini done"; exit
boot kdb0
