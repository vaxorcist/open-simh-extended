; open-simh-extended/tests/klesib/b1.ini  v1 (generated by mkini.py v1)
; DWBUA + KLESI-B: TU81 on TB0 is MUB0 (TQ is MUA0)
set cpu 16m
set kdb0 ra81
attach kdb0 VMS047_1.R81
set tb enable
attach tb0 -n tb0.tap
set runlimit 1500 seconds
expect "HH:MM)" send "16-NOV-2026 18:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"WRITE SYS$OUTPUT \"=S0\",\"END=\"\r"; continue
expect "=S0END=" send after=300000,"WAIT 00:01:30\rWRITE SYS$OUTPUT \"=S1\",\"END=\"\r"; continue
expect "=S1END=" send after=300000,"RUN SYS$SYSTEM:SYSGEN\rSHOW/ADAPTER\rSHOW/CONFIGURATION\rEXIT\rWRITE SYS$OUTPUT \"=S2\",\"END=\"\r"; continue
expect "=S2END=" send after=300000,"SHOW DEVICE MU\rWRITE SYS$OUTPUT \"=S3\",\"END=\"\r"; continue
expect "=S3END=" send after=300000,"INITIALIZE MUB0: TBTEST\rWRITE SYS$OUTPUT \"=S4\",\"END=\"\r"; continue
expect "=S4END=" send after=300000,"MOUNT/FOREIGN MUB0:\rWRITE SYS$OUTPUT \"=S5\",\"END=\"\r"; continue
expect "=S5END=" send after=300000,"BACKUP/NOLOG SYS$HELP:*.HLB MUB0:T.BCK/SAVE_SET/REWIND/LABEL=TBTEST\rWRITE SYS$OUTPUT \"=S6\",\"END=\"\r"; continue
expect "=S6END=" send after=300000,"BACKUP/LIST=SYS$LOGIN:L.LIS MUB0:T.BCK/SAVE_SET/REWIND\rWRITE SYS$OUTPUT \"=S7\",\"END=\"\r"; continue
expect "=S7END=" send after=300000,"SEARCH SYS$LOGIN:L.LIS \"Total of\"\rWRITE SYS$OUTPUT \"=S8\",\"END=\"\r"; continue
expect "=S8END=" send after=300000,"CREATE/DIRECTORY SYS$SYSDEVICE:[TBR]\rWRITE SYS$OUTPUT \"=S9\",\"END=\"\r"; continue
expect "=S9END=" send after=300000,"BACKUP MUB0:T.BCK/SAVE_SET/REWIND SYS$SYSDEVICE:[TBR]*.*\rWRITE SYS$OUTPUT \"=S10\",\"END=\"\r"; continue
expect "=S10END=" send after=300000,"DIFFERENCES SYS$HELP:HELPLIB.HLB SYS$SYSDEVICE:[TBR]HELPLIB.HLB\rWRITE SYS$OUTPUT \"=S11\",\"END=\"\r"; continue
expect "=S11END=" send after=300000,"DIRECTORY/TOTAL SYS$SYSDEVICE:[TBR]\rWRITE SYS$OUTPUT \"=S12\",\"END=\"\r"; continue
expect "=S12END=" send after=300000,"DISMOUNT MUB0:\rWRITE SYS$OUTPUT \"=S13\",\"END=\"\r"; continue
expect "=S13END=" send after=300000,"SHOW DEVICE MU\rWRITE SYS$OUTPUT \"=S14\",\"END=\"\r"; continue
expect "=S14END=" echof "\n*** b1.ini done"; exit
boot kdb0
