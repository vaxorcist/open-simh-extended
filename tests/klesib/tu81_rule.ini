; open-simh-extended/tests/klesib/tu81_rule.ini  v1 (2026-11-17)
; Console test of the KLESI-B realism rule (patch 11 v2): a KLESI-B (TB on
; the VAX 8200) connects TU81 drives only.  In the realism mode (SET REALISM
; ENABLED) SET TB TK50/TK70/TKUSER and ATTACH of a non-TU81 TB are refused,
; and SET REALISM ENABLED is refused while an enabled TB has another type.
; Without the realism mode TB keeps the vanilla Open SIMH choices.  TQ
; (TUK50/TU81 on the Unibus) is not affected.  No disk image needed.
; Run:  BIN/vax8200 tests/klesib/tu81_rule.ini   (in a scratch directory;
;       step 4 creates x.tap)
; Expected:
;   1  TB type TK50, then TK70 (no error)
;   2  %SIM-ERROR: SET REALISM ENABLED: TB: ... not a TK70; SHOW REALISM
;      says disabled
;   3  three errors "TB: a KLESI-B connects TU81 drives only, not a TK70 /
;      TK50 / TKUSER"; SHOW TB TYPE says TU81
;   4  "TB: realism mode: TK50 replaced by TU81 ..." at SET TB ENABLE (a
;      TK50 chosen while TB was disabled), SHOW TB says TU81, ATTACH works
;   5  TQ: TK70, then TK50 (no error)
echo === 1 realism disabled: TK50 and TK70 on TB allowed (vanilla behaviour)
set tb enable
set tb tk50
show tb type
set tb tk70
show tb type
echo === 2 SET REALISM ENABLED with TB a TK70: refused
set realism enabled
show realism
echo === 3 TU81: realism enabled works; then TK50/TK70/TKUSER refused, TU81 kept
set tb tu81
set realism enabled
set tb tk70
set tb tk50
set tb tkuser=50
show tb type
echo === 4 TB disabled as TK50 before realism, enabled later: becomes a TU81
set realism disabled
set tb disable
set tb tk50
set realism enabled
set tb enable
show tb type
attach -n tb0 x.tap
detach tb0
echo === 5 TQ unchanged: TK70 and TK50 with realism enabled
set tq tk70
show tq type
set tq tk50
show tq type
exit
