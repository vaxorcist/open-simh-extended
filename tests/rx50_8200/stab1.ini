; open-simh-extended/tests/rx50_8200/stab1.ini  v1
; VMS V4.7 on the VAX 8200: @SYS$UPDATE:STABACKIT CSA1: builds the
; standalone BACKUP kit on three console RX50 diskettes (Ulli's case of
; 2026-11-12: plain Open SIMH crashed with a segmentation fault while
; copying SYS.EXE, known issues 54).  Normal mode; copy verification on.
; The script puts a new blank diskette into CS0 (CSA1) at each request.
; Needs the integration build (patch 3) and a copy of VMS047.R81
; (SYSTEM/MANAGER) in the current directory.
; Run:  BIN/vax8200 stab1.ini > stab1.out < /dev/null
set cpu 16m
set rq0 ra81
attach rq0 VMS047.R81
! rm -f stab1_1.rx50 stab1_2.rx50 stab1_3.rx50
set runlimit 3600 seconds
expect "HH:MM)" send "12-NOV-2026 10:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "@SYS$UPDATE:STABACKIT\r"; continue
expect "build the kit: " send "CSA1:\r"; continue
expect "build the system kit?" send "YES\r"; continue
expect "build the application kit?" send "YES\r"; continue
expect "scan for bad blocks?" send "NO\r"; continue
expect "verify copies?" send "YES\r"; continue
expect "volume label SYSTEM_1." attach -n cs0 stab1_1.rx50; continue
expect "volume label SYSTEM_2." attach -n cs0 stab1_2.rx50; continue
expect "volume label BACKUP." attach -n cs0 stab1_3.rx50; continue
expect -p "when ready: " send after=500000,"YES\r"; continue
expect "$ " echo == back at DCL; exit
boot rq0
