; open-simh-extended/tests/rx50_8200/t1.ini  v1
; VAX 8200 console floppy (CS, an RX50) in the sound realism mode: the
; program of prog.ini (python3 -I mkprog.py > prog.ini) reads sectors on
; both slots; SET CS DEBUG=FNC shows the realistic time of every command.
; Needs a.rx50 and b.rx50 (409600 bytes each, any content).
; Expected: the first read starts the motor (0.5 s) and steps 40 tracks;
; every second sector (the 2:1 interleave) takes two sector times (40 ms;
; 300 rpm, 10 sectors); the very next sector a revolution and a sector
; (just missed: the reason for the interleave); going back one sector
; almost a revolution; slot B on the same
; track: no steps (one carriage), slot A's head unloads; motor and heads
; off 2 s after the last command (SHOW CSn DRIVE after SLEEP 3).  RUN, not
; GO: RUN powers the system on, and with it the floppy controller.
set sound enabled
set throttle 1M
set debug stdout
set cs debug=fnc
attach cs0 a.rx50
attach cs1 b.rx50
do prog.ini
run 1000
show cs0 drive
show cs1 drive
sleep 3
show cs0 drive
show cs1 drive
quit
