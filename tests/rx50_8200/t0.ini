; open-simh-extended/tests/rx50_8200/t0.ini  v1
; VAX 8200 console RX50, physical track 0 (known issues 54): a VAX program
; (t0prog.ini, from mkprog.py) reads track 0 sector 1 of slot A.  The image
; num.rx50 has its block number in the first two bytes of every block, so
; the sector buffer (DBUF) shows which block was read.  Physical track 0
; holds the last ten blocks (logical track 79): the read must give a block
; from 790-799, not crash (plain Open SIMH: segmentation fault).
; Run (a numbered image in the current directory):
;   python3 -c "b=bytearray(409600)
;   for n in range(800): b[n*512]=n&255; b[n*512+1]=n>>8
;   open('num.rx50','wb').write(b)"
;   BIN/vax8200 t0.ini < /dev/null
set cpu 16m
attach cs0 num.rx50
do t0prog.ini
set cs debug=fnc
set debug stdout
run 1000
echo after read track 0 sector 1:
examine cs dbuf[0]
examine cs dbuf[1]
exit
