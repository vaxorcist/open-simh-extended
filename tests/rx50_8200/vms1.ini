; open-simh-extended/tests/rx50_8200/vms1.ini  v1
; VMS V4.7 on the VAX 8200 with its console RX50 (CS0 = CSA1, CS1 = CSA2),
; normal mode (sound disabled).  Needs the integration build (patch 3, the
; 8200 Unibus adapter fix) and a copy of VMS047.R81 (SYSTEM/MANAGER) in the
; current directory; both console diskettes are created new (blank).
; Workload: SYSGEN CONNECT CONSOLE; MOUNT/FOREIGN CSA1 and CSA2; EXCHANGE
; INITIALIZE both as RT-11 volumes; EXCHANGE COPY SYSGEN.EXE to CSA1, from
; CSA1 to CSA2 and back to SYS$LOGIN; DIFFERENCES (no differences);
; EXCHANGE DIRECTORY; DISMOUNT.  Commands are sent one at a time.
; Run:  BIN/vax8200 tests/rx50_8200/vms1.ini > vms1.out < /dev/null
set cpu 16m
set rq0 ra81
attach rq0 VMS047.R81
! rm -f csa1.rx50 csa2.rx50
attach -n cs0 csa1.rx50
attach -n cs1 csa2.rx50
set debug -t vms1.dbg
set cs debug=fnc
set runlimit 1800 seconds
expect "HH:MM)" send "11-NOV-2026 22:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "RUN SYS$SYSTEM:SYSGEN\r"; continue
expect "SYSGEN>" send "CONNECT CONSOLE\r"; continue
expect "CONNECT CONSOLE\r\n" send after=500000,"EXIT\r"; continue
expect "EXIT\r\n" send after=500000,"SHOW DEVICE CS\rWRITE SYS$OUTPUT \"=M0\",\"END=\"\r"; continue
expect "=M0END=" send after=200000,"MOUNT/FOREIGN CSA1:\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=200000,"MOUNT/FOREIGN CSA2:\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=200000,"EXCHANGE INITIALIZE CSA1:/VOLUME_FORMAT=RT11 CSONE\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=200000,"EXCHANGE INITIALIZE CSA2:/VOLUME_FORMAT=RT11 CSTWO\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=200000,"EXCHANGE COPY SYS$SYSTEM:SYSGEN.EXE CSA1:SYSGEN.EXE\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=200000,"EXCHANGE COPY CSA1:SYSGEN.EXE CSA2:SYSGEN.EXE\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=200000,"EXCHANGE COPY CSA2:SYSGEN.EXE SYS$LOGIN:SYSGEN.CS\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" send after=200000,"DIFFERENCES SYS$SYSTEM:SYSGEN.EXE SYS$LOGIN:SYSGEN.CS\rWRITE SYS$OUTPUT \"=M8\",\"END=\"\r"; continue
expect "=M8END=" send after=200000,"EXCHANGE DIRECTORY CSA1:,CSA2:\rWRITE SYS$OUTPUT \"=M9\",\"END=\"\r"; continue
expect "=M9END=" send after=200000,"DELETE SYS$LOGIN:SYSGEN.CS;*\rWRITE SYS$OUTPUT \"=M10\",\"END=\"\r"; continue
expect "=M10END=" send after=200000,"DISMOUNT CSA1:\rWRITE SYS$OUTPUT \"=M11\",\"END=\"\r"; continue
expect "=M11END=" send after=200000,"DISMOUNT CSA2:\rWRITE SYS$OUTPUT \"=M12\",\"END=\"\r"; continue
expect "=M12END=" exit
boot rq0
