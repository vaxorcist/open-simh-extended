; open-simh-extended/tests/rx50_8200/stab2.ini  v1
; Cross-check of the VAX 8200 console RX50 track 0 fix (known issues 54):
; the first standalone kit diskette written by stab1.ini on the 8200
; (stab1_1.rx50, volume SYSTEM_1) is read by VMS V4.7 on the MicroVAX II
; as an RX50 on an RQDX3 (DUB1).  The RQDX maps the last ten blocks to
; physical track 0, as the fixed 8200 console does, so the files must be
; intact: ANALYZE/DISK_STRUCTURE, DUMP/HEADER of SYS.EXE (its retrieval
; pointers reach the last blocks of the diskette), DIFFERENCES of VMB.EXE
; and of the first 136 blocks of SYS.EXE against the system disk.
; Needs a copy of VMS047.R81 and stab1_1.rx50 in the current directory.
; Run:  BIN/microvax2 stab2.ini > stab2.out < /dev/null
set cpu 16m
set rq kda50
set rq0 ra81
set rq1 disabled
set rq2 disabled
set rq3 disabled
attach rq0 VMS047.R81
set rqb enabled
set rqb0 disabled
set rqb1 rx50
set rqb2 disabled
set rqb3 disabled
attach rqb1 stab1_1.rx50
set runlimit 900 seconds
expect ">>>" send "B DUA0\r"; continue
expect "HH:MM)" send "12-NOV-2026 11:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "WAIT 00:00:40\rWRITE SYS$OUTPUT \"=M0\",\"END=\"\r"; continue
expect "=M0END=" send after=200000,"MOUNT/OVERRIDE=IDENTIFICATION/NOWRITE DUB1:\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=200000,"ANALYZE/DISK_STRUCTURE DUB1:\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=200000,"DIRECTORY/SIZE=ALL DUB1:[SYS0.SYSEXE]SYS.EXE,VMB.EXE\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=200000,"DUMP/HEADER/BLOCKS=COUNT=0 DUB1:[SYS0.SYSEXE]SYS.EXE\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=200000,"DIFFERENCES DUB1:[SYS0.SYSEXE]VMB.EXE SYS$SYSTEM:VMB.EXE\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=200000,"DIFFERENCES/MAXIMUM_DIFFERENCES=1 DUB1:[SYS0.SYSEXE]SYS.EXE SYS$SYSTEM:SYS.EXE\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=200000,"DISMOUNT DUB1:\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" exit
boot cpu
