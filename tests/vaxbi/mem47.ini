; open-simh-extended/tests/vaxbi/mem47.ini  v1 (2026-11-17, patch 14)
; VMS V4.7 on the VAX 8200 with a memory configuration given as the first
; argument (a SIMH command, e.g. "set cpu 48m" or "do m192.do"); system disk
; VMS047_1.R81 (a copy) on KDB0.  After the login: SHOW MEMORY/PHYSICAL_PAGES
; (VMS's view of the memory) and SYSGEN SHOW/ADAPTER (the BI nodes, the
; memory boards as "BI Memory").
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 mem47.ini "set cpu 48m" > m48.out < /dev/null
; Expected: "Main Memory (nn.00Mb)" with nn the configured size, one "BI
; Memory" line per board at the boards' nodes, "*** mem47.ini done".
%1
show mctl
show bi
set kdb0 ra81
attach kdb0 VMS047_1.R81
set runlimit 1200 seconds
expect "HH:MM)" send "17-NOV-2026 21:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"SHOW MEMORY/PHYSICAL_PAGES\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"RUN SYS$SYSTEM:SYSGEN\rSHOW/ADAPTER\rEXIT\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" echof "\n*** mem47.ini done"; exit
boot kdb0
