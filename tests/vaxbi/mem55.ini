; open-simh-extended/tests/vaxbi/mem55.ini  v1 (2026-11-17, patch 14)
; VMS V5.5 on the VAX 8200 with a memory configuration given as the first
; argument (a SIMH command, e.g. "set cpu 128m" or "do m192.do"); system disk
; v55.r82, a COPY of Ulli's VMS055.R82 (confidential: workspace only, never
; delivered), on KDB0; login SYSTEM without password.  After the login: SHOW
; MEMORY/PHYSICAL_PAGES, SYSGEN SHOW/ADAPTER, SHOW CPU.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 mem55.ini "do m192.do" > m192.out < /dev/null
; Expected: "Main Memory (nn.00Mb)" with nn the configured size, one "BI
; Memory" line per board, "*** mem55.ini done".
%1
show mctl
set kdb0 ra82
attach kdb0 v55.r82
set runlimit 1500 seconds
expect "HH:MM)" send "17-NOV-2026 21:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "$ " send after=500000,"SHOW MEMORY/PHYSICAL_PAGES\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"RUN SYS$SYSTEM:SYSGEN\rSHOW/ADAPTER\rEXIT\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"SHOW CPU\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" echof "\n*** mem55.ini done"; exit
boot kdb0
