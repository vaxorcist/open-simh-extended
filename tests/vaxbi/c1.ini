; open-simh-extended/tests/vaxbi/c1.ini  v1 (2026-11-17, patch 14)
; Console test of the VAXBI configuration of the VAX 8200 (no disk needed).
; Run:  BIN/vax8200 tests/vaxbi/c1.ini   (from the tests/vaxbi directory for
;       the DO of m192.do; BOOT is not used)
; Expected:
;   1  SHOW BI: UBA node 0, KA0 2, KDB 4, MCTL1 14, MCTL0 15 (two MS820-AA,
;      4MB); "disabled: KA1 (node 1), DMB (node 5), ET (node 7), TB (node 6)";
;      "configuration rules: met"
;   2  SET CPU 48M: MCTL0-MCTL2 MS820-CA on nodes 15-13; SET MCTL3
;      TYPE=MS820-BA, SET MCTL4 TYPE=MS820-AA: 54MB on 5 boards (set by SET
;      MCTLn); SHOW CPU MEMORY lists them with their addresses
;   3  SET MCTL2 NODE=4 refused (in use by KDB), NODE=C refused (MCTL3's,
;      the MS820-BA put in), NODE=3 accepted; SET MCTL8 TYPE=MS820-CA refused
;      (no node); SET MCTL3 DISABLED: 50MB
;   4  SET KA1 NODE=2 refused (KA0); SET UBA NODE=1 (free while KA1 is
;      disabled): SHOW BI shows UBA at 1 with window 20440000; back to 0
;   5  do m192.do: four warnings "MCTL: 9 ... 12 memory boards: VMS uses at
;      most 8 memory boards"; SHOW MCTL 192MB on 12 boards
;   6  SET CPU 512M: four SIMH-128MB boards; SET REALISM ENABLED refused
;      (MCTL0 SIMH-128MB); SET CPU 128M, SET REALISM ENABLED accepted; SET CPU
;      256M refused (realism: up to 128M); SET MCTL8 TYPE=SIMH-128MB refused
;   7  realism mode (128M: nodes 8-15 are memory): SET TB ENABLE; SET ET
;      NODE=5 refused (DEBNA ET node 5 below the KLESI-B TB node 6); SET TB
;      NODE=3 then SET ET NODE=5 accepted, SET ET ENABLE; SHOW BI
;      "configuration rules: met (realism mode)"; SET REALISM DISABLED, SET
;      ET NODE=1 accepted, SET REALISM ENABLED refused (the DEBNA ET (node 1)
;      ... KLESI-B TB (node 3))
echo === 1 defaults
show bi
echo === 2 SET CPU 48M plus two boards by hand
set cpu 48m
set mctl3 type=ms820-ba
set mctl4 type=ms820-aa
show mctl
show cpu memory
echo === 3 nodes and errors
set mctl2 node=4
set mctl2 node=c
set mctl2 node=3
set mctl8 type=ms820-ca
set mctl3 disabled
show mctl
echo === 4 KA and UBA nodes
set ka1 node=2
set uba node=1
show bi
set uba node=0
echo === 5 twelve boards
do m192.do
show mctl
echo === 6 SIMH-128MB boards and the realism mode
set cpu 512m
show mctl
set realism enabled
set cpu 128m
set realism enabled
set cpu 256m
set mctl8 node=3
set mctl8 type=simh-128mb
echo === 7 DEBNA above the KLESI-B (realism mode)
set tb enable
set et node=5
set tb node=3
set et node=5
set et enable
show bi
set realism disabled
set et node=1
set realism enabled
exit
