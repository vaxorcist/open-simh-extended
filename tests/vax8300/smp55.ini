; open-simh-extended/tests/vax8300/smp55.ini  v1 (2026-11-18)
; VMS V5.5 SMP regression on the VAX 8300 (known issues 81, patch 15): Ulli's
; configuration of 2026-11-18 (VAXBI-only, KA1, KDB50, TB, ET, DMB32), boot,
; login, SYSGEN HELP PARAMETERS (as in his report), EXIT.  The crash it found
; (SPLRELERR, or "Exception in interrupt or exception" at 86CFAB6E) needs a
; slow CPU: run it with "set throttle 400k" or "set realism enabled", and
; several times (it hit about half of the runs before the fix).
; Arguments: %1 memory command (e.g. "set cpu 128m"), %2 speed command
; ("set throttle 400k", "set realism enabled", or "echo normal"), %3 a free TCP
; port for the DMB32 async lines.
; Disk: v55.r82, a COPY of Ulli's VMS V5.5 RA82 image (confidential: workspace
; only).  Expected end: "*** h1 done"; smp55_rep.sh counts the outcomes.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 smp55.ini "set cpu 128m" "set throttle 400k" 2401 > s.out < /dev/null
%2
set uba disabled
%1
set cpu conhalt
set ka1 ena
set kdb ena
set kdb0 ena
set kdb0 ra81
attach kdb0 v55.r82
if "%2"=="set realism enabled" set kdb0 online
set tb ena
set et ena
set dmb enable
attach dmb-async %3
attach -n dmb-print lia.txt
set runlimit 3000 seconds
expect "HH:MM)" send "18-NOV-2026 9:15\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "$ " send after=1000000,"MC SYSGEN\r"; continue
expect "SYSGEN> " send after=500000,"HELP\r"; continue
expect "Topic? " send after=500000,"PARA\r"; continue
expect "Subtopic? " send after=500000,"MULTIPROCESSING\r"; continue
expect "Subtopic? " send after=500000,"\r"; continue
expect "Topic? " send after=500000,"PARA\r"; continue
expect "Subtopic? " send after=500000,"SMP_CPUS\r"; continue
expect "Subtopic? " send after=500000,"WSMAX\r"; continue
expect "Subtopic? " send after=500000,"QUANTUM\r"; continue
expect "Subtopic? " send after=500000,"\r"; continue
expect "Topic? " send after=500000,"SHOW\r"; continue
expect "Subtopic? " send after=500000,"\r"; continue
expect "Topic? " send after=500000,"\r"; continue
expect "SYSGEN> " send after=500000,"EXIT\r"; continue
expect "$ " echof "\n*** h1 done"; exit
boot kdb0
