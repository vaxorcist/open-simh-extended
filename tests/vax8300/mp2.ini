; open-simh-extended/tests/vax8300/mp2.ini  v1
; VAX 8300 (SET KA1 ENABLE), realism mode (THROTTLE 400K per processor),
; VMS V4.7 with the multiprocessing key (copy of Ulli's VMS047_1.R81):
; a CPU-bound MACRO-32 loop (4,000,000 SOBGTR) alone without and with the
; attached processor, then two at once (one in a subprocess, which writes
; its end time to T.LOG); STOP/CPU and START/CPU.
; Run:  SDL_AUDIODRIVER=dummy BIN/vax8200 mp2.ini > mp2.out < /dev/null
set cpu 16m
set ka1 enable
set sound enabled
set rq0 ra81
attach rq0 VMS047_1.R81
set rq0 online
set debug -t mp2.dbg
set ka1 debug=mp
set runlimit 1800 seconds
expect "HH:MM)" send "15-NOV-2026 11:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"DEFINE/SYSTEM/EXEC MP MP8SS\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"COPY SYS$SYSTEM:MP_8SS.EXE SYS$SYSTEM:MP8SS.EXE\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"OPEN/WRITE F LOOP.MAR\rWRITE F \"        .ENTRY  START,^M<>\"\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=500000,"WRITE F \"        MOVL    #4000000,R0\"\rWRITE F \"10$:    SOBGTR  R0,10$\"\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=500000,"WRITE F \"        MOVL    #1,R0\"\rWRITE F \"        RET\"\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=500000,"WRITE F \"        .END    START\"\rCLOSE F\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=500000,"OPEN/WRITE F T.COM\rWRITE F \"$ RUN LOOP\"\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" send after=500000,"WRITE F \"$ WRITE SYS$OUTPUT \"\"=SUB END \"\",F$TIME()\"\rCLOSE F\rWRITE SYS$OUTPUT \"=M8\",\"END=\"\r"; continue
expect "=M8END=" send after=500000,"MACRO LOOP\rWRITE SYS$OUTPUT \"=M9\",\"END=\"\r"; continue
expect "=M9END=" send after=500000,"LINK LOOP\rWRITE SYS$OUTPUT \"=M10\",\"END=\"\r"; continue
expect "=M10END=" send after=500000,"WRITE SYS$OUTPUT \"=T1A \",F$TIME()\rRUN LOOP\rWRITE SYS$OUTPUT \"=T1B \",F$TIME()\r"; continue
expect "=T1B " send after=2000000,"START/CPU\rWRITE SYS$OUTPUT \"=M11\",\"END=\"\r"; continue
expect "=M11END=" send after=3000000,"SHOW CPU\rWRITE SYS$OUTPUT \"=M12\",\"END=\"\r"; continue
expect "=M12END=" send after=500000,"WRITE SYS$OUTPUT \"=T2A \",F$TIME()\rRUN LOOP\rWRITE SYS$OUTPUT \"=T2B \",F$TIME()\r"; continue
expect "=T2B " send after=2000000,"WRITE SYS$OUTPUT \"=T3A \",F$TIME()\rSPAWN/NOWAIT/OUTPUT=T.LOG @T.COM\rWRITE SYS$OUTPUT \"=M13\",\"END=\"\r"; continue
expect "=M13END=" send after=200000,"SHOW CPU\rRUN LOOP\rWRITE SYS$OUTPUT \"=T3B \",F$TIME()\r"; continue
expect "=T3B " send after=2000000,"WAIT 00:00:30\rWRITE SYS$OUTPUT \"=M14\",\"END=\"\r"; continue
expect "=M14END=" send after=500000,"TYPE T.LOG\rWRITE SYS$OUTPUT \"=M15\",\"END=\"\r"; continue
expect "=M15END=" send after=500000,"STOP/CPU\rWRITE SYS$OUTPUT \"=M16\",\"END=\"\r"; continue
expect "=M16END=" send after=3000000,"SHOW CPU\rWRITE SYS$OUTPUT \"=M17\",\"END=\"\r"; continue
expect "=M17END=" send after=500000,"START/CPU\rWRITE SYS$OUTPUT \"=M18\",\"END=\"\r"; continue
expect "=M18END=" send after=3000000,"SHOW CPU\rWRITE SYS$OUTPUT \"=M19\",\"END=\"\r"; continue
expect "=M19END=" echof "\n*** done"; exit
boot rq0
