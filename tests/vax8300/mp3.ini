; open-simh-extended/tests/vax8300/mp3.ini  v1
; VAX 8300 (SET KA1 ENABLE), normal mode, VMS V4.7 with the multiprocessing
; key (copy of Ulli's VMS047_1.R81): START/CPU, STOP/CPU, START/CPU, each
; followed by SHOW CPU; then SHUTDOWN-free exit.
; Run:  BIN/vax8200 mp3.ini > mp3.out < /dev/null
set cpu 16m
set ka1 enable
set rq0 ra81
attach rq0 VMS047_1.R81
set debug -t mp3.dbg
set ka1 debug=mp
set runlimit 500 seconds
expect "HH:MM)" send "15-NOV-2026 11:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"DEFINE/SYSTEM/EXEC MP MP8SS\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"COPY SYS$SYSTEM:MP_8SS.EXE SYS$SYSTEM:MP8SS.EXE\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"START/CPU\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=3000000,"SHOW CPU\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=500000,"STOP/CPU\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=3000000,"SHOW CPU\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=500000,"START/CPU\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" send after=3000000,"SHOW CPU\rWRITE SYS$OUTPUT \"=M8\",\"END=\"\r"; continue
expect "=M8END=" echof "\n*** done"; show ka1; exit
boot rq0
