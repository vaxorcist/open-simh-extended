; open-simh-extended/tests/vax8300/stab8200.ini  v1
; Single-processor VAX 8200 regression for the dual CPU work: boot
; standalone BACKUP V4.7 from the console RX50 (STABACKIT kit SYSTEM_1,
; SYSTEM_2, BACKUP: copies k1/k2/k3.rx50), prompts as in Ulli's log.
; Run:  BIN/vax8200 stab8200.ini > stab8200.out < /dev/null
attach cs0 k1.rx50
set runlimit 500 seconds
expect "Insert the first standalone system volume" send after=200000,"YES\r"; continue
expect "Insert the next standalone system volume" att cs0 k2.rx50; send after=200000,"YES\r"; continue
expect "(DD-MMM-YYYY  HH:MM)" send after=200000,"15-NOV-2026 11:00\r"; continue
expect "Insert the standalone application volume" att cs0 k3.rx50; send after=200000,"YES\r"; continue
expect "$ " echof "\n*** standalone BACKUP prompt reached"; exit
boot cs0
