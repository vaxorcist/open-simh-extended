; open-simh-extended/tests/vax8300/reboot1.ini  v2
; VAX 8300 (KA1 enabled), realism mode, SET CPU CONHALT: VMS V4.7 SHUTDOWN
; with automatic reboot while the attached processor runs; the system must
; come up again ("Rebooting...", date prompt).  Without SET CPU CONHALT the
; HALT instruction stops the simulator ("HALT instruction"), as in plain SIMH.
set cpu 16m
set cpu conhalt
set ka1 enable
set realism enabled
set rq0 ra81
attach rq0 VMS047_1.R81
set rq0 online
set runlimit 900 seconds
expect "HH:MM)" send "15-NOV-2026 15:10\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send after=500000,"DEFINE/SYSTEM/EXEC MP MP8SS\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=500000,"COPY SYS$SYSTEM:MP_8SS.EXE SYS$SYSTEM:MP8SS.EXE\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=500000,"START/CPU\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=3000000,"SHOW CPU\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=500000,"@SYS$SYSTEM:SHUTDOWN\r"; continue
expect "final shutdown [0]:" send after=200000,"\r"; continue
expect "Reason for shutdown" send after=200000,"\r"; continue
expect "spin down the disk volumes" send after=200000,"\r"; continue
expect "site-specific shutdown procedure" send after=200000,"\r"; continue
expect "automatic system reboot be performed" send after=200000,"YES\r"; continue
expect "When will the system be rebooted" send after=200000,"\r"; continue
expect "Shutdown options [NONE]:" send after=200000,"\r"; continue
expect "Rebooting..." echof "\n*** reboot seen"; continue
expect [1] "HH:MM)" echof "\n*** date prompt after the reboot: OK"; exit
boot rq0
