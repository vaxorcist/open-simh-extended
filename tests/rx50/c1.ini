; open-simh-extended/tests/rx50/c1.ini  v1
; RX50 configuration rules of the sound realism mode, MicroVAX II (Qbus).
; Run: BIN/microvax2 tests/rx50/c1.ini
; Expected: the default RQDX3 configuration (RD54, RD54, RD54, RX50) is
; accepted; SET RQ KDA50 disables RQ3 (RX50) with a message; back on an
; RQDX3, RX50 units pair by consecutive unit numbers (1/2 and a lone 3;
; after RQ1 becomes an RD54: 2/3); SET RQ KDA50 again disables the RX50
; units, an RX50 on the RQDX3 (RQ0) is accepted.
set sound enabled
show rq
set rq kda50
show rq3
set rq rqdx3
set rq3 enabled
set rq1 rx50
set rq2 rx50
show rq
show rq1 drive
show rq2 drive
show rq3 drive
set rq1 rd54
show rq2 drive
show rq3 drive
set rq kda50
set rq rqdx3
set rq0 rx50
show rq
quit
