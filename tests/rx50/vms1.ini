; open-simh-extended/tests/rx50/vms1.ini  v1
; VMS V4.7 on the MicroVAX II with RX50 diskettes, normal mode (sound disabled).
; The system disk is an RA81 on the first controller (a KDA50: SDI rules
; of the realism mode); the second controller RQB (an RQDX3) has one RX50
; drive with both slots: RQB1 = DUB1 (slot A) and RQB2 = DUB2 (slot B),
; consecutive unit numbers.  Both diskettes are created new (blank).
; Workload (after 40 s: VMS V4.7 configures the second MSCP port late):
; INITIALIZE both, MOUNT both, COPY SYS$SYSTEM:SYSGEN.EXE to DUB1,
; COPY it from DUB1 to DUB2 (the one carriage moves between the two
; diskettes' files), DIFFERENCES against the original (no differences),
; DIRECTORY, DISMOUNT both.  Commands are sent one at a time.
; Needs a copy of VMS047.R81 (SYSTEM/MANAGER) in the current directory.
; Run:  BIN/microvax2 tests/rx50/vms1.ini > vms1.out
set cpu 16m
set rq kda50
set rq0 ra81
set rq1 disabled
set rq2 disabled
set rq3 disabled
attach rq0 VMS047.R81
set rqb enabled
set rqb0 disabled
set rqb1 rx50
set rqb2 rx50
set rqb3 disabled
! rm -f dub1.rx50 dub2.rx50
attach -n rqb1 dub1.rx50
attach -n rqb2 dub2.rx50
set debug -t vms1.dbg
set rqb debug=trace
set runlimit 1800 seconds
expect ">>>" send "B DUA0\r"; continue
expect "HH:MM)" send "11-NOV-2026 21:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "WAIT 00:00:40\rSHOW DEVICE DU\rWRITE SYS$OUTPUT \"=M0\",\"END=\"\r"; continue
expect "=M0END=" send after=200000,"INITIALIZE DUB1: RX50A\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=200000,"INITIALIZE DUB2: RX50B\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=200000,"MOUNT DUB1: RX50A\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=200000,"MOUNT DUB2: RX50B\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=200000,"COPY SYS$SYSTEM:SYSGEN.EXE DUB1:[000000]\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=200000,"COPY DUB1:[000000]SYSGEN.EXE DUB2:[000000]\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=200000,"DIFFERENCES SYS$SYSTEM:SYSGEN.EXE DUB2:[000000]SYSGEN.EXE\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" send after=200000,"DIRECTORY/SIZE DUB1:[000000],DUB2:[000000]\rWRITE SYS$OUTPUT \"=M8\",\"END=\"\r"; continue
expect "=M8END=" send after=200000,"DISMOUNT DUB1:\rWRITE SYS$OUTPUT \"=M9\",\"END=\"\r"; continue
expect "=M9END=" send after=200000,"DISMOUNT DUB2:\rWRITE SYS$OUTPUT \"=M10\",\"END=\"\r"; continue
expect "=M10END=" send after=200000,"SHOW DEVICE DUB\rWRITE SYS$OUTPUT \"=M11\",\"END=\"\r"; continue
expect "=M11END=" exit
boot cpu
