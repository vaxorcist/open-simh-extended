; open-simh-extended/tests/rx50/stab2.ini  v1
; MicroVAX II, RQDX3 (RQB), RX50: boot of Ulli's VMS V4.7 standalone BACKUP kit
; (STABA047-1..3.RX50, here copies s1..s3.rx50), sound realism mode.
; On the MicroVAX the first prompt is already "Insert the NEXT standalone system
; volume": SYSTEM_1 is loaded, insert SYSTEM_2 there (answering YES with SYSTEM_1
; still in loads SYSTEM_1 again as part of SYS.EXE: %SYSBOOT-F-Unexpected Machine
; Check after SYSTEM_2), then the BACKUP volume at "standalone application volume".
; Needs in the current directory: microvax2dis.ini, VMS047-1.R81, s1..s3.rx50 (copies).
; Run:  SDL_AUDIODRIVER=dummy BIN/microvax2 stab2.ini < /dev/null
do microvax2dis.ini
set cpu 5m
set sound enabled
set rq ena
set rq kda50
set rq0 ena
set rq0 ra81
att rq0 VMS047-1.R81
set rqb ena
set rqb rqdx3
set rqb0 ena
set rqb0 rx50
set rqb1 ena
set rqb1 rx50
att rqb0 s1.rx50
set rq0 online
set runlimit 1200 seconds
expect ">>>" send after=200000,"boot dub0\r"; continue
expect "Insert the next standalone system volume" att rqb0 s2.rx50; send after=200000,"YES\r"; continue
expect "Insert the standalone application volume" att rqb0 s3.rx50; send after=200000,"YES\r"; continue
expect "(DD-MMM-YYYY  HH:MM)" send after=200000,"14-NOV-2026 14:30\r"; continue
expect "Machine Check" echof "\n*** MACHINE CHECK"; ex -v pc; show rqb; show rqb0 drive; exit
expect "$ " echof "\n*** standalone BACKUP prompt reached"; exit
boot cpu
