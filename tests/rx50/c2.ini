; open-simh-extended/tests/rx50/c2.ini  v1
; RX50 configuration rules of the sound realism mode, VAX-11/750 (Unibus).
; Run: BIN/vax750 tests/rx50/c2.ini
; Expected: SET SOUND ENABLED disables RQ3 (the RX50 of the default
; UDA50A configuration) with a message; SET RQ RUX50 makes RQ0-RQ3 RX50
; units (two drives: 0/1, 2/3); an RD54 on the RUX50 is refused; SET RQ
; UDA50A gives the units their initial types back (RD54, RD54, RD54) and
; disables the RX50 (RQ3).
set sound enabled
show rq
set rq rux50
show rq
show rq1 drive
show rq2 drive
set rq1 rd54
set rq uda50a
show rq
quit
