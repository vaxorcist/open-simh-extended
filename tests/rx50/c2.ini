; open-simh-extended/tests/rx50/c2.ini  v3
; RX50 configuration rules of the realism mode, VAX-11/750 (Unibus).
; Run: BIN/vax750 tests/rx50/c2.ini
; Expected: SET REALISM ENABLED disables RQ0-RQ2 (RD54: the UDA50A only
; connects SDI drives, known issues 68) and RQ3 (the RX50) of the default
; UDA50A configuration with a message; SET RQ RUX50 makes RQ0-RQ3 RX50
; units (two drives: 0/1, 2/3); an RD54 on the RUX50 is refused; SET RQ
; UDA50A gives the units their initial types back (RD54, RD54, RD54) and
; disables them all again (RD54: SDI rule, RX50: RX50 rule).
set realism enabled
show rq
set rq rux50
show rq
show rq1 drive
show rq2 drive
set rq1 rd54
set rq uda50a
show rq
quit
