; open-simh-extended/tests/rx02/n1.ini  v1
; RT-11 from the RX02 (DY0) on a PDP-11/70, normal mode (sound disabled)
set cpu 11/70
set rx disabled
set ry enabled
attach ry0 rt.rx2
expect "\r\n." send "DIR\r"; continue
expect "Free blocks" send "SHOW\r"; continue
expect "TT  (Resident)" exit
boot ry0
