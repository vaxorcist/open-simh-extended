; open-simh-extended/tests/rx02/sd0.ini  v1
; Set Media Density (function 4) on drive 0 with no diskette attached.
; PDP-11: RX211 at 177170.  Program at 1000:
;   MOV #177170,R1 ; MOV #11,(R1) (func 4 = set density, GO, drive 0)
;   wait TR ; MOV #111,2(R1) (the 'I' confirmation) ; wait DONE ; HALT
set cpu 11/70
set rx disabled
set ry enabled
deposit 1000 012701
deposit 1002 177170
deposit 1004 012711
deposit 1006 000011
deposit 1010 105711
deposit 1012 100376
deposit 1014 012761
deposit 1016 000111
deposit 1020 000002
deposit 1022 032711
deposit 1024 000040
deposit 1026 001775
deposit 1030 000000
deposit pc 1000
step 200000
show ry
examine ry state
show rx
examine pc
quit
