; open-simh-extended/tests/rx02/t1.ini  v1
; One Read Sector (drive 0, track 1, sector 1, double density) by a small
; program, then the head unload at the prompt.  Realism mode.
set cpu 11/70
set rx disabled
set ry enabled
set sound enabled
set debug stdout
set ry debug=ops
attach ry0 rt.rx2
; MOV #177170,R1; MOV #407,(R1) (read, GO, double density);
; wait TR; MOV #1,2(R1); wait TR; MOV #1,2(R1); wait DONE; HALT
deposit 1000 012701
deposit 1002 177170
deposit 1004 012711
deposit 1006 000407
deposit 1010 105711
deposit 1012 100376
deposit 1014 012761
deposit 1016 000001
deposit 1020 000002
deposit 1022 105711
deposit 1024 100376
deposit 1026 012761
deposit 1030 000001
deposit 1032 000002
deposit 1034 032711
deposit 1036 000040
deposit 1040 001775
deposit 1042 000000
go 1000
show ry0 drive
examine ry rycs
step 100000
show ry0 drive
sleep 1
show ry0 drive
quit
