; open-simh-extended/tests/rx02/v1.ini  v1
; VAX-11/750, RX211 (RY) in the realism mode at the console: ATTACH, drive
; state, power on/off, SET SOUND guard.
set ry enabled
set sound enabled
attach ry0 rt.rx2
show ry
show ry0 drive
set sound power=on
show ry0 drive
show ry1 drive
show sound
set sound power=off
detach ry0
show ry0 drive
quit
