; open-simh-extended/tests/rx02/r1.ini  v3
; RT-11 from the RX02 (DY0) on a PDP-11/70, sound realism mode.
; Workload: DIR, COPY of HELP.SAV (161 blocks), DIR, DELETE, DIR.
set cpu 11/70
set rx disabled
set ry enabled
set sound enabled
set sound path=../../sound
set debug -t r1.dbg
set ry debug=ops
show ry0 drive
attach ry0 rt.rx2
show ry0 drive
expect "RT-11SB" send "DIR\r"; continue
expect "193 Free blocks" send "COPY HELP.SAV HELP2.SAV\rDIR HELP*.*\r"; continue
expect "32 Free blocks" send "UNPROTECT HELP2.SAV\rDELETE/NOQUERY HELP2.SAV\rDIR HELP*.*\r"; continue
expect "193 Free blocks" step 2000000
boot ry0
show ry0 drive
show ry1 drive
show sound
set sound power=off
