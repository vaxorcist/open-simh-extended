; open-simh-extended/tests/rx02/vms3.ini  v1
; VMS V4.7 on the VAX-11/750 with an RX02, sound realism
; mode (SDL_AUDIODRIVER=dummy is fine).
; Automated: needs a copy of VMS047.R81 (SYSTEM/MANAGER) in the current
; directory.  Commands are sent one at a time (in realism mode several
; typed-ahead commands overflowed the VMS type-ahead buffer: DATAOVERUN).
; DYA0 gets a new diskette initialized double density, DYA1 one
; initialized single density; each is mounted, LOGINOUT.EXE copied,
; listed and dismounted.  Before the fix of known issues 47 MOUNT failed
; with %MOUNT-F-DRVERR on the double density diskette.
; Run:  BIN/vax750 tests/rx02/vms3.ini > vms3.out
; Check: grep -c "MOUNT-I-MOUNTED" vms3.out   (must be 2, no DRVERR)
set cpu 8m
set sound enabled
set rq0 ra81
attach rq0 VMS047.R81
set rq0 online
set ry enabled
! rm -f dyt3-0.rx2 dyt3-1.rx2
attach -n ry0 dyt3-0.rx2
attach -n ry1 dyt3-1.rx2
set debug -t vms3.dbg
set ry debug=cmd
set runlimit 900 seconds
expect "HH:MM)" send "11-NOV-2026 12:00\r"; continue
expect "job terminated" send after=2000000,"\r"; continue
expect "Username:" send "SYSTEM\r"; continue
expect "Password:" send "MANAGER\r"; continue
expect "$ " send "SHOW DEVICE DY\r"; continue
expect "DYA1:" send after=200000,"INITIALIZE/DENSITY=DOUBLE DYA0: RX02D\rWRITE SYS$OUTPUT \"=M0\",\"END=\"\r"; continue
expect "=M0END=" send after=200000,"INITIALIZE/DENSITY=SINGLE DYA1: RX02S\rWRITE SYS$OUTPUT \"=M1\",\"END=\"\r"; continue
expect "=M1END=" send after=200000,"MOUNT DYA0: RX02D\rWRITE SYS$OUTPUT \"=M2\",\"END=\"\r"; continue
expect "=M2END=" send after=200000,"MOUNT DYA1: RX02S\rWRITE SYS$OUTPUT \"=M3\",\"END=\"\r"; continue
expect "=M3END=" send after=200000,"COPY SYS$SYSTEM:LOGINOUT.EXE DYA0:[000000]\rWRITE SYS$OUTPUT \"=M4\",\"END=\"\r"; continue
expect "=M4END=" send after=200000,"COPY SYS$SYSTEM:LOGINOUT.EXE DYA1:[000000]\rWRITE SYS$OUTPUT \"=M5\",\"END=\"\r"; continue
expect "=M5END=" send after=200000,"DIRECTORY/SIZE DYA0:[000000]LOGINOUT.EXE,DYA1:[000000]LOGINOUT.EXE\rWRITE SYS$OUTPUT \"=M6\",\"END=\"\r"; continue
expect "=M6END=" send after=200000,"DISMOUNT DYA0:\rWRITE SYS$OUTPUT \"=M7\",\"END=\"\r"; continue
expect "=M7END=" send after=200000,"DISMOUNT DYA1:\rWRITE SYS$OUTPUT \"=M8\",\"END=\"\r"; continue
expect "=M8END=" send after=200000,"SHOW DEVICE DY\rWRITE SYS$OUTPUT \"=M9\",\"END=\"\r"; continue
expect "=M9END=" exit
boot rq0
