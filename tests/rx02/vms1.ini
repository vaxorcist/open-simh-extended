; open-simh-extended/tests/rx02/vms1.ini  v1
; VMS V4.7 on the VAX-11/750 with an RX02 (DYA0), sound realism mode.
; For Ulli (interactive): needs VMS047-1.R81 in the current directory (a
; copy: the RA81 image is written to).  The script attaches a new blank
; double-density diskette dyt.rx2 (deleted first), spins up the RA81 (20 s)
; and boots; log in as SYSTEM and type the DCL commands listed in
; tests/rx02/README.txt (VMS test).
set cpu 8m
set sound enabled
set rq0 ra81
attach rq0 VMS047-1.R81
set rq0 online
set ry enabled
set ry0 double
! rm -f dyt.rx2
attach -n ry0 dyt.rx2
set debug -t vms1.dbg
set ry debug=ops
show ry0 drive
boot rq0
