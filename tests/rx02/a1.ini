; open-simh-extended/tests/rx02/a1.ini  v2
; Audio check (SDL disk driver, real time): RT-11 boot and DIR in the
; realism mode, then 2 s at the prompt (head unload), DETACH (door), power off.
set cpu 11/70
set rx disabled
set ry enabled
set sound enabled
set sound path=../../sound
set debug -t a1.dbg
set ry debug=ops
attach ry0 rt.rx2
echo T_ATTACHED
expect "RT-11SB" send "DIR\r"; continue
expect "193 Free blocks" step 60000000
boot ry0
echo T_PROMPT
show ry0 drive
sleep 2
show ry0 drive
detach ry0
echo T_DETACHED
sleep 1
set sound power=off
echo T_OFF
sleep 6
