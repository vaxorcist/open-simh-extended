; open-simh-extended/tests/rx02/sd1.ini  v1
; Set Media Density (function 4): (a) normal mode, empty drive 0 (crashed
; before: known issues 45); (b) realism mode, empty drive; (c) realism mode,
; a blank double density diskette in drive 1: about 15 s.
set cpu 11/70
set rx disabled
set ry enabled
set debug stdout
set ry debug=ops
; program at 1000: R0 = command word (set density | drive | density | GO)
deposit 1000 012701
deposit 1002 177170
deposit 1004 010011
deposit 1006 105711
deposit 1010 100376
deposit 1012 012761
deposit 1014 000111
deposit 1016 000002
deposit 1020 032711
deposit 1022 000040
deposit 1024 001775
deposit 1026 000000
echo (a) normal mode, empty drive 0
deposit r0 000011
go 1000
examine ry rycs,ryerr
set sound enabled
echo (b) realism mode, empty drive 0
deposit r0 000011
go 1000
examine ry rycs,ryerr
echo (c) realism mode, blank diskette in drive 1, double density
attach -n ry1 blank.rx2
set sound power=on
show ry1 drive
deposit r0 000431
go 1000
examine ry rycs,ryerr
show ry1 drive
echo (d) SET SOUND DISABLED with RY1 attached
set sound disabled
quit
