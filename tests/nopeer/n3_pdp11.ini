; open-simh-extended/tests/nopeer/n3_pdp11.ini  v1
; Known issue 131: SET DMCn/DMPn/DMVn NOPEER on the PDP-11 (Unibus DMC/DMP,
; then Qbus DMV), and a DMV attached after NOPEER listens (no connect).
set cpu 11/34
set dmc enable
set dmc0 peer=127.0.0.1:21302
set dmc0 nopeer
show dmc0 peer
set dmp enable
set dmp0 peer=127.0.0.1:21302
set dmp0 nopeer
show dmp0 peer
set dmc disable
set dmp disable
set cpu 11/73
set dmv enable
set dmv0 peer=127.0.0.1:21302
set dmv0 nopeer
show dmv0 peer
attach dmv0 21392
show dmv0 peer
detach dmv0
exit
