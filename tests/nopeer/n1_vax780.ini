; open-simh-extended/tests/nopeer/n1_vax780.ini  v1
; Known issue 131: SET ... NOPEER on the vax780 (DMC11, DMR11, DMP11, DMF32).
; Each block: set a PEER, show it, NOPEER, show "peer=unspecified";
; then the refusals: NOPEER=x (invalid argument), NOPEER while attached.
set dmc enable
set dmc0 peer=127.0.0.1:21302
set dmc0 nopeer
show dmc0 peer
set dmc0 type=dmr
set dmc0 peer=127.0.0.1:21302
set dmc0 nopeer
show dmc0 peer
set dmp enable
set dmp lines=2
set dmp1 peer=127.0.0.1:21303
set dmp1 nopeer
show dmp1 peer
set dmp0 peer=127.0.0.1:21302
set dmp0 nopeer=x
show dmp0 peer
attach dmp0 21390
set dmp0 nopeer
detach dmp0
set dmp0 nopeer
show dmp0 peer
; DMF32 sync line: both spellings
set dmf enable
set dmf peer=127.0.0.1:21304
set dmf nopeer
show dmf peer
set dmf-sync peer=127.0.0.1:21304
set dmf-sync nopeer
show dmf peer
set dmf-sync peer=127.0.0.1:21304
attach dmf-sync 21391
set dmf-sync nopeer
detach dmf-sync
set dmf-sync nopeer
show dmf peer
exit
